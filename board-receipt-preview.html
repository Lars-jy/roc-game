<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11110e">
  <title>R.O.C · 调查桌</title>
  <link rel="stylesheet" href="./src/board-receipt-preview.css">
  <link rel="stylesheet" href="./src/subscription-paper.css">
  <link rel="stylesheet" href="./src/monthly-contracts.css">
  <link rel="stylesheet" href="./src/scene-navigation.css">
  <script type="module" src="./src/scene-navigation.js" blocking="render"></script>
  <link rel="stylesheet" href="./src/paper-theme.css">
  <link rel="stylesheet" href="./src/roc-theme.css">
</head>
<body inert>
  <main class="board-room">
    <header class="game-top">
      <div class="brand"><span>第一章</span><h1>R.O.C</h1></div>
      <nav class="month-timeline" aria-label="调查时间线">
        <span class="active" aria-current="date">4月</span><span>5月</span><span>6月</span><span>7月</span>
      </nav>
      <button id="open-tutorial" class="tutorial-trigger" type="button" aria-haspopup="dialog" aria-controls="tutorial-dialog">教学</button>
    </header>

    <div class="finance-strip" aria-label="资金摘要">
      <button class="finance-metric account-trigger" id="open-account" type="button" aria-label="查看资金流水"><small>可用现金</small><strong id="cash-amount">¥ —</strong></button>
      <span class="finance-metric"><small>累计收益</small><strong id="earnings-amount">¥ —</strong></span>
    </div>

    <a class="scene-next" href="./characters-room-preview.html?from=desk" aria-label="人物访谈"><span aria-hidden="true"></span></a>
    <button class="case-blackboard" id="open-questions" type="button" aria-label="打开问答推理桌">
      <span class="hanging-cord" aria-hidden="true"></span>
      <span class="board-surface" aria-hidden="true">
        <span class="board-photo photo-lu"></span><span class="board-photo photo-zhou"></span><span class="board-photo photo-lin"></span><span class="board-photo photo-file"></span>
        <svg class="board-threads" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="23" y1="20" x2="77" y2="22"/><line x1="23" y1="20" x2="55" y2="62"/><line x1="77" y1="22" x2="55" y2="62"/><line x1="22" y1="72" x2="55" y2="62"/><circle cx="23" cy="20" r="2.2"/><circle cx="77" cy="22" r="2.2"/><circle cx="55" cy="62" r="2.2"/><circle cx="22" cy="72" r="2.2"/></svg>
        <span class="board-caption">调查板</span>
      </span>
    </button>

    <section class="board-space" aria-label="分层消除牌局">
      <div id="tile-field" class="tile-field"></div>
    </section>

    <div class="world-receiving-layer">
    <aside class="receipt-window" aria-label="收件窗口">
      <div class="receipt-art">
      <div class="window-glass" aria-hidden="true"></div>
      <div class="window-mullion" aria-hidden="true"></div>
      <div class="receipt-stage">
        <div id="receipt-stack" aria-label="收到的调查资料"></div>
        <div id="delivery-animation" aria-hidden="true">
          <div class="delivering-sheet"></div>
        </div>
      </div>
      <div class="counter-sill" aria-hidden="true"></div>
      </div>
    </aside>
    </div>
    <footer class="window-caption">
      <span>收件窗口</span><span id="mail-count" aria-live="polite">待取件 0</span>
      <a class="talk-count" href="./characters-room-preview.html?from=desk"><span id="talk-count" aria-live="polite">待谈话 0</span></a>
    </footer>

    <section class="tile-dock" aria-label="牌槽与道具">
      <div class="reserve-bar"><div id="reserve"></div></div>
      <div id="tray" aria-label="七格卡槽"></div>
      <div class="tool-bar">
        <button class="tool" type="button" data-tool="remove"><span class="tool-icon">⇧</span><span>移出三张</span><small>1</small></button>
        <button class="tool" type="button" data-tool="undo"><span class="tool-icon">↶</span><span>撤回</span><small>1</small></button>
        <button class="tool" type="button" data-tool="shuffle"><span class="tool-icon">⤨</span><span>洗牌</span><small>1</small></button>
        <button class="fast-clear" type="button" id="fast-clear-round">速通牌局</button>
      </div>
    </section>
    <button class="desk-restart" type="button" id="restart-round"><span>重开</span><small>（只赚钱，无调查资料）</small></button>
    <button class="desk-restart desk-resume" type="button" id="resume-investigation" aria-label="继续调查，保留已有资料与机会" hidden><span>继续调查</span></button>
    <div id="board-feedback" aria-live="polite"></div>
    <button class="month-action" id="month-action" type="button">本月合同</button>
  </main>

  <dialog id="tutorial-dialog" aria-label="游戏教学">
    <img class="tutorial-page" src="./assets/tutorial/01.webp" width="1920" height="1080" loading="lazy" alt="开始调查：开场与认购">
    <img class="tutorial-page" src="./assets/tutorial/02.webp" width="1920" height="1080" loading="lazy" alt="消牌、取件与推进月份" hidden>
    <img class="tutorial-page" src="./assets/tutorial/03.webp" width="1920" height="1080" loading="lazy" alt="连线、访谈与填写报告" hidden>
    <nav class="tutorial-controls" aria-label="教学图片翻页">
      <button type="button" id="tutorial-previous" disabled>上一页</button>
      <span id="tutorial-count" aria-live="polite">1 / 3</span>
      <button type="button" id="tutorial-next">下一页</button>
      <button type="button" id="tutorial-close" data-close-dialog="tutorial-dialog" autofocus>关闭</button>
    </nav>
  </dialog>
  <dialog id="paper-reader" aria-label="调查资料原件">
    <header><h2 id="reader-title"></h2><span class="reader-actions"><button type="button" id="ledger-reset" hidden>重新调查</button><button type="button" id="document-hint">查看提示</button><button type="button" id="close-reader" aria-label="收起资料">收起</button></span></header>
    <p id="document-hint-text" hidden></p>
    <div id="reader-content"><iframe id="reader-frame" title="调查资料原件"></iframe></div>
  </dialog>
  <dialog id="month-dialog" class="chapter-dialog" aria-label="本月调查进度">
    <header><h2 id="month-title">本月调查</h2><button type="button" data-close-dialog="month-dialog" aria-label="收起本月调查">×</button></header>
    <div id="month-content"></div>
  </dialog>
  <div id="chapter-toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/board-receipt-preview.js"></script>
</body>
</html>
