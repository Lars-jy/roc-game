osition:0% 0;mask-position:0% 0}\n}\n","src/paper-theme.css":"/* Shared reading palette. Original files keep their typography and geometry. */\n:root {\n  --archive-paper: #d6cdbb;\n  --archive-paper-alt: #ccc1ac;\n  --archive-paper-light: #e0d8c9;\n  --archive-paper-ink: #2f2a23;\n  --archive-paper-muted: #5c5142;\n  --archive-paper-rule: #82745b;\n  --archive-document-filter: sepia(.42) saturate(.65) brightness(.84);\n}\n\n/* Tint the native PDF as a sheet of printed paper. A fixed multiply layer\n   avoids filtering/re-rasterizing the embedded browser PDF renderer itself. */\n#reader-frame.is-original-document {\n  background: #36322c;\n}\n#reader-content:has(> #reader-frame.is-original-document) {\n  position: relative;\n  isolation: isolate;\n}\n#reader-content:has(> #reader-frame.is-original-document)::after {\n  content: '';\n  position: absolute;\n  z-index: 2;\n  inset: 0;\n  background: var(--archive-paper);\n  mix-blend-mode: multiply;\n  pointer-events: none;\n}\n.original-page > img {\n  filter: var(--archive-document-filter);\n}\n\n/* Dynamic account/notice records are rendered inside their own document. */\nbody.archive-document-view {\n  background: #353129;\n  color: var(--archive-paper-ink);\n  color-scheme: light;\n}\nbody.archive-document-view .document-paper {\n  background: var(--archive-paper);\n  color: var(--archive-paper-ink);\n  box-shadow: inset 0 0 32px #65503214, 0 8px 24px #0005;\n}\nbody.archive-document-view .document-paper th {\n  background: var(--archive-paper-alt);\n  color: var(--archive-paper-ink);\n}\nbody.archive-document-view .document-paper td {\n  background: transparent;\n}\nbody.archive-document-view .document-paper th,\nbody.archive-document-view .document-paper td {\n  border-color: var(--archive-paper-rule);\n}\n","src/roc-theme.css":"/* R.O.C: the cover's vermilion thread is an accent, not a screen tint.\n   Keep readable paper and the existing scene artwork independent of this UI layer. */\n:root {\n  --roc-red: #b6 ark); border-color: var(--roc-red-edge); color: #f3dfca; }\n\n/* The inference desk keeps its dark felt and pale photographs. Red means a\n   selected thread, a recorded connection, or a verified mark, never a paper fill. */\nbody.investigation-app { --accent: var(--roc-red-light); }\n.investigation-app .workbench-header { border-bottom-color: #a34d3a48; }\n.investigation-app .case-brand h1 { letter-spacing: .18em; }\n.investigation-app .case-tabs button.active { color: #efd3bc; }\n.investigation-app .case-tabs button.active::after { background: var(--roc-red); }\n.investigation-app .case-tabs a:hover { color: #efd3bc; box-shadow: inset 0 -2px var(--roc-red); }\n.investigation-app .chapter-actions [data-action=\"fast-answer\"] { background: var(--roc-red-dark); border-color: var(--roc-red-edge); color: #f3dfca; }\n.investigation-app .chapter-actions button:hover { border-color: var(--roc-red-edge); background: #311a1766; }\n.investigation-app .library-tabs button.active { color: #f0d5c5; background: #8e352822; box-shadow: inset 0 -1px var(--roc-red); }\n.investigation-app .library-card.placed,\n.investigation-app .library-card.is-placed { border-left-color: var(--roc-red); }\n.investigation-app .library-card.selected { border-color: var(--roc-red-edge); background: #61312521; }\n.investigation-app .library-card:hover { border-color: #b16d598a; }\n.investigation-app .board-viewport {\n  background:\n    radial-gradient(ellipse at center,transparent 25%,#0007 110%),\n    radial-gradient(ellipse at 89% 5%,#6c292214,transparent 42%),\n    radial-gradient(circle,#a6a8980e 1.8px,transparent 2.4px) 0 0/10px 10px,\n    radial-gradient(circle,#b7b9a20b 1.8px,transparent 2.4px) 5px 5px/10px 10px,\n    linear-gradient(122deg,#1d1e20,#18191b 60%,#151719);\n}\n.investigation-app .wire { stroke: #b86652e0; stroke-width: 3; }\n.investigation-app .wire.valid,\n.investigation-app .wire.correct { stroke: #c96a54; }\n.investigation-app .wire.selected { stroke: var(--roc-red-light); stroke-width: 4; }\n.investigation-app .wire-draft { stroke: #e6ac91; }\n.investigation-app .investigation-card.is-selected,\n.investigation-app .investigation-card.is-front { outline-color: var(--roc-red); }\n.investigation-app .investigation-card.drop-target { outline-color: #bd5542; }\n.investigation-app .question-port:hover,\n.investigation-app .question-port.selected { box-shadow: 0 0 0 4px #9d3c303a,1px 2px 2px #0008; }\n.investigation-app .boolean-toggle button.selected,\n.investigation-app .boolean-toggle button[data-yes='true'].selected,\n.investigation-app .boolean-toggle button[data-yes='false'].selected {\n  background: #843b31; border-color: #663026; color: #fff0dc;\n}\n.investigation-app .question-state.correct,\nbody.investigation-app .investigation-card.photo-sheet .question-state.correct { color: #982e27; }\n.investigation-app .task-stamp {\n  border-color: #a6322bd6; color: #9d3028cf;\n  background: radial-gradient(circle,#c45a4012,transparent 75%);\n  text-shadow: 1px 0 #ae433655;\n}\n.investigation-app .task-stamp::after { border-color: #a6322ba6; }\n.investigation-app .task-progress-track > span,\n.investigation-app .progress-track span,\n.investigation-app .progress-track i { background: var(--roc-red); }\n.investigation-app .task-progress-item.is-complete .task-progress-caption { color: #edc5ad; }\n.investigation-app .task-progress-item.is-complete .task-progress-number { color: var(--roc-red-light); }\n.investigation-app .board-controls button:hover { border-color: var(--roc-red-edge); color: #edc5ad; background: #31201b; }\n.investigation-app .connection-status { border-left-color: var(--roc-red); }\n.investigation-app button:focus-visible,\n.investigation-app input:focus-visible,\n.investigation-app a:focus-visible,\n.investigation-app textarea:focus-visible { outline-color: var(--roc-red-edge); }\n\n/* Red seals the decision; contract text and financial figures stay dark ink. */\n.subscription-side .paper-confirm {\n  background: var(--roc-r
