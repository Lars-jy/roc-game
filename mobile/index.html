rn fail('申请本金超出未结清余额');\n        if (typeof action.reason !== 'string' || !action.reason.trim() || action.reason.length > 2000) return fail('请填写本次退出理由');\n        if (state.requests.some(request => request.month === state.month)) return fail('本月已经正式申请过退出');\n        const quote = state._quotes[state.month], success = state._outcomes[state.month];\n        const received = success ? exitCash(action.amount, quote) : 0;\n        const loss = success ? action.amount - received : 0;\n        const request = { id: action.id, month: state.month, day: state.day, amount: action.amount, reason: action.reason, quote, success, received, loss };\n        state.requests.push(request);\n        if (success) {\n          extinguishLots(state, action.amount, quote);\n          entry(state, { id: action.id, type: 'exit-approved', label: '折价退出实际到账', amount: received, requested: action.amount, quote, cashDelta: received, principalDelta: -action.amount, lossDelta: loss });\n          state.totalReturned += received;\n        } else entry(state, { id: action.id, type: 'exit-refused', label: '退出申请未获受理', amount: 0, requested: action.amount, quote });\n        events.push({ type: success ? 'exit-approved' : 'exit-refused', amount: received, requested: action.amount, quote, loss, reason: action.reason, month: state.month, day: state.day });\n        break;\n      }\n      case 'boardReward':\n        if (action.month !== state.month) return fail('这笔清盘奖励不属于当前月份');\n        if (state._boardPaid[state.month]) return { state: current, error: null, events: [], duplicate: true };\n        state._boardPaid[state.month] = true;\n        state.earnedTile += BOARD_REWARD;\n        entry(state, { id: action.id, type: 'board-reward', label: '当月首次清盘奖金', amount: BOARD_REWARD, cashDelta: BOARD_REWARD });\n        events.push({ type: 'board-reward', amount: BOARD_REWARD, month: state.month });\n        break;\n      case 'replayReward':\n        if (action.month !== state.month || state.day !== 2 || !Number.isSafeInteger(action.attempt) || action.attempt \u003c 1) return fail('这笔重开清盘奖励不属于当前牌局');\n        if (state.ledger.some(row => row.type === 'board-replay-reward' && row.month === state.month && row.attempt === action.attempt)) return { state: current, error: null, events: [], duplicate: true };\n        state.earnedTile += BOARD_REWARD;\n        entry(state, { id: action.id, type: 'board-replay-reward', label: '重开牌局清盘奖金', amount: BOARD_REWARD, cashDelta: BOARD_REWARD, attempt: action.attempt });\n        events.push({ type: 'board-reward', amount: BOARD_REWARD, month: state.month, attempt: action.attempt, replay: true });\n        break;\n      default: return fail('未知资金操作');\n    }\n    if (transactionTypes.has(action.type)) state._processed.push(action.id);\n    if (!validateFinance(state)) return fail('资金记录校验失败，本次操作未执行');\n    return { state, error: null, events };\n  } catch (error) { return fail(error.message || '资金操作未执行'); }\n}\n\nfunction sameDraws(state) {\n  const expected = draws(state._seed);\n  return JSON.stringify(state._quotes) === JSON.stringify(expected.quotes)\n    && JSON.stringify(state._outcomes) === JSON.stringify(expected.outcomes);\n}\n\nexport function validateFinance(state) {\n  try {\n    if (!object(state) || state.version !== FINANCE_VERSION || state.initial !== INITIAL_CASH || typeof state._seed !== 'string' || state._seed.length > 160) return false;\n    if (!Number.isInteger(state.month) || state.month \u003c 0 || state.month > 3 || ![1, 2].includes(state.day) || typeof state.crisis !== 'boolean' || !sameDraws(state)) return false;\n    const funds = ['cash', 'principal', 'totalInterest', 'totalInvested', 'totalReturned', 'totalLoss', 'unpaidInterest', 'earnedTile'];\n    if (!funds.every(key => money(state[key]))) return false;\n    if (state.cash !== INITIAL_CASH + state.earnedTile + state.totalInterest + state.totalReturned - state.totalInvested) return false;\n    if (state.principal !== state.totalInvested - state.totalReturned - state.totalLoss) return false;\n    if (!['ledger', 'lots', 'requests', 'settlements', '_processed', '_crises'].every(key => Array.isArray(state[key]) && state[key].length \u003c= 10_000)) return false;\n    if (!Array.isArray(state._boardPaid) || state._boardPaid.length !== 4 || !state._boardPaid.every((paid, month) => typeof paid === 'boolean' && (month \u003c= state.month || !paid))) return false;\n    const replays = state.ledger.filter(row => row.type === 'board-replay-reward');\n    if (state.earnedTile !== (state._boardPaid.filter(Boolean).length + replays.length) * BOARD_REWARD) return false;\n    const replayKeys = new Set();\n    for (const row of replays) {\n      const key = `${row.month}:${row.attempt}`;\n      if (!Number.isSafeInteger(row.attempt) || row.attempt \u003c 1 || row.day !== 2 || replayKeys.has(key)) return false;\n      replayKeys.add(key);\n    }\n    if (new Set(state._processed).size !== state._processed.length || !state._processed.every(idString)) return false;\n    const atOrBefore = item => Number.isInteger(item.month) && item.month >= 0 && item.month \u003c= state.month && [1, 2].includes(item.day) && (item.month \u003c state.month || item.day \u003c= state.day);\n    const ids = new Set();\n    let balance = INITIAL_CASH, principal = 0, loss = 0, unpaid = 0, invested = 0, returned = 0, interest = 0, board = 0, lastDate = 0;\n    for (const row of state.ledger) {\n      if (!object(row) || !idString(row.id) || ids.has(row.id) || !atOrBefore(row) || !money(row.amount) || typeof row.label !== 'string') return false;\n      ids.add(row.id);\n      const date = row.month * 2 + row.day - 1;\n      if (date \u003c lastDate) return false;\n      lastDate = date;\n      if (![row.cashDelta, row.principalDelta, row.lossDelta, row.unpaidDelta].every(Number.isSafeInteger)) return false;\n      let expected;\n      switch (row.type) {\n        case 'invest': expected = [-row.amount, row.amount, 0, 0]; invested += row.amount; break;\n        case 'board-reward': case 'board-replay-reward': expected = [row.amount, 0, 0, 0]; board += row.amount; if (row.amount !== BOARD_REWARD) return false; break;\n        case 'interest-paid': expected = [row.amount, 0, 0, 0]; interest += row.amount; break;\n        case 'interest-unpaid': expected = [0, 0, 0, row.amount]; break;\n        case 'exit-approved':\n          if (!money(row.requested) || !Number.isInteger(row.quote) || row.quote !== state._quotes[row.month] || row.amount !== exitCash(row.requested, row.quote)) return false;\n          expected = [row.amount, -row.requested, row.requested - row.amount, 0]; returned += row.amount; break;\n        case 'exit-refused':\n          if (row.amount !== 0 || !money(row.requested) || row.quote !== state._quotes[row.month]) return false;\n          expected = [0, 0, 0, 0]; break;\n        case 'crisis': if (row.amount !== 0) return false; expected = [0, 0, 0, 0]; break;\n        default: return false;\n      }\n      if ([row.cashDelta, row.principalDelta, row.lossDelta, row.unpaidDelta].some((value, index) => value !== expected[index])) return false;\n      balance += row.cashDelta; principal += row.principalDelta; loss += row.lossDelta; unpaid += row.unpaidDelta;\n      if (balance \u003c 0 || principal \u003c 0) return false;\n    }\n    if (balance !== state.cash || principal !== state.principal || loss !== state.totalLoss || unpaid !== state.unpaidInterest || invested !== state.totalInvested || returned !== state.totalReturned || interest !== state.totalInterest || board !== state.earnedTile) return false;\n    const lotIds = new Set();\n    for (const lot of state.lots) {\n      if (!object(lot) || !idString(lot.id) || lotIds.has(lot.id) || !atOrBefore(lot) || !['amount', 'remaining', 'returned', 'loss'].every(key => money(lot[key]))) return false;\n      lotIds.add(lot.id);\n      if (lot.amount !== lot.remaining + lot.returned + lot.loss || lot.amount \u003c= 0 || lot.firstDue?.month !== lot.month + 1 || lot.firstDue?.day !== 1) return false;\n      const matching = state.ledger.find(row => row.id === lot.id && row.type === 'invest');\n      if (!matching || matching.month !== lot.month || matching.day !== lot.day || matching.amount !== lot.amount) return false;\n    }\n    if (state.lots.length !== state.ledger.filter(row => row.type === 'invest').length || state.lots.reduce((sum, lot) => sum + lot.remaining, 0) !== state.principal || state.lots.reduce((sum, lot) => sum + lot.returned, 0) !== state.totalReturned || state.lots.reduce((sum, lot) => sum + lot.loss, 0) !== state.totalLoss) return false;\n    const requestMonths = new Set();\n    for (const request of state.requests) {\n      if (!object(request) || !idString(request.id) || !atOrBefore(request) || requestMonths.has(request.month) || !money(request.amount) || request.amount \u003c= 0 || typeof request.reason !== 'string' || !request.reason.trim() || request.reason.length > 2000) return false;\n      requestMonths.add(request.month);\n      if (request.quote !== state._quotes[request.month] || request.success !== state._outcomes[request.month] || request.received !== (request.success ? exitCash(request.amount, request.quote) : 0) || request.loss !== (request.success ? request.amount - request.received : 0)) return false;\n      const matching = state.ledger.find(row => row.id === request.id && row.type === (request.success ? 'exit-approved' : 'exit-refused'));\n      if (!matching || matching.month !== request.month || matching.day !== request.day || matching.requested !== request.amount || matching.amount !== request.received) return false;\n    }\n    if (state.requests.length !== state.ledger.filter(row => row.type.startsWith('exit-')).length) return false;\n    for (let month = 0; month \u003c 4; month++) if (state.ledger.filter(row => row.type === 'board-reward' && row.month === month).length !== Number(state._boardPaid[month])) return false;\n    if (state._processed.length !== state.lots.length + state.requests.length + state._boardPaid.filter(Boolean).length + replays.length || !state._processed.every(id => ids.has(id))) return false;\n    const crisisMonths = new Set();\n    for (const crisis of state._crises) {\n      if (!object(crisis) || !atOrBefore(crisis) || crisisMonths.has(crisis.month)) return false;\n      crisisMonths.add(crisis.month);\n      if (!state.ledger.some(row => row.type === 'crisis' && row.month === crisis.month && row.day === crisis.day)) return false;\n    }\n    if (state.crisis !== crisisMonths.has(state.month) || state.ledger.filter(row => row.type === 'crisis').length !== state._crises.length) return false;\n    // Rebuild interest principal-days from actual dated transactions. All day-1\n    // changes count on day 1; successful exits remove the full requested capital.\n    let runningPrincipal = 0;\n    if (state.settlements.length !== state.month) return false;\n    for (let month = 0; month \u003c= state.month; month++) {\n      const endDay = month \u003c state.month ? MONTH_DAYS[month] : state.day - 1;\n      let units = 0;\n      for (let day = 1; day \u003c= MONTH_DAYS[month]; day++) {\n        runningPrincipal += state.ledger.filter(row => row.month === month && row.day === day).reduce((sum, row) => sum + row.principalDelta, 0);\n        if (day \u003c= endDay) units += runningPrincipal;\n      }\n      if (month === state.month) {\n        if (!object(state._accrual) || state._accrual.month !== month || state._accrual.throughDay !== endDay || state._accrual.weightedPrincipalDays !== units) return false;\n      } else {\n        const settlement = state.settlements[month];\n        const amount = dueInterest(units, MONTH_DAYS[month]);\n        if (!object(settlement) || settlement.month !== month || settlement.days !== MONTH_DAYS[month] || settlement.weightedPrincipalDays !== units || settlement.amount !== amount || typeof settlement.paid !== 'boolean' || settlement.paymentMonth !== month + 1 || settlement.paymentDay !== 1) return false;\n        const matching = state.ledger.find(row => row.id === `sys:interest:${month}`);\n        if (!matching || matching.month !== month + 1 || matching.day !== 1 || matching.sourceMonth !== month || matching.amount !== amount || matching.type !== (settlement.paid ? 'interest-paid' : 'interest-unpaid')) return false;\n        const paymentIndex = state.ledger.indexOf(matching);\n        const crisisIndex = state.ledger.findIndex(row => row.type === 'crisis' && row.month === month + 1);\n        if (settlement.paid !== !(crisisIndex >= 0 && crisisIndex \u003c paymentIndex)) return false;\n      }\n    }\n    if (state.ledger.filter(row => row.type.startsWith('interest-')).length !== state.settlements.length) return false;\n    return true;\n  } catch { return false; }\n}\n\n/** Player-visible accounting only. No seed, future quote, future result or RNG. */\nexport function publicFinance(state) {\n  return clone({\n    initial: state.initial, cash: state.cash, principal: state.principal,\n    totalInterest: state.totalInterest, totalInvested: state.totalInvested,\n    totalReturned: state.totalReturned, totalLoss: state.totalLoss,\n    unpaidInterest: state.unpaidInterest, earnedTile: state.earnedTile,\n    month: state.month, day: state.day, crisis: state.crisis,\n    ledger: state.ledger, lots: state.lots, requests: state.requests,\n    settlements: state.settlements,\n    quote: state._quotes[state.month],\n    canRequest: state.principal > 0 && !state.requests.some(request => request.month === state.month),\n    rewardedThisMonth: state._boardPaid[state.month], nextDate: nextDate(state),\n  });\n}\n","src/body/tiles.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n/** Independent monthly tile rules. No investment, payout or document state lives here. */\nexport const BOARD_WIDTH = 12.4;\nexport const BOARD_HEIGHT = 7.5;\n\nexport const KINDS = Object.freeze([\n  ['cash', '钞票'], ['coin', '金币'], ['lens', '调查'], ['phone', '电话'],\n  ['folder', '档案'], ['ledger', '账本'], ['shield', '风控'], ['letter', '函件'],\n  ['stock', '股票'], ['bond', '债券'], ['bank', '银行'],\n  ['contract', '合约'], ['abacus', '算盘'], ['stamp', '印章'],\n].map(([id, label]) => Object.freeze({ id, label, investigation: ['lens', 'phone', 'folder', 'ledger'].includes(id) })));\n\nconst BY_KIND = new Map(KINDS.map(kind => [kind.id, kind]));\nconst VERSION = 3;\nconst COPIES = 15;\n// Keep the approved layout: retired fund/safe sets now use stock/bank faces.\nconst copiesFor = id => ['stock', 'bank'].includes(id) ? COPIES * 2 : COPIES;\nconst PREVIOUS_KINDS = [...KINDS, { id: 'safe', investigation: false }];\nconst LEGACY_KINDS = [...PREVIOUS_KINDS, { id: 'fund', investigation: false }];\nconst CAPACITY = 7;\nconst EPSILON = 1e-8;\n// Deliberately not serialized: legal order is for verification and the requested\n// quick-play button, never a player-facing hint or save field.\nconst WITNESSES = new WeakMap();\n\nfunction rng(seed) {\n  let value = seed >>> 0;\n  return () => {\n    value += 0x6D2B79F5;\n    let n = value;\n    n = Math.imul(n ^ n >>> 15, n | 1);\n    n ^= n + Math.imul(n ^ n >>> 7, n | 61);\n    return ((n ^ n >>> 14) >>> 0) / 4294967296;\n  };\n}\n\nfunction shuffled(items, random) {\n  const result = [...items];\n  for (let i = result.length - 1; i > 0; i -= 1) {\n    const j = Math.floor(random() * (i + 1));\n    [result[i], result[j]] = [result[j], result[i]];\n  }\n  return result;\n}\n\nfunction overlaps(lower, upper) {\n  return upper.z > lower.z && upper.x \u003c lower.x + 1 - EPSILON\n    && upper.x + 1 > lower.x + EPSILON && upper.y \u003c lower.y + 1 - EPSILON\n    && upper.y + 1 > lower.y + EPSILON;\n}\n\nfunction geometry() {\n  const tiles = [];\n  const rows = [\n    [6, 6, 6, 6, 6], [6, 6, 6, 6, 6],\n    [4, 6, 6, 4, 4], [4, 6, 6, 4, 4], [4, 6, 4, 6, 4],\n    [4, 6, 4, 4], [4, 4, 6, 4], [4, 4, 4],\n  ];\n  rows.forEach((layer, z) => layer.forEach((count, row) => {\n    for (let col = 0; col \u003c count; col += 1) {\n      tiles.push({ x: 3.05 + (6 - count) / 2 + col + (z % 2 ? 0.4 : 0),\n        y: 0.2 + (5 - layer.length) / 2 + row + (z % 3) * 0.1, z, region: 'center' });\n    }\n  }));\n  for (let col = 0; col \u003c 6; col += 1) {\n    tiles.push({ x: 3.25 + col, y: 6.2, z: 0, region: 'buffer' });\n  }\n  for (const region of ['left', 'right']) {\n    for (let z = 0; z \u003c 27; z += 1) {\n      tiles.push({ x: region === 'left' ? 0.55 + z * 0.018 : 10.8 - z * 0.018,\n        y: 1.6 + z * 0.075, z, region });\n    }\n  }\n  return tiles.map((tile, index) => ({ id: `tile-${String(index + 1).padStart(3, '0')}`, ...tile, kind: null, removed: false }));\n}\n\nconst GEOMETRY = geometry();\nconst GEOMETRY_BY_ID = new Map(GEOMETRY.map(tile => [tile.id, tile]));\n// The approved 240 positions are shared by every deal, including restored saves.\n// Record their overlaps once; only which IDs remain changes during play.\nconst covering = new Map(GEOMETRY.map(tile => [tile.id, []]));\nconst releases = new Map(GEOMETRY.map(tile => [tile.id, []]));\nfor (const lower of GEOMETRY) {\n  for (const upper of GEOMETRY) {\n    if (!overlaps(lower, upper)) continue;\n    covering.get(lower.id).push(upper.id);\n    releases.get(upper.id).push(lower.id);\n  }\n}\n\nexport function pickableMonthlyTiles(board) {\n  if (board.status !== 'playing') return new Set();\n  const remaining = new Set(board.tiles.filter(tile => !tile.removed).map(tile => tile.id));\n  const available = new Set();\n  for (const id of remaining) {\n    if (!covering.get(id).some(upper => remaining.has(upper))) available.add(id);\n  }\n  return available;\n}\n\n/** Geometry-only legal order, with no preference for matching faces. */\nfunction removalOrder(random) {\n  const blockers = new Map(GEOMETRY.map(tile => [tile.id, covering.get(tile.id).length]));\n  const available = GEOMETRY.filter(tile => !blockers.get(tile.id)).map(tile => tile.id);\n  const order = [];\n  while (available.length) {\n    const [id] = available.splice(Math.floor(random() * available.length), 1);\n    order.push(id);\n    for (const lowerId of releases.get(id)) {\n      const count = blockers.get(lowerId) - 1;\n      blockers.set(lowerId, count);\n      if (!count) available.push(lowerId);\n    }\n  }\n  return order;\n}\n\n/**\n * Construct a legal inventory sequence with sustained tray pressure. Five different\n * faces open the witness; its first match needs seven picks. Thereafter choices\n * favor carrying several incomplete groups, rather than consecutive easy triples.\n * This proves existence of a solution, not that arbitrary play or a shuffle is safe.\n */\nfunction pressureSequence(random) {\n  const remaining = new Map(KINDS.map(kind => [kind.id, copiesFor(kind.id)]));\n  const held = new Map(KINDS.map(kind => [kind.id, 0]));\n  const sequence = [];\n  let occupied = 0;\n  while (sequence.length \u003c GEOMETRY.length) {\n    const candidates = [];\n    for (const kind of KINDS) {\n      if (!remaining.get(kind.id)) continue;\n      const current = held.get(kind.id);\n      const nextOccupied = current === 2 ? occupied - 2 : occupied + 1;\n      if (nextOccupied >= CAPACITY) continue;\n      // Six unrelated singles cannot be continued without losing.\n      if (nextOccupied === 6 && !KINDS.some(other => (other.id === kind.id ? (current + 1) % 3 : held.get(other.id)) === 2)) continue;\n      if (sequence.length \u003c 5 && current !== 0) continue;\n      if (sequence.length === 5 && current !== 1) continue;\n      if (sequence.length === 6 && current !== 2) continue;\n      let weight = current === 0 ? (occupied \u003c 5 ? 8 : 0.5) : current === 1 ? 2.5 : occupied >= 5 ? 12 : 0.6;\n      weight *= remaining.get(kind.id);\n      const repeatsTriple = sequence.at(-1) === kind.id && sequence.at(-2) === kind.id;\n      const forcesTripleNext = current === 1 && nextOccupied === 6 && sequence.at(-1) === kind.id\n        && !KINDS.some(other => other.id !== kind.id && held.get(other.id) === 2);\n      candidates.push({ id: kind.id, weight, avoid: repeatsTriple || forcesTripleNext });\n    }\n    if (!candidates.length) throw new Error('Tile inventory cannot form a legal pressure sequence');\n    const choices = candidates.some(candidate => !candidate.avoid) ? candidates.filter(candidate => !candidate.avoid) : candidates;\n    let draw = random() * choices.reduce((sum, candidate) => sum + candidate.weight, 0);\n    const chosen = choices.find(candidate => (draw -= candidate.weight) \u003c 0) || choices.at(-1);\n    const previous = held.get(chosen.id);\n    occupied += previous === 2 ? -2 : 1;\n    held.set(chosen.id, (previous + 1) % 3);\n    remaining.set(chosen.id, remaining.get(chosen.id) - 1);\n    sequence.push(chosen.id);\n  }\n  if (occupied !== 0) throw new Error('Tile inventory left an incomplete group');\n  return sequence;\n}\n\nexport function createBoard(seed = 20261103) {\n  const normalizedSeed = Number.isFinite(Number(seed)) ? Number(seed) >>> 0 : 20261103;\n  const random = rng(normalizedSeed);\n  const order = removalOrder(random);\n  const kinds = pressureSequence(random);\n  const assignments = new Map(order.map((id, index) => [id, kinds[index]]));\n  const board = {\n    version: VERSION, seed: normalizedSeed,\n    tiles: GEOMETRY.map(tile => ({ ...tile, kind: assignments.get(tile.id) })),\n    tray: [], reserve: [], matches: 0, investigationMatches: 0,\n    tools: { remove: 1, undo: 1, shuffle: 1 }, status: 'playing', lastPick: null,\n  };\n  WITNESSES.set(board, order);\n  return board;\n}\n\n/** Initial-board legal order for verification/quick play; never consumes a prop. */\nexport function getSolution(board) {\n  return [...(WITNESSES.get(board) || [])];\n}\n\nexport function canPick(b lice(0, 3);\n    return { ...board, tray: board.tray.slice(removed.length), reserve: removed,\n      tools: { ...board.tools, remove: 0 },\n      lastPick: removed.includes(board.lastPick?.id) ? null : board.lastPick };\n  }\n  if (tool === 'undo') {\n    const last = board.lastPick;\n    if (!last || board.tray.at(-1) !== last.id) return board;\n    const tile = board.tiles.find(candidate => candidate.id === last.id);\n    if (!tile?.removed) return board;\n    const fromReserve = last.source === 'reserve';\n    const reserve = [...board.reserve];\n    if (fromReserve) reserve.splice(last.reserveIndex, 0, last.id);\n    return { ...board,\n      tiles: fromReserve ? board.tiles : board.tiles.map(candidate => candidate.id === last.id ? { ...candidate, removed: false } : candidate),\n      tray: board.tray.slice(0, -1), reserve, lastPick: null, tools: { ...board.tools, undo: 0 } };\n  }\n  const remaining = board.tiles.filter(tile => !tile.removed);\n  if (remaining.length \u003c 2 || new Set(remaining.map(tile => tile.kind)).size \u003c 2) return board;\n  const kinds = shuffled(remaining.map(tile => tile.kind), rng((board.seed ^ 0xA4F316D7 ^ board.matches * 0x9E3779B1) >>> 0));\n  // A random permutation can equal its input. Change that no-op without targeting the tray.\n  if (remaining.every((tile, i) => tile.kind === kinds[i])) {\n    const different = kinds.findIndex(kind => kind !== kinds[0]);\n    [kinds[0], kinds[different]] = [kinds[different], kinds[0]];\n  }\n  const assignment = new Map(remaining.map((tile, i) => [tile.id, kinds[i]]));\n  return { ...board,\n    tiles: board.tiles.map(tile => tile.removed ? tile : { ...tile, kind: assignment.get(tile.id) }),\n    tools: { ...board.tools, shuffle: 0 } };\n}\n\n/** Strict persisted-board validation, including inventory and already-earned matches. */\nfunction validateBoardVersion(board, version, kinds, copies) {\n  try {\n    if (!board || board.version !== version || !Number.isInteger(board.seed) || board.seed \u003c 0 || board.seed > 0xFFFFFFFF) return false;\n    if (!Array.isArray(board.tiles) || board.tiles.length !== GEOMETRY.length || !Array.isArray(board.tray) || !Array.isArray(board.reserve)) return false;\n    if (!['playing', 'failed', 'cleared'].includes(board.status) || !Number.isInteger(board.matches) || board.matches \u003c 0\n      || !Number.isInteger(board.investigationMatches) || board.investigationMatches \u003c 0) return false;\n    if (!board.tools || Object.keys(board.tools).length !== 3 || !['remove', 'undo', 'shuffle'].every(tool => [0, 1].includes(board.tools[tool]))) return false;\n    const byId = new Map();\n    const inventory = new Map(kinds.map(kind => [kind.id, 0]));\n    for (const tile of board.tiles) {\n      const original = GEOMETRY_BY_ID.get(tile?.id);\n      if (!original || byId.has(tile.id) || !inventory.has(tile.kind) || typeof tile.removed !== 'boolean') return false;\n      if (!['x', 'y', 'z', 'region'].every(key => tile[key] === original[key])) return false;\n      byId.set(tile.id, tile);\n      inventory.set(tile.kind, inventory.get(tile.kind) + 1);\n    }\n    if ([...inventory].some(([id, count]) => count !== copies(id))) return false;\n    if (board.tray.length > CAPACITY || board.reserve.length > 3 || board.reserve.length && board.tools.remove !== 0) return false;\n    const live = [...board.tray, ...board.reserve];\n    if (new Set(live).size !== live.length || live.some(id => !byId.get(id)?.removed)) return false;\n    const liveIds = new Set(live);\n    const matched = new Map(kinds.map(kind => [kind.id, 0]));\n    const trayCounts = new Map(kinds.map(kind => [kind.id, 0]));\n    for (const id of board.tray) trayCounts.set(byId.get(id).kind, trayCounts.get(byId.get(id).kind) + 1);\n    if ([...trayCounts.values()].some(count => count > 2)) return false;\n    for (const tile of board.tiles) if (tile.removed && !liveIds.has(tile.id)) matched.set(tile.kind, matched.get(tile.kind) + 1);\n    if ([...matched.values()] byId.get(id).kind === kind);\n    if (held.length >= 3) held.slice(0, 3).forEach(id => removed.add(id));\n  }\n  const tray = board.tray.filter(id => !removed.has(id));\n  const next = { ...board, version: VERSION, tiles, tray,\n    matches: board.matches + removed.size / 3,\n    lastPick: removed.size ? null : board.lastPick,\n    status: tray.length >= CAPACITY ? 'failed' : board.status === 'cleared' ? 'cleared' : 'playing',\n  };\n  return validateBoard(next) ? next : null;\n}\n","src/body/content.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { DOCUMENT_MAP } from 'https://roc-offline.invalid/src/materials.js';\nimport { QUESTIONS as PREVIOUS_QUESTIONS, getQuestionBranch } from 'https://roc-offline.invalid/src/main-demo-content.js';\nimport { publicFinance } from 'https://roc-offline.invalid/src/body/finance.js';\n\nexport const charInfo = Object.freeze({\n  lu: { id: 'lu', name: '陆衡', role: '客户经理', portrait: 'snake' },\n  zhou: { id: 'zhou', name: '周岚', role: '你的朋友', portrait: 'sheep' },\n  lin: { id: 'lin', name: '林乔', role: '财务经办', portrait: 'rabbit' },\n  me: { id: 'me', name: '我', role: '调查者', portrait: null },\n});\n\n/** These point to records and headings, never supply a suspicion or its answer. */\nexport const DOC_HINTS = Object.freeze({\n  D01: '可查看“项目介绍”和“收益与支付方式”，再对照认购协议的条款。',\n  D02: '可查看批次、锁定期限、收益支付日及退出申请条款。历史客户与本人条款分别登记。',\n  D03: '可查看每张回单的入账日期、金额、付款人和用途摘要。',\n  D04: '可查看JD-01项目及1—3月“可分配经营收益”，并与同项目同期业务核验对照。',\n  D05: '可查看核验范围、项目编号、期间、委托及成交记录、经营收益。',\n  D06: '可查看C户与M户的账户名称、控制关系和核验期间。',\n  D07: '可查看完整期间、期初期末余额、入款及PAY／TRF执行号；与M户及付款资料对照。',\n  D08: '可查看期初期末余额及TRF执行号，与C户对应记录对照。',\n  D09: '可查看各客户的认购日期、合同金额、批次、锁定期限和约定支付日。',\n  D10: '可查看付款指令中的来源流水、收款客户、用途及PAY执行号。',\n  D11: '可查看到账日期、实际金额及交易流水号，与同期间付款资料对照。',\n  D12A: '可查看历史到期日、应付本金、累计收益及资料截止日期。',\n  D12B: '可查看每次通知的发生日期、说明、影响期间，并与实际付款登记对照。',\n  D13: '可查看资产盘点截止日、银行余额、其他资产和资金口径。',\n  P01: '可查看本人认购日期、本金、首次约定结算日、日息及折价退出条款。',\n  P02: '可查看本人实际入账日期、金额和执行编号。',\n  P03: '可对照本人到账回单与本人资金登记的相同执行编号。',\n  C01: '可查看每月申请金额、报价、审批结果和实际到账。',\n  C02: '可查看本人资金登记的日期、类型、现金变动、本金变动及欠付记录。',\n});\n\nconst questionMonth = { Q1: 0, Q2: 1, Q3: 1, Q4: 2, Q5: 2, Q6: 3, Q7: 3, Q8: 3 };\nconst questionHints = {\n  Q1: '查看D03的“入账信息”、付款方和用途摘要。',\n  Q2: '对照D02的支付条款与D09的认购日期、锁定期限、约定支付日；题目截止日为3月31日。',\n  Q3: '对照D04与D05的项目编号、期间及经营收益栏目。',\n  Q4: '查看D06账户关系，对照D07与D08同一截止日的余额和TR执行号。',\n  Q5: '对照D09的合同登记范围与D07的流水起止期间、入款记录。',\n  Q6: '查看D07的来源和PAY执行号，再与D10或D11的相同编号对照。',\n  Q7: '回看D12B的发生日期和解释，再对照D05、D06、D07及D10或D11。',\n  Q8: '可以回看资料夹、人物消息和本人资金记录；不确定的地方也可以如实写下。',\n};\n\nexport const QUESTIONS = PREVIOUS_QUESTIONS.map(question => ({\n  ...question, phaseMin: questionMonth[question.id], hint: questionHints[question.id],\n  ...(question.id === 'Q7' ? {\n    title: '此前的解释说得通吗',\n    prompt: '此前发生延期时，陆衡以系统调整解释，并表示可以另行申请追加。结合已经核实的经营与付款资料，哪项判断最有依据？',\n    options: [\n      { id: 'A', text: '延期或随后恢复都只是技术问题，不必再核对资金来源。' },\n      { id: 'B', text: '以前付过收益，所以追加能保障本金安全。' },\n      { id: 'C', text: '只要发生一次延期，就能断定全部资金都被挪走。' },\n      { id: 'D', text: '技术解释不能消除已经核实的付款来源问题，追加也没有独立支付保证。' },\n    ],\n  } : {}),\n}));\nexport const QUESTION_MAP = Object.fromEntries(QUESTIONS.map(question => [question.id, question]));\n\nconst date = (month, day = 1) => `${month + 4}月${day}日`;\nconst yuan = cents => Number.isSafeInteger(cents) ? cents / 100 : 0;\nconst money = cents => yuan(cents).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nconst table = (title, headers, rows, moneyCols = []) => ({ kind: 'table', title, headers, rows, moneyCols });\nconst text = (title, body) => ({ kind: 'text', title, body });\nconst base = (state, id, title, type = 'spreadsheet', issuer = '金鼎财富 · 本人业务登记') => ({\n  id, title, shortTitle: title, type, issuer, date: date(state.month, state.finance.day),\n  number: `JD-${id}-PLAYER`, blocks: [],\n});\n\n/** Same structure as materials.renderDocument accepts; no view can move money. */\nexport function getDoc(state, id) {\n  if (!state?.available?.includes(id)) return null;\n  if (DOCUMENT_MAP[id] && id !== 'D12B') return DOCUMENT_MAP[id];\n  const f = state.finance;\n  if (id === 'D12B') {\n    const doc = base(state, id, '阶段性付款通知及历史登记', 'contract');\n    doc.blocks = [\n      table('已送达通知', ['通知编号', '发生日期', '说明', '当前记录'], state.crises.history.map(item => [\n        item.id, date(item.month, item.day), '部分收益支付因系统调整暂停处理',\n        item.month === state.month ? '发生当期；实际支付以登记为准' : '历史通知；该期欠付另列，后续各期支付以实际登记为准',\n      ])),\n      text('本期安排', '本通知只登记实际发生的阶段性异常。已经入账的款项不追回；过去应付未付金额继续登记，不因后续恢复自动补发。'),\n      text('申请与支付', '追加不构成优先支付或本金安全保证。本人折价退出按独立申请结果登记，不保证审批成功。'),\n    ];\n    return doc;\n  }\n  if (id === 'P01') {\n    const doc = base(state, id, '本人认购确认与业务条款', 'contract');\n    doc.blocks = [\n      table('本人认购登记', ['认购编号', '认购日期', '认购本金', '未结清本金', '首次约定结算日'], (f.lots || []).map(lot => [\n        lot.id, date(lot.month, lot.day), yuan(lot.amount), yuan(lot.remaining), date(lot.firstDue.month, lot.firstDue.day),\n      ]), [2, 3]),\n      text('认购状态', f.lots.length ? '仅列已实际确认的认购，收益不自动复投。' : '尚未确认认购。以下为供查阅条款，不是投资或银行付款凭证。'),\n      text('日息与结算', '月约定8%单利。按自然月实际天数和每日实际未结清本金分段计息，同月合并汇总到分。认购日计息；折价结清的申请本金当日停止计息。首次约定结算为下个月月初，不足整月按实际持有天数折算。'),\n      text('阶段性付款', '约定到期不等于实际到账。阶段性异常影响发生当月尚未执行的收益支付；已付收益不追回，历史欠付单独登记。'),\n      text('办理时间', state.flow === 'cards' ? '每月月初办理本月认购；上个月有实际认购且仍有未结清本金时，同时提供退出申请。本人可在确认前查阅、切换合同，最终确认一项后进入本月调查。' : '普通认购在每月月初办理。'),\n      text('折价退出', `${state.flow === 'cards' ? '退出申请仅在上述月初办理窗口开放，可从全部未结清本金中自选申请金额，并填写理由。' : '有未结清本金时可自选申请金额并填写理由。'}每月只可有效提交一次。当前退回报价为申请本金的${publicFinance(f).quote}%。批准后按该报价支付并结清所申请的本金，折价差额计为损失，其余未申请本金继续留存；未获批准则不扣钱、不减少本金。实际结果以退出申请与清算确认单为准。`),\n      text('阶段截止', '最后一个月（7月）仍可认购，首次约定结算日为8月1日。本阶段不提前兑现未来收益、不自动退本，也不将未结清本金自动计为损失。'),\n    ];\n    return doc;\n  }\n  if (id === 'P02') {\n    const receipts = f.ledger.filter(item => ['interest-paid', 'exit-approved'].includes(item.type) && item.cashDelta > 0);\n    if (!receipts.length) return null;\n    const doc = base(state, id, '本人实际到账登记', 'receipts', '本人业务收款登记');\n    doc.blocks = [table('实际入账', ['入账日期', '执行编号', '交易摘要', '实际金额'], receipts.map(item => [\n      date(item.month, item.day), item.id, item.label, yuan(item.cashDelta),\n    ]), [3]), text('范围说明', '只列本人已实际收到的收益与折价退出款，不将应付未付、约定收益或平台历史余额列为本人现金。此表不证明经营利润或完整平台资金来源。')];\n    return doc;\n  }\n  if (id === 'P03') {\n    const doc = base(state, id, '本人到账核对附件');\n    doc.blocks = [table('到账与登记对照', ['执行编号', '日期', '实际到账', '登记摘要'], f.ledger.filter(item => ['interest-paid', 'exit-approved'].includes(item.type) && item.cashDelta > 0).map(item => [\n      item.id, date(item.month, item.day), yuan(item.cashDelta), item.label,\n    ]), [2]), text('核对边界', '此附件只核对本人回单与本人业务登记。未取得平台对手方完整流水时，不据此补写认购款来源，也不把本人记录当作历史C户完整流水。')];\n    return doc;\n  }\n  if (id === 'C01') {\n    const doc = base(state, id, '本人退出申请与清算确认单');\n    doc.blocks = [table('已提交申请', ['日期', '申请编号', '申请本金', '退回报价', '结果', '实际到账', '确认损失'], f.requests.map(item => [\n      date(item.month, item.day), item.id, yuan(item.amount), `${item.quote}%`, item.success ? '已批准并执行' : '未批准', yuan(item.received), yuan(item.loss),\n    ]), [2, 5, 6]), text('本人资金截止', `可用现金${money(f.cash)}元；未结清本金${money(f.principal)}元；应付未付收益${money(f.unpaidInterest)}元。`), text('执行口径', '申请失败不减本金。成功时申请本金全额结清，实际退回与折价损失分别记账。已付收益保留，未付收益另列，不叠加其他批次执行折扣。')];\n    return doc;\n  }\n  if (id === 'C02') {\n    const doc = base(state, id, '本人连续资金登记');\n    doc.blocks = [table('本阶段资金变动', ['日期', '执行编号', '摘要', '现金变动', '本金变动', '欠付变动', '损失变动'], f.ledger.map(item => [\n      date(item.month, item.day), item.id, item.label, yuan(item.cashDelta), yuan(item.principalDelta), yuan(item.unpaidDelta), yuan(item.lossDelta),\n    ]), [3, 4, 5, 6]), text('资料范围', '本表仅为玩家本人资金登记，不是平台银行完整流水；牌局奖金与本人投资收支分别标注。历史1—3月平台 ties[char]);\r\n\r\nfunction renderCell(value, column, block) {\r\n  const isMoney = (block.moneyCols || []).includes(column);\r\n  const isPercent = (block.percentCols || []).includes(column);\r\n  const numeric = typeof value === 'number' && Number.isFinite(value);\r\n  let shown = value;\r\n  if (numeric && isMoney) shown = officeNumber.format(value);\r\n  else if (numeric && isPercent) shown = officePercent.format(value);\r\n  return `\u003ctd${numeric ? ' class=\"document-numeric\"' : ''}>${escapeHtml(shown)}\u003c/td>`;\r\n}\r\n\r\n/** Real text and tables, with no player-facing answer annotations or app controls. */\r\nexport function renderDocument(doc) {\r\n  if (!doc) return '';\r\n  const sections = (doc.blocks || []).map(block => {\r\n    const heading = block.title ? `\u003ch2>${escapeHtml(block.title)}\u003c/h2>` : '';\r\n    if (block.kind === 'table') {\r\n      const headers = (block.headers || []).map(value => `\u003cth scope=\"col\">${escapeHtml(value)}\u003c/th>`).join('');\r\n      const rows = (block.rows || []).map(row => `\u003ctr>${row.map((value, column) => renderCell(value, column, block)).join('')}\u003c/tr>`).join('');\r\n      return `\u003csection class=\"document-section\">${heading}\u003cdiv class=\"document-table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"${escapeHtml(block.title || '资料表格')}\">\u003ctable class=\"document-table\">\u003cthead>\u003ctr>${headers}\u003c/tr>\u003c/thead>\u003ctbody>${rows}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>`;\r\n    }\r\n    return `\u003csection class=\"document-section\">${heading}\u003cp>${escapeHtml(block.body)}\u003c/p>\u003c/section>`;\r\n  }).join('');\r\n  return `\u003carticle class=\"document-paper\" lang=\"zh-CN\" data-document=\"${escapeHtml(doc.id)}\">\u003cheader class=\"document-header\">\u003cp class=\"document-issuer\">${escapeHtml(doc.issuer)}\u003c/p>\u003ch1>${escapeHtml(doc.title)}\u003c/h1>\u003cdl class=\"document-meta\">\u003cdiv>\u003cdt>编号\u003c/dt>\u00 08', 'D13'], prompt: '我想核对C户和M户的完整流水。', reply: ['林乔：账户关系、两边流水，还有截止日的资产表，都在这里。', '林乔：C转M是内部调拨。追同一笔钱，先对执行号。'] },\n  { id: 'payouts', title: '问回款', subtitle: '合同怎么约定，客户实际收到了什么？', character: 'zhou', docs: ['D09', 'D10', 'D11', 'D12A'], shallowDocs: ['D09'], deepDocs: ['D10', 'D11', 'D12A'], prompt: '客户到期时间、付款指令和到账记录，能一起核对吗？', reply: ['周岚：我的回单你有了，其他客户的记录得问财务。', '林乔：登记是登记，到账是到账。这几份按流水号核对。'] },\n];\n\nconst opts = texts => texts.map((text, index) => ({ id: String.fromCharCode(65 + index), text }));\nexport const QUESTIONS = [\n  { id: 'Q1', number: '01', title: '回单能证明什么', prompt: '周岚连续三个月各收到4,800元，共14,400元。现在能确认什么？', options: opts(['项目已连续三个月产生足够的真实经营利润。', '周岚确实收到了钱，来源和本金能否退出仍需核实。', '她六万元本金已经收回14,400元。', '下一期收益和本金兑付已有保障。']), correct: 'B', requiredDocs: ['D03'], phaseMin: 0, hint: '看清回单证明的是“收到钱”，还是“钱从哪里来”。', rationale: '银行回单能证明入账事实。用途摘要由付款方填写，不能单凭它认定真实利润或本金退出能力。' },\n  { id: 'Q2', number: '02', title: '少了的960元', prompt: '截至3月31日，丙没有每月收到960元的回单。他1月1日投12,000元，月8%单利，锁定三个月，4月1日本息同付。该怎样记录？', options: opts(['已经拖欠三个月，应立即质问。', '尚未到期，继续核对到期本金及2,880元累计收益。', '锁定期间不产生收益，到期给多少都可以。', '未逐月付款符合合同，项目已被证明安全。']), correct: 'B', requiredDocs: ['D02', 'D09'], phaseMin: 0, hint: '先找支付日期，再判断“没收到”是否就是“拖欠”。', rationale: '三个月按单利累计2,880元，约定4月1日本息同付。3月31日尚未到期；这只排除该项指控，并不证明项目安全。' },\n  { id: 'Q3', number: '03', title: '月报和什么对照', prompt: '核对月报中的“可分配经营收益”是否真的由JD-01业务产生，最直接对照哪两份材料？', options: opts(['项目月报＋周岚回单。', '项目月报＋宣传邀约。', '项目月报＋同项目同期间的独立业务核验。', '认购协议＋客户到账汇总。']), correct: 'C', requiredDocs: ['D04', 'D05'], phaseMin: 0, hint: '两份材料是否在谈同一个项目、同一期间、同一种收益？', rationale: 'D04每期披露8,000元可分配经营收益，D05对完整对应业务和账簿核验为零。到账本身不能证明项目经营。' },\n  { id: 'Q4', number: '04', title: '钱还在不在', prompt: '历史期末C户0元；三期共7,000元转至M户，M户期初0、无其他收支、期末7,000元。两户都由平台控制。应怎样记录？', options: opts(['两户合计0元。', '两户合计14,000元。', '两户合计7,000元，不能重复加上内部转出金额。', '两户有7,000元，说明项目赚了7,000元利润。']), correct: 'C', requiredDocs: ['D06', 'D07', 'D08'], phaseMin: 0, hint: '同一笔钱从左口袋进入右口袋，会不会变成两笔？', rationale: '同一时点余额合计7,000元。内部调拨不产生新资产，也不等于项目利润。这是历史平台资金，不是玩家现金。' },\n  { id: 'Q5', number: '05', title: '十万元真的失踪了吗', prompt: '合同登记本金131,000元，其中旧客100,000元、新客31,000元；1至3月新认购入款31,000元。仅凭差额，能说“十万元在这三个月失踪”吗？', options: opts(['能，100,000元差额就是本期失踪资金。', '能，先向期初余额补入100,000元再追去向。', '不能，统计对象和期间不同，差额不能直接证明本期失踪。', '不能，所以其他资金疑点也已经排除。']), correct: 'C', requiredDocs: ['D06', 'D07', 'D09'], phaseMin: 0, hint: '合同存续金额是一张“现有合同清单”，本期入款是一段“期间流水”。', rationale: '存续合同登记额不能直接当作该窗口的入款或期初现金。排除这条不充分指控，也不会抹去已经核实的付款来源问题。' },\n  { id: 'Q6', number: '06', title: '旧客的收益是谁付的', prompt: '选两份材料，证明同一三期的新认购款进入C户，并被用于支付旧客收益。', options: opts(['C户完整流水。', '付款批次指令。', '旧客实际到账汇总。', '宣传邀约。', '项目月报。']), multiple: true, maxSelections: 2, correct: [['A', 'B'], ['A', 'C']], requiredDocs: ['D06', 'D07'], requiredAnyGroups: [['D10'], ['D11']], phaseMin: 0, hint: '一份锁定完整来源，另一份锁定付款用途或实际收款；执行号要能对上。', rationale: '完整C户流水限定了全部入款与支出，结合付款指令或实际到账汇总可核对新认购款支付旧客收益。只有指令和回单，仍缺完整资金来源边界。' },\n  { id: 'Q7', number: '07', title: '只是系统升级吗', prompt: '陆衡将延期解释为系统调整，并说追加可申请优先处理。结合已核实材料，哪项判断最有依据？', options: opts(['只是技术问题，不必再查资金来源。', '以前付过收益，追加就能提高本金安全性。', '延期一次就证明全部资金都被挪走。', '系统升级解释不了新认购款付旧客的安排，追加优先仍缺核实支持。']), correct: 'D', requiredDocs: ['D12B', 'D05', 'D06', 'D07'], requiredAnyGroups: [['D10'], ['D11']], phaseMin: 2, hint: '把这次延期，与之前已经核实的经营和付款事实分别看清。', rationale: '延期本身不足以证明全部资金被挪走；但技术解释也不能消除已核实的资金来源矛盾。追加优先没有独立支付保证。' },\n  { id: 'Q8', number: '08', title: '我的调查结论', type: 'open', prompt: '根据你亲自经历、查阅和听到的内容，写下自己的理解。', fields: OPEN_RESPONSE_FIELDS, options: [], requiredDocs: [], phaseMin: 0, hint: '可以回看已读资料、人物消息和自己的资金记录。仍不能确认的地方，可以写“不确定”。' },\n];\nexport const QUESTION_MAP = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));\n\nconst selectionKey = selection => (Array.isArray(selection) ? selection : [selection]).filter(Boolean).sort().join('');\nexport function isSupportedJudgment(questionId, selection) {\n  const q = QUESTION_MAP[questionId];\n  if (!q) return false;\n  if (q.type === 'open') return null;\n  const key = selectionKey(selection);\n  return Array.isArray(q.correct) ? q.correct.some(pair => selectionKey(pair) === key) : key === q.correct;\n}\nconst branch = (character, prompt, reply, grantDocs = [], actions = [], trail = '') => ({ character, prompt, reply: Array.isArray(reply) ? reply : [reply], grantDocs, actions, trail });\nconst BRANCHES = {\n  Q1: {\n    A: branch('lu', '周姐连续收了三个月，是项目一直在赚钱吗？', ['她收到的金额，你都看到了。项目介绍和月报也可以一起看。'], ['D04'], ['invest'], '向陆衡索取项目月报'),\n    B: branch('lu', '钱确实到了。项目具体怎么做，我想看月报和业务记录。', ['月报给你。要核验具体业务，我让资料组把对应回复也送来。'], ['D04', 'D05'], [], '回单判断 → 核对项目业务'),\n    C: branch('zhou', '这14,400元，算是把本金收回来一部分了吗？', ['不是，这是每个月的收益。我那六万还在里面，没取出来过。'], ['D09'], ['exit'], '追问周岚 → 本金尚未取回'),\n    D: branch('lu', '前面都付了，下一期也能照常拿到吗？', ['按计划走。你要办追加，我先把下一批的结算日期给你看。'], ['D02'], ['invest'], '了解后续认购条件'),\n  },\n  Q2: {\n    A: branch('lu', '丙每月该有960元，三个月怎么都没付？', ['看一下第二条。他是三个月锁定，4月1日本息一起结，不是每个月单独拿。'], ['D02', 'D12A'], [], '重新核对锁定与支付日期'),\n    B: branch('lin', '丙4月1日到期。本金和2,880元累计收益，怎么安排？', ['到期表给你。它是计划，实际有没有付，还要看银行到账。'], ['D12A'], [], '合同日期 → 核对到期付款计划'),\n    C: branch('lin', '锁定期间，收益是不是就不算了？', ['还在累计。12,000乘8%，再乘三个月，是2,880。锁定的是支付时间。'], ['D02', 'D09'], [], '核对单利累计条款'),\n    D: branch('lu', '这几笔没逐月付，是按合同来的？', ['对，批次不同。你自己的体验批次单独登记，别和锁定三个月的那组混了。'], [], ['invest'], '了解本人体验批次'),\n  },\n  Q3: {\n    A: branch('zhou', '你的钱到了，能证明月报这8,000元是真的吗？', ['我能确认钱到了，具体交易赚没赚，我也没看过。你还是核一下项目吧。'], ['D05'], [], '到账记录 → 补查业务核验'),\n    B: branch('lu', '宣传和月报都说项目赚钱，有交易记录能对上吗？', ['月报是按项目出的。你要具体核对，我让财务把核验副本拿给你。'], ['D05'], [], '宣传主张 → 索取独立记录'),\n    C: branch('lu', '月报每月8,000元，核验却没有成交和经营利润。这两份怎么对得上？', ['这份回复我得让财务核一下。你先把对应项目和期间圈出来，我不会拿另一批材料跟你解释。'], ['D06'], [], '项目矛盾 → 转查付款来源'),\n    D: branch('lin', '客户到账总额，能直接拿来证明月报利润吗？', ['到账是付款结果。项目有没有业务，要看同项目、同期间的委托和成交，核验回复给你。'], ['D05'], [], '付款结果 → 核对经营记录'),\n  },\n  Q4: {\n    A: branch('lin', 'C户已经空了，那7,000元是不是也没了？', ['看M户。三个内部执行号能对上，钱还留在那边。'], ['D08'], ['exit'], '追查M户 → 避免漏算余额'),\n    B: branch('lin', '转出7,000，M户又有7,000，是不是一共14,000？', ['同一笔钱，转出记录和收到后的余额不能加两次。你把执行号对一下。'], ['D07', 'D08'], [], '核对内部调拨 → 排除重复计算'),\n    C: branch('lin', '两户合计7,000。内部划转的执行 n selection === 'evidence'\n    ? branch('lu', '月报、核验和付款执行号都在这里。项目没做出这些利润，旧客收到的却是新认购款。我需要一份书面说明。', ['你把这些对应材料留下，我让财务出书面回复。你的资金申请可以另行登记，已经付了多少、还没付多少，都按记录来。'], ['C01'], ['exit'], '有据对峙 → 书面核对与资金申请')\n    : branch('lu', '合同金额和流水差了十万元，这笔钱是不是被拿走了？', ['哪天进来的，哪一笔转出去的？先把期间和流水号对上。你可以继续查，我也需要具体记录。'], ['D06', 'D07', 'D09'], [], '提出疑问 → 补查期间与实际入款');\n}\n","src/open-response.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n/** Player-authored conclusions are recorded for review, never graded. */\nexport const OPEN_RESPONSE_LIMIT = 50_000;\nexport const OPEN_RESPONSE_FIELDS = Object.freeze([\n  Object.freeze({ id: 'story', label: '从收到邀请到现在，你经历了什么？请根据玩家视角还原整个故事。' }),\n  Object.freeze({ id: 'relationships', label: '梳理陆衡、周岚、林乔的人物关系。他们之间、与你之间是什么关系？' }),\n  Object.freeze({ id: 'responsibility', label: '你认为谁应当为这件事负责？' }),\n  Object.freeze({ id: 'consequence', label: '你认为他应该受到／付出怎样的代价？' }),\n]);\n\nconst fieldIds = new Set(OPEN_RESPONSE_FIELDS.map(field => field.id));\nconst record = value => value !== null && typeof value === 'object' && !Array.isArray(value);\n\n/** A draft may be partial; submitting requires a nonblank response in all fields. */\nexport function validateOpenResponse(value, { submitted = false } = {}) {\n  if (!record(value) || Object.keys(value).some(id => !fieldIds.has(id))) return false;\n  if (!Object.values(value).every(text => typeof text === 'string' && text.length \u003c= OPEN_RESPONSE_LIMIT)) return false;\n  return !submitted || OPEN_RESPONSE_FIELDS.every(field => typeof value[field.id] === 'string' && value[field.id].trim().length > 0);\n}\n\n/** Completeness only: choosing a distractor still counts as answering a question. */\nexport function isQuestionAnswered(question, answer) {\n  if (!question) return false;\n  if (question.type === 'open') return validateOpenResponse(answer, { submitted: true });\n  if (!Array.isArray(answer)) return false;\n  const expected = question.multiple ? question.maxSelections || 2 : 1;\n  const options = new Set((question.options || []).map(option => option.id));\n  return answer.length === expected && new Set(answer).size === answer.length && answer.every(id => options.has(id));\n}\n\nexport function questionProgress(questions, answers = {}) {\n  const pendingIds = questions.filter(question => !isQuestionAnswered(question, answers?.[question.id])).map(question => question.id);\n  return { answered: questions.length - pendingIds.length, total: questions.length, complete: pendingIds.length === 0, pendingIds };\n}\n\nconst dates = ['4月1日', '5月1日', '5月2日', '5月3日'];\nconst ownMoneyKeys = ['cash', 'principal', 'totalInvested', 'totalInterest', 'totalReturned', 'earnedTile', 'pendingTile'];\n\n/** Export only visible questions, player text and player funds; no author key. */\nexport function buildAnswerSheet({ questions, answers = {}, finance = {}, readDocs = [], exportedAt = new Date().toISOString() }) {\n  const money = Object.fromEntries(ownMoneyKeys.map(key => [key, Number.isSafeInteger(finance[key]) ? finance[key] : 0]));\n  return {\n    format: 'jinding-player-answer-sheet', version: 1,\n    title: 'R.O.C · 我的回答记录', exportedAt,\n    progress: questionProgress(questions, answers),\n    funds: { unit: '分', date: dates[finance.phase] || '', ...money },\n    readDocs: [...readDocs],\n    questions: questions.map(question => {\n      const entry = {\n        id: question.id, number: question.number || question.id.replace(/^Q/, ''),\n        title: question.title, prompt: question.prompt || '',\n        type: question.type === 'open' ? 'open' : question.multiple ? 'multiple' : 'single',\n        submitted: isQuestionAnswered(question, answers[question.id]),\n      };\n      if (question.type === 'open') {\n        entry.fields = OPEN_RESPONSE_FIELDS.map(field => ({ ...field }));\n        const answer = record(answers[question.id]) ? answers[question.id] : {};\n        entry.answer = Object.fromEntries(OPEN_RESPONSE_FIELDS.map(field => [field.id, typeof answer[field.id] === 'string' ? answer[field.id] : '']));\n      } else {\n        entry.options = (question.options || []).map(option => ({ id: option.id, text: option.text }));\n        entry.answer = Array.isArray(answers[question.id]) ? [...answers[question.id]] : [];\n      }\n      return entry;\n    }),\n  };\n}\n\nconst yuan = cents => (cents / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n\nexport function answerSheetMarkdown(sheet) {\n  const f = sheet.funds;\n  const lines = [\n    `# ${sheet.title}`, '',\n    `导出时间：${sheet.exportedAt}`, `已记录回答：${sheet.progress.answered} / ${sheet.progress.total}`, '',\n    '## 我的资金记录', '',\n    `记录日期：${f.date}`, `可用现金：${yuan(f.cash)} 元`, `未回本金：${yuan(f.principal)} 元`,\n    `累计投入：${yuan(f.totalInvested)} 元`, `收益实际到账：${yuan(f.totalInterest)} 元`,\n    `已退本金：${yuan(f.totalReturned)} 元`, `牌局已收工：${yuan(f.earnedTile)} 元`,\n    `牌局未收工所得：${yuan(f.pendingTile)} 元`, '',\n    '## 我的回答', '',\n  ];\n  for (const question of sheet.questions) {\n    lines.push(`### ${question.number} · ${question.title}`, '', question.prompt, '');\n    if (question.type === 'open') {\n      for (const field of question.fields) lines.push(`**${field.label}**`, '', question.answer[field.id] || '（尚未填写）', '');\n    } else {\n      for (const option of question.options) lines.push(`- ${option.id}．${option.text}`);\n      lines.push('', `我的选择：${question.answer.length ? question.answer.join('、') : '（尚未作答）'}`, '');\n    }\n    lines.push(`记录状态：${question.submitted ? '已提交' : '尚未提交'}`, '');\n  }\n  lines.push('## 已查阅资料', '', sheet.readDocs.length ? sheet.readDocs.join('、') : '尚无查阅记录', '');\n  return lines.join('\\n');\n}\n","src/body/card-flow.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { CARD_MAP, TASKS, QUESTION_MAP } from 'https://roc-offline.invalid/src/investigation/data.js';\nimport {\n  createState, validateState, connect, disconnect, clearLinks, setValue, setPosition,\n  createNotebookEvaluator, evaluateQuestion, isCardAvailable,\n} from 'https://roc-offline.invalid/src/investigation/model.js';\nimport { validateOpenResponse } from 'https://roc-offline.invalid/src/open-response.js';\n\nconst object = value => value !== null && typeof value === 'object' && !Array.isArray(value);\nconst clone = value => JSON.parse(JSON.stringify(value));\nconst unique = value => new Set(value).size === value.length;\nconst has = (state, id) => state.read.includes(id);\nconst done = (state, id) => state.cardFlow.completedTopics.includes(id);\nconst readAny = (state, ids) => ids.some(id => has(state, id));\nconst readAll = (state, ids) => ids.every(id => has(state, id));\nconst INITIAL_TASKS = ['invitation', 'zhou', 'lu', 'project'];\nconst DYNAMIC_DOCS = ['P02', 'P03', 'C01', 'C02'];\nconst TOPIC_NOTES = { T01: 'zhou-income', T02: 'zhou-principal', T03: 'zhou-knowledge', T04: 'lu-pitch', T06: 'lin-role', T19: 'private-invitation' };\nconst NOTE_TOPICS = Object.fromEntries(Object.entries(TOPIC_NOTES).map(([topic, note]) => [note, topic]));\n\nexport const CARD_MONTH_TARGETS = Object.freeze([\n  Object.freeze(['invitation-1', 'invitation-2', 'invitation-3', 'invitation-4', 'zhou-1', 'zhou-2', 'zhou-4', 'lu-1', 'lu-2', 'lu-3', 'project-1']),\n  Object.freeze(['zhou-3', 'project-2', 'project-3', 'lin-1', 'lin-2', 'lin-3']),\n  Object.freeze(['accounts-1', 'accounts-2', 'accounts-3', 'accounts-4', 'accounts-5']),\n  Object.freeze(['payouts-1', 'payouts-2', 'payouts-3', 'crisis-1', 'crisis-2', 'crisis-3']),\n]);\nconst MONTH_DOCS = [['D04'], ['D05', 'D09', 'D12A'], ['D06', 'D07', 'D08', 'D13'], ['D10', 'D11']];\n\nexport function createCardFlow({ progression = 'connections' } = {}) {\n  if (!['submitted', 'connections'].includes(progression)) throw new TypeError('当前正式卡片规则采用自由连线推进。');\n  return {\n    version: 2, progression: 'connections', connectionBaseline: [], notebook: createState(), invitationRead: false,\n    readCrises: [], completedTopics: [], topicSnapshots: {}, submittedQuestions: {},\n    openResponse: { draft: {}, answer: null },\n  };\n}\n\nexport function knownPeople(state) {\n  return ['lu', 'zhou', ...(done(state, 'T06') ? ['lin'] : []), ...(done(state, 'T10') ? ['ding'] : [])];\n}\n\nfunction taskVisible(state, id) {\n  if (INITIAL_TASKS.includes(id)) return true;\n  if (id === 'lin') return done(state, 'T06');\n  if (id === 'accounts') return state.month >= 2 && readAny(state, ['D06', 'D07', 'D08', 'D13']);\n  if (id === 'payouts') return state.month >= 3 && readAny(state, ['D10', 'D11']);\n  if (id === 'crisis') return state.cardFlow.readCrises.length > 0;\n  return false;\n}\n\nfunction sourceVisible(state, id) {\n  const card = CARD_MAP[id];\n  if (DYNAMIC_DOCS.includes(id)) return state.available.includes(id);\n  if (!card) return false;\n  if (card.type === 'task') return taskVisible(state, id);\n  if (card.type === 'document') return state.available.includes(card.document || id);\n  if (id === 'company') return true;\n  if (id === 'C') return readAny(state, ['D06', 'D07']);\n  if (id === 'M') return readAny(state, ['D06', 'D08', 'D13']);\n  if (NOTE_TOPICS[id]) return done(state, NOTE_TOPICS[id]);\n  return false;\n}\n\n/** Owning the main card is the only question gate. Evidence still has to be acquired. */\nexport function questionUnavailable(state, id) {\n  const question = QUESTION_MAP[id];\n  if (!state.cardFlow || !question) return '没有这项卡片问题。';\n  if (!taskVisible(state, question.taskId)) return '尚未认识或读到对应的调查对象。';\n  return '';\n}\nexport function questionAvailable(state, id) { return questionUnavailable(state, id) === ''; }\n\nfunction conclusionCouldExist(state, card) {\n  return card.unlockQuestions?.every(id => questionAvailable(state, id));\n}\n\nfunction eligibleNotebook(state) {\n  const { links, values } = state.cardFlow.notebook;\n  const notebook = { links: {}, values: {} };\n  for (const [id, cards] of Object.entries(links)) {\n    if (!questionAvailable(state, id)) continue;\n    notebook.links[id] = cards.filter(cardId => CARD_MAP[cardId]?.type === 'conclusion'\n      ? conclusionCouldExist(state, CARD_MAP[cardId]) : sourceVisible(state, cardId));\n  }\n  for (const [id, value] of Object.entries(values)) if (questionAvailable(state, id)) notebook.values[id] = value;\n  return notebook;\n}\n\nexport function cardVisible(state, id) {\n  if (!state?.cardFlow) return false;\n  const card = CARD_MAP[id];\n  if (card?.type === 'conclusion') return conclusionCouldExist(state, card) && isCardAvailable(eligibleNotebook(state), id);\n  return sourceVisible(state, id);\n}\n\nexport function cardQuestionResult(state, id) {\n  return evaluateQuestion(eligibleNotebook(state), id);\n}\nconst correct = (state, id) => questionAvailable(state, id) && cardQuestionResult(state, id).correct;\nconst allCorrect = (state, task) => TASKS.find(item => item.id === task).questions.every(question => correct(state, question.id));\n\nconst topicInfo = {\n  T01: ['zhou', '到账经历'], T02: ['zhou', '本金情况'], T03: ['zhou', '对项目的了解'], T04: ['lu', '项目做什么交易'], T05: ['lu', '月报中的项目'],\n  T06: ['lu', '找财务核对'], T07: ['lu', '月报和核验的差异'], T08: ['lin', '不同批次的支付安排'], T09: ['lin', '历史到期表怎样核对'],\n  T10: ['zhou', '其他客户为何参与'], T11: ['ding', '客户丁的判断依据'], T12: ['lin', '两个账户的用途'], T13: ['lin', '内部划转如何核对'],\n  T14: ['lin', '合同与流水范围'], T15: ['lin', '资产核对范围'], T16: ['lin', '到账与付款执行'], 'T16:zhou': ['zhou', '核对本人的到账经历'],\n  T17: ['lu', '追问实际付款来源'], T18: ['lu', '本次延期通知'], T19: ['lu', '单独认购邀请'], T20: ['lu', '追加与退出的关系'], T21: ['lu', '对延期解释的追问'],\n};\n\nfunction topicConditions(state, key) {\n  const lin = done(state, 'T06');\n  switch (key) {\n    case 'T01': case 'T02': case 'T03': case 'T04': return true;\n    case 'T05': return has(state, 'D04') || correct(state, 'project-1');\n    case 'T06': return state.month >= 1 && readAny(state, ['D05', 'D09', 'D12A']);\n    case 'T07': return correct(state, 'project-3');\n    case 'T08': return lin && readAll(state, ['D02', 'D09']);\n    case 'T09': return lin && (has(state, 'D12A') || correct(state, 'lin-2'));\n    case 'T10': return has(state, 'D09');\n    case 'T11': return done(state, 'T10');\n    case 'T12': return lin && has(state, 'D06');\n    case 'T13': return lin && (readAll(state, ['D07', 'D08']) || correct(state, 'accounts-2'));\n    case 'T14': return lin && correct(state, 'accounts-4');\n    case 'T15': return lin && (has(state, 'D13') || correct(state, 'accounts-5'));\n    case 'T16': return lin && state.month >= 3 && readAny(state, ['D10', 'D11']);\n    case 'T16:zhou': return state.month >= 3 && correct(state, 'payouts-2');\n    case 'T17': return allCorrect(state, 'project') && allCorrect(state, 'payouts');\n    case 'T19': return state.invitation.offered;\n    case 'T20': return correct(state, 'crisis-3');\n    case 'T21': return correct(state, 'crisis-2');\n    default: return false;\n  }\n}\n\nfunction topicSnapshot(state, key) {\n  if (key === 'T19') return {\n    month: state.invitation.month, day: state.invitation.day || 2,\n    offeredMonth: state.invitation.month, crisisAtOffer: Boolean(state.invitation.crisisAtOffer),\n    statusAtView: state.invitation.status,\n    viewedMonth: state.month, viewedDay: state.finance.day,\n  };\n  if (key.startsWith('T18:')) {\n    const notice = state.crises.history.find(item => item.id === key.slice(4));\n    return { month: notice.month, day: notice.day, viewedMonth: state.month, viewedDay: state.finance.day, noticeId: notice.id, noticeMonth: notice.month, noticeDay: notice.day, variant: notice.month === state.month ? 'current' : 'historical' };\n  }\n  return { month: state.month, day: state.finance.day,\n    ...(key === 'T09' ? { variant: has(state, 'D12A') ? 'document' : 'method' } : {}),\n    ...(key === 'T16' ? { variant: readAll(state, ['D10', 'D11']) ? 'both' : has(state, 'D10') ? 'instruction' : 'receipt' } : {}),\n    ...(key === 'T15' ? { ownLedgerRead: has(state, 'C02') } : {}),\n  };\n}\n\nexport function availableTopics(state, owner) {\n  if (!state?.cardFlow) return [];\n  const keys = Object.keys(topicInfo).filter(key => key !== 'T18');\n  keys.push(...state.cardFlow.readCrises.map(id => `T18:${id}`));\n  return keys.filter(key => done(state, key) || topicConditions(state, key) || key.startsWith('T18:')).map(key => {\n    const id = key.startsWith('T18:') ? 'T18' : key === 'T16:zhou' ? 'T16' : key;\n    const [character, title] = topicInfo[key] || topicInfo[id];\n    const snapshot = state.cardFlow.topicSnapshots[key] || topicSnapshot(state, key);\n    return { id, key, topicKey: key, instanceId: key.startsWith('T18:') ? key.slice(4) : key === 'T16:zhou' ? 'zhou' : null, character, title, completed: done(state, key), month: snapshot.month, snapshot };\n  }).filter(topic => !owner || topic.character === owner);\n}\n\nfunction numericComplete(value) {\n  if (typeof value === 'number') return Number.isFinite(value) && value >= 0 && value \u003c= 1e12;\n  return typeof value === 'string' && /^(?:\\d+|\\d{1,3}(?:,\\d{3})+)(?:\\.\\d{1,2})?$/.test(value.trim()) && Number(value.replaceAll(',', '')) \u003c= 1e12;\n}\nfunction submittedShape(question, snapshot) {\n  if (!object(snapshot) || !Array.isArray(snapshot.links) || !snapshot.links.length || !unique(snapshot.links) || snapshot.links.some(id => !CARD_MAP[id] || id === question.taskId)) return false;\n  if (question.type === 'boolean') return typeof snapshot.value === 'boolean';\n  if (question.type === 'number') return object(snapshot.value) && question.fields.every(field => numericComplete(snapshot.value[field.id])) && Object.keys(snapshot.value).every(id => question.fields.some(field => field.id === id));\n  return true;\n}\n\nexport function cardQuestionAnswered(state, id) {\n  if (!questionAvailable(state, id)) return false;\n  const notebook = state.cardFlow.notebook;\n  const links = (notebook.links[id] || []).filter(cardId => cardVisible(state, cardId));\n  return submittedShape(QUESTION_MAP[id], { links, value: notebook.values[id] });\n}\n\n/** Reuse one filtered notebook for all the cards and answers in a single render. */\nexport function createCardReader(state) {\n  const notebook = eligibleNotebook(state);\n  const { evaluate, available } = createNotebookEvaluator(notebook);\n  function visible(id) {\n    const card = CARD_MAP[id];\n    return card?.type === 'conclusion' ? conclusionCouldExist(state, card) && available(id) : sourceVisible(state, id);\n  }\n  function answered(id) {\n    return questionAvailable(state, id) && submittedShape(QUESTION_MAP[id], {\n      links: (notebook.links[id] || []).filter(visible), value: notebook.values[id],\n    });\n  }\n  return { visible, answered, evaluate };\n}\n\n/** Stable edge identities, independent of correctness and card coordinates. */\nexport function cardConnections(state) {\n  return Object.entries(state.cardFlow.notebook.links)\n    .flatMap(([questionId, ids]) => ids.map(cardId => `${questionId}|${cardId}`)).sort();\n}\n\nexport function cardCompletion(state) {\n  const reader = createCardReader(state);\n  const answered = Object.keys(QUESTION_MAP).filter(reader.answered);\n  const missingDocs = MONTH_DOCS[state.month].filter(id => !state.available.includes(id));\n  const targets = [...CARD_MONTH_TARGETS[state.month]];\n  const missingQuestions = targets.filter(id => !answered.includes(id));\n  const baseline = new Set(state.cardFlow.connectionBaseline);\n  const newConnections = cardConnections(state).filter(edge => {\n    const [questionId, cardId] = edge.split('|');\n    return !baseline.has(edge) && questionAvailable(state, questionId) && reader.visible(cardId);\n  });\n  const monthReady = state.window === 'investigation' && newConnections.length > 0;\n  const readyForSummary = state.month === 3 && (answered.length === 28 || state.cardFlow.reportUnlockedBySkip === true);\n  const openSubmitted = validateOpenResponse(state.cardFlow.openResponse.answer, { submitted: true });\n  return {\n    answered: answered.length, submitted: answered.length, total: 28,\n    correct: Object.keys(QUESTION_MAP).filter(id => questionAvailable(state, id) && reader.evaluate(id).correct).length,\n    targets, missingDocs, missingQuestions, newConnections, connectionCount: newConnections.length, monthReady, readyForSummary, openSubmitted,\n    // Editing a response after the summary is recorded must not reopen money-making.\n    complete: state.month === 3 && openSubmitted,\n  };\n}\n\nexport function reduceCardFlow(state, action) {\n  const original = state.cardFlow;\n  const fail = error => ({ cardFlow: original, error, events: [] });\n  const flow = clone(original), view = { ...state, cardFlow: flow }, events = [];\n  try {\n    if (action.type === 'readInvitation') flow.invitationRead = true;\n    else if (action.type === 'readNotice') {\n      const notice = state.crises.history.find(item => item.id === action.crisisId);\n      if (!notice || !has(state, 'D12B')) return fail('尚未实际读到这份延期通知。');\n      if (!flow.readCrises.includes(notice.id)) flow.readCrises.push(notice.id);\n    } else if (action.type === 'completeTopic') {\n      const key = action.topicKey || action.topicId;\n      const topic = availableTopics(state).find(item => item.key === key);\n      if (!topic) return fail('这项话题尚未开放。');\n      if (!flow.completedTopics.includes(key)) {\n        flow.completedTopics.push(key); flow.topicSnapshots[key] = clone(topic.snapshot);\n        events.push({ type: 'topic-completed', topicKey: key, character: topic.character });\n        if (TOPIC_NOTES[key]) events.push({ type: 'card-earned', id: TOPIC_NOTES[key] });\n      }\n    } else if (action.type === 'notebook') {\n      const operation = action.operation, qId = action.questionId;\n      if (operation === 'position' || operation === 'arrange') {\n        const positions = operation === 'position' ? { [action.cardId]: action.position } : action.positions;\n        if (!object(positions)) return fail('卡片坐标不正确。');\n        for (const [id, point] of Object.entries(positions)) {\n          if (!Object.hasOwn(CARD_MAP, id) || !cardVisible(state, id)) return fail('尚未取得这张卡。');\n          const next = setPosition(flow.notebook, id, point);\n          if (next === flow.notebook) return fail('卡片坐标不正确。');\n          flow.notebook = next;\n        }\n      } else {\n        const missing = questionUnavailable(state, qId);\n        if (missing) return fail(missing);\n        if (operation === 'connect') {\n          if (!CARD_MAP[action.cardId] || action.cardId === QUESTION_MAP[qId].taskId || !cardVisible(state, action.cardId)) return fail('尚未取得可用的证据卡。');\n          flow.notebook = connect(flow.notebook, qId, action.cardId);\n        } else if (operation === 'disconnect') flow.notebook = disconnect(flow.notebook, qId, action.cardId);\n        else if (operation === 'clear') flow.notebook = clearLinks(flow.notebook, qId);\n        else if (operation === 'value') {\n          const question = QUESTION_MAP[qId], value = action.value;\n          if (question.type === 'link' || question.type === 'boolean' && value !== null && typeof value !== 'boolean'\n            || question.type === 'number' && (!object(value) || Object.entries(value).some(([field, item]) => !question.fields.some(f => f.id === field) || !['string', 'number'].includes(typeof item) || String(item).length > 40 || typeof item === 'number' && !Number.isFinite(item)))) return fail('输入草稿格式不正确。');\n          flow.notebook = setValue(flow.notebook, qId, value);\n        }\n        else return fail('没有这种笔记操作。');\n      }\n    } else if (action.type === 'submitCardQuestion') {\n      const id = action.questionId, question = QUESTION_MAP[id];\n      const missing = questionUnavailable(state, id);\n      if (missing) return fail(missing);\n      const snapshot = { links: [...(flow.notebook.links[id] || [])], month: state.month, day: state.finance.day };\n      if (Object.hasOwn(flow.notebook.values, id)) snapshot.value = clone(flow.notebook.values[id]);\n      if (!submittedShape(question, snapshot)) return fail('请填写完整，并至少连接一张证据卡后提交。');\n      if (snapshot.links.some(card => !cardVisible(state, card))) return fail('当前回答中仍有不可用的证据连线。');\n      flow.submittedQuestions[id] = snapshot;\n      events.push({ type: 'card-question-submitted', questionId: id, correct: correct(view, id) });\n    } else if (action.type === 'draftConclusion') {\n      if (state.month !== 3 || !validateOpenResponse(action.value)) return fail('开放总结草稿格式不正确。');\n      flow.openResponse.draft = clone(action.value);\n    } else if (action.type === 'submitConclusion') {\n      if (!cardCompletion(state).readyForSummary) return fail('先完成全部28项卡片问题，再记录开放总结。');\n      if (!validateOpenResponse(action.value, { submitted: true })) return fail('请完成四项开放总结。');\n      flow.openResponse = { draft: clone(action.value), answer: clone(action.value) };\n      events.push({ type: 'conclusion-submitted' });\n    } else return fail('没有这种卡片操作。');\n    if (!validateCardFlow(view)) return fail('卡片记录校验失败。');\n    return { cardFlow: flow, error: null, events };\n  } catch { return fail('卡片操作未完成。'); }\n}\n\nexport function validateCardFlow(state) {\n  try {\n    const flow = state.cardFlow;\n    if (state.flow !== 'cards' || !object(flow) || flow.version !== 2 || flow.progression !== 'connections' || typeof flow.invitationRead !== 'boolean' || !validateState(flow.notebook)) return false;\n    if (Object.keys(flow).some(key => !['version', 'progression', 'connectionBaseline', 'notebook', 'invitationRead', 'readCrises', 'completedTopics', 'topicSnapshots', 'submittedQuestions', 'openResponse', 'reportUnlockedBySkip'].includes(key))) return false;\n    if (Object.hasOwn(flow, 'reportUnlockedBySkip') && (flow.reportUnlockedBySkip !== true || state.month !== 3 || state.window !== 'investigation')) return false;\n    if (!Array.isArray(flow.connectionBaseline) || !unique(flow.connectionBaseline) || flow.connectionBaseline.some(edge => {\n      if (typeof edge !== 'string') return true;\n      const [questionId, cardId, extra] = edge.split('|');\n      return extra !== undefined || !QUESTION_MAP[questionId] || !CARD_MAP[cardId] || QUESTION_MAP[questionId].taskId === cardId;\n    })) return false;\n    if (!Array.isArray(flow.readCrises) || !unique(flow.readCrises) || flow.readCrises.some(id => !state.crises.history.some(notice => notice.id === id)) || flow.readCrises.length && !has(state, 'D12B')) return false;\n    if (state.invitation.offered && (state.invitation.month \u003c 2 || !readAll(state, ['D06', 'D07', 'D08']))) return false;\n    if (!Array.isArray(flow.completedTopics) || !unique(flow.completedTopics) || flow.completedTopics.length > 30 || !object(flow.topicSnapshots) || Object.keys(flow.topicSnapshots).length !== flow.completedTopics.length) return false;\n    for (const key of flow.completedTopics) {\n      if (key === 'T18' || !topicInfo[key] && !(key.startsWith('T18:') && flow.readCrises.includes(key.slice(4)))) return false;\n      const snap = flow.topicSnapshots[key];\n      if (!object(snap) || !Number.isInteger(snap.month) || snap.month \u003c 0 || snap.month > state.month || ![1, 2].includes(snap.day)) return false;\n      if (snap.month === state.month && snap.day > state.finance.day) return false;\n      if (key === 'T06' && snap.month \u003c 1 || key === 'T10' && !has(state, 'D09') || key === 'T11' && !done(state, 'T10')) return false;\n      if (key.startsWith('T18:')) {\n        const notice = state.crises.history.find(item => item.id === key.slice(4));\n        if (!notice || snap.noticeId !== notice.id || snap.noticeMonth !== notice.month || snap.noticeDay !== notice.day) return false;\n      }\n      if (key === 'T19' && (!state.invitation.offered || snap.offeredMonth !== state.invitation.month || snap.month !== state.invitation.month || snap.crisisAtOffer !== state.invitation.crisisAtOffer || !['pending', 'accepted', 'declined', 'expired'].includes(snap.statusAtView))) return false;\n    }\n    if (!object(flow.submittedQuestions) || !object(flow.openResponse) || Object.keys(flow.openResponse).length !== 2 || !Object.hasOwn(flow.openResponse, 'draft') || !Object.hasOwn(flow.openResponse, 'answer') || !validateOpenResponse(flow.openResponse.draft) || flow.openResponse.answer !== null && !validateOpenResponse(flow.openResponse.answer, { submitted: true })) return false;\n    for (const [id, snapshot] of Object.entries(flow.submittedQuestions)) {\n      const question = QUESTION_MAP[id];\n      if (!question || !submittedShape(question, snapshot) || !Number.isInteger(snapshot.month) || snapshot.month \u003c 0 || snapshot.month > state.month || ![1, 2].includes(snapshot.day)) return false;\n      if (snapshot.month === state.month && snapshot.day > state.finance.day || Object.keys(snapshot).some(key => !['links', 'value', 'month', 'day'].includes(key))) return false;\n    }\n    for (const id of new Set([...Object.keys(flow.notebook.links), ...Object.keys(flow.notebook.values)])) if (!questionAvailable(state, id)) return false;\n    for (const cardId of Object.keys(flow.notebook.positions)) {\n      const card = CARD_MAP[cardId];\n      if (card.type === 'conclusion' ? !conclusionCouldExist(state, card) : !sourceVisible(state, cardId)) return false;\n    }\n    for (const linked of Object.values(flow.notebook.links)) for (const id of linked) {\n      const card = CARD_MAP[id];\n      if (card.type === 'conclusion' ? !conclusionCouldExist(state, card) : !sourceVisible(state, id)) return false;\n    }\n    if (flow.openResponse.answer !== null && state.month !== 3) return false;\n    return true;\n  } catch { return false; }\n}\n","src/investigation/data.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { DOCUMENT_MAP } from 'https://roc-offline.invalid/src/materials.js';\n\n// The workbench is an isolated design preview. Historical evidence remains in\n// January–March; no transaction here alters the player's April–July finances.\nconst text = (title, body) => ({ kind:'text', title, body });\nconst doc = (id, title, blocks, issuer='金鼎财富 · 资料归档', date='4月1日') => ({ id,title,shortTitle:title,issuer,date,number:`JD-CARD-${id}`,type:'letter',blocks });\nconst numberField = (id, label, expected, unit='元') => ({ id,label,expected,unit });\nconst question = (taskId, number, prompt, allowedSets, extra={}) => ({\n  id:`${taskId}-${number}`,taskId,prompt,type:'link',allowedSets,...extra,\n});\n\nexport const TASKS = [\n  { id:'invitation',title:'邀请函',kind:'event',art:'invitation',subtitle:'这封信把我带到了哪里',questions:[\n    question('invitation',1,'谁发出了这封邀请？',[['company']],{result:'邀请由金鼎财富客户服务组发出。',hint:'看邀请函的抬头与落款。'}),\n    question('invitation',2,'是谁推荐了我？',[['zhou']],{result:'周岚引荐主角。',hint:'看邀请函中的推荐人。'}),\n    question('invitation',3,'谁负责接待我？',[['lu']],{result:'客户经理陆衡负责接待。',hint:'看会面安排中的接待人员。'}),\n    question('invitation',4,'邀请我了解什么？',[['project']],{result:'本次会面介绍稳盈计划。',hint:'看邀请函的会面主题。'}),\n  ]},\n  { id:'zhou',title:'周岚',kind:'person',art:'zhou',subtitle:'朋友 · 认购客户',questions:[\n    question('zhou',1,'她为什么向我推荐项目？',[['zhou-income']],{result:'她连续收到钱，因此相信项目。',hint:'回看周岚介绍自己经历时的说法。'}),\n    question('zhou',2,'三个月实际收到了多少？',[['D03']],{type:'number',fields:[numberField('period','每期',4800),numberField('total','累计共',14400)],result:'三个月各收到4,800元，累计14,400元。 \n  { id:'accounts',title:'C户与M户',kind:'account',art:'accounts',subtitle:'历史1—3月 · 截至3月31日',questions:[\n    question('accounts',1,'两个账户属于谁？',[['D06']],{result:'C户、M户均属于金鼎财富平台，现有资料没有证明陆衡个人控制账户。',hint:'核对账户名称及控制关系。'}),\n    question('accounts',2,'C户转给M户的7,000元，是新增利润吗？',[['D06','D07','D08']],{type:'boolean',expected:false,result:'这是平台内部划转，不产生新增利润或资产。',hint:'先对同一笔TRF执行号，再看两户归属。'}),\n    question('accounts',3,'截止日两户合计还有多少钱？',[['D07','D08']],{type:'number',fields:[numberField('c','C户',0),numberField('m','M户',7000),numberField('total','两户共',7000)],result:'C户0元、M户7,000元，两户合计7,000元。',hint:'同一截止日的余额合计，不要再加内部转出记录。'}),\n    question('accounts',4,'合同与本期入款的十万元差额，能直接算本期失踪吗？',[['D09','D07']],{type:'boolean',expected:false,result:'存续合同与本期入款的对象、期间不同，不能直接相减认定本期失踪。',hint:'分别核对合同存续金额与流水起止期间。'}),\n    question('accounts',5,'同截止日核实到的资金和项目资产共多少？',[['D13']],{type:'number',fields:[numberField('assets','合计',7000)],result:'截至3月31日，已核实资金及项目资产合计7,000元。',hint:'看历史资产核对表的截止日与完整核对范围。'}),\n  ]},\n  { id:'payouts',title:'旧客户付款',kind:'payment',art:'payouts',subtitle:'从入款追到实际付款',questions:[\n    question('payouts',1,'三期新客户认购款进入C户，共多少？',[['D06','D07']],{type:'number',fields:[numberField('total','三期共',31000)],result:'三期新认购款共31,000元进入C户。',hint:'核对IN执行号和相应的认购资金登记。'}),\n    question('payouts',2,'三期旧客户实际收到多少收益款？',[['D11']],{type:'number',fields:[numberField('zhou','周岚',14400),numberField('chen','陈岳',9600),numberField('total','合计',24000)],result:'周岚14,400元、陈岳9,600元，旧客户合计24,000元。',hint:'按客户和三期到账金额汇总。'}),\n    question('payouts',3,'哪些材料能追出旧客户收益的付款来源？',[['D07','D10'],['D07','D11']],{result:'完整C户流水结合付款指令或实际到账汇总，可追到新认购款被用于支付旧客收益。',hint:'完整来源和付款用途需要两端对应，执行号要能对上。'}),\n  ]},\n  { id:'crisis',title:'付款延期',kind:'event',art:'crisis',subtitle:'重新审视解释与追加',questions:[\n    question('crisis',1,'通知给延期的解释是什么？',[['D12B']],{result:'通知称系统调整。此处只记录通知给出的解释。',hint:'先查看实际送达通知的说明。'}),\n    question('crisis',2,'系统调整能消除已经核实的付款来源矛盾吗？',[['D12B','conclusion-business','conclusion-payment']],{type:'boolean',expected:false,result:'系统调整没有回答经营收
