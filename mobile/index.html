<script type="text/plain" id="third-party-notices"># Glass optics attribution

The optical primitives in `src/vendor/glass-optics.js` adapt the vector-valued
`F_Schlick` function from three.js r160 `ShaderChunk/common.glsl.js` and the
`reflect(cameraToFrag, worldNormal)` environment-reflection construction from
`ShaderChunk/envmap_fragment.glsl.js`.

Copyright © 2010–2023 three.js authors. Distributed under the MIT License,

- https://github.com/mrdoob/three.js/tree/r160
- https://github.com/mrdoob/three.js/blob/r160/src/renderers/shaders/ShaderChunk/common.glsl.js
- https://github.com/mrdoob/three.js/blob/r160/src/renderers/shaders/ShaderChunk/envmap_fragment.glsl.js

The R.O.C adaptation supplies independent measured glass masks and a small
procedural studio environment. It draws only transparent reflections: it does
not displace the approved cover image, reproduce bevels as dark polygons, or
sample the artwork with chromatic offsets. The original seams stay in the art.

The `gemFastChroma` per-channel ray-direction split also adapts the FAST_CHROMA
branch of pmndrs/drei `MeshRefractionMaterial`, by N8Programs, MIT. The source
copy and Drei's MIT license are retained here. We do not include its BVH tracing
or displace the cover; only the reflected light field gets separated RGB rays.
https://github.com/pmndrs/drei/blob/master/src/materials/MeshRefractionMaterial.tsx

Also reviewed: pmndrs/drei `MeshTransmissionMaterial` (MIT), which splits
refraction by wavelength; the complete material is not shipped or instantiated
because its volumetric distortion/FBO passes are unnecessary for this static
illustration. Its shader was reviewed as an implementation reference, not
presented as code included in this project.
https://github.com/pmndrs/drei/blob/master/src/core/MeshTransmissionMaterial.tsx

ocx","assets/materials/D05.pdf","assets/materials/D06.pdf","assets/materials/D06.xlsx","assets/materials/D07.pdf","assets/materials/D07.xlsx","assets/materials/D08.pdf","assets/materials/D08.xlsx","assets/materials/D09.pdf","assets/materials/D09.xlsx","assets/materials/D10.pdf","assets/materials/D10.xlsx","assets/materials/D11.pdf","assets/materials/D11.xlsx","assets/materials/D12A.pdf","assets/materials/D12A.xlsx","assets/materials/D12B.docx","assets/materials/D12B.pdf","assets/materials/D13.pdf","assets/materials/D13.xlsx","assets/music/anabasis.mp3","assets/music/darkest-child.mp3","assets/music/intervention.mp3","assets/music/katabasis.mp3","assets/music/long-dark.mp3","assets/office-background.png","assets/prologue/entry-door.m4a","assets/prologue/typewriter.m4a","assets/receipt-window-v1/workstation-still-v5.png","assets/reception/audio/card-tap.m4a","assets/reception/audio/entrance-0-fade.m4a","assets/reception/audio/entrance-0.m4a","assets/reception/audio/entrance-1.m4a","assets/reception/audio/entrance-2.m4a","assets/reception/audio/intro-0.m4a","assets/reception/audio/intro-1.m4a","assets/reception/audio/intro-2.m4a","assets/reception/audio/intro-4.m4a","assets/reception/audio/lu-1.m4a","assets/reception/audio/lu-3.m4a","assets/reception/audio/lu-4.m4a","assets/reception/audio/materials-1.m4a","assets/reception/audio/materials-2.m4a","assets/reception/audio/paper-flip.m4a","assets/reception/audio/place-paper.m4a","assets/reception/audio/walk-sit.m4a","assets/reception/audio/zhou-1.m4a","assets/reception/audio/zhou-3.m4a","assets/reception/documents/D01.png","assets/reception/documents/D02.png","assets/reception/documents/D03.png","assets/reception/scenes/arrival.png","assets/reception/scenes/placing.png","assets/reception/scenes/seated.png","assets/reception/scenes/together.png","assets/tutorial/01.webp","assets/tutorial/02.webp","assets/tutorial/03.webp"]);
  const mediaRoot = new NativeURL('./', window.location.href);
  const loaded=new Map(), moduleMap={};
  const wrap = (bytes,type) => NativeURL.createObjectURL(new Blob([bytes],{type}));
  const htmlEsc = value => String(value).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  const string = value => JSON.stringify(value).replaceAll('<','\u003c');
  const routeToken='__rocOfflineRoute';

  let storage;
  try { storage=window.localStorage; void storage.length; }
  catch { throw Error('当前浏览器未允许本地 HTML 使用存档。请用桌面版 Google Chrome 打开。'); }
  function split(value) {
    try {const url=new NativeURL(value,address);
      if(url.origin===origin) return { name:url.pathname.slice(1), url };
    } catch {}
    return null;
  }
  function resource(value) {
    const path=split(value);
    if(!path)return value;
    if(media.has(path.name))return new NativeURL(path.name + path.url.search + path.url.hash,mediaRoot).href;
    if(!Object.hasOwn(cssSources,path.name))return value;
    if(!loaded.has(path.name)) {
      const css=cssSources[path.name].replace(/__ROC_ASSET:([^"]+)__/g,(_,name)=>resource('/'+name));
      loaded.set(path.name,wrap(css,'text/css;charset=utf-8'));
    }

  class PackURL extends NativeURL {
    get href() { return resource(super.href); }
    set href(value) { super.href=value; }
  }
  function attributes(html) {
    return html.replace(/\b(src|href)="(\.\/[^"]+)"/g,(tag,prop,value)=>{
      const path=split(value);
      if(prop==='src' && Object.hasOwn(pageHtml,path?.name))return 'srcdoc="'+htmlEsc(page(value))+'"';
      const replacement=moduleMap[path?.url.href] || resource(value);
      return replacement===value?tag:`${prop}="${htmlEsc(replacement)}"`;

  }
  function page(route,isRoot=false) {

    return attributes(pageHtml[path.name]).replace(/<meta charset="utf-8"\s*\/?\s*>/i,tag=>tag+bootstrap);
  }
  function configure(win,route) {
    const root=win.document.documentElement;
    root.dataset.rocPage=split(route).name;
    const smallTouchScreen = window.matchMedia('(pointer: coarse) and (max-width: 1060px)').matches &&
      Math.min(window.screen.width,window.screen.height) <= 650;
    root.toggleAttribute('data-roc-mobile-ui',smallTouchScreen);
    if (!win.Element.prototype.checkVisibility) {
      Object.defineProperty(win.Element.prototype,'checkVisibility',{configurable:true,value:function(){

      }});
    }
    Object.defineProperty(win,'__rocInitialRoute',{value:route});
    function intercept(proto,property,set) {
      const descriptor=Object.getOwnPropertyDescriptor(proto,property);
      Object.defineProperty(proto,property,{...descriptor,set(value){ set.call(this,value,descriptor.set); }});
    }
    function staticResource(value,set) { set.call(this,resource(value)); }
    for(const type of [win.HTMLImageElement,win.HTMLMediaElement])intercept(type.prototype,'src',staticResource);
    intercept(win.HTMLLinkElement.prototype,'href',staticResource);
    intercept(win.HTMLIFrameElement.prototype,'src',function(value,set){
      const path=split(value);
      if(path && Object.hasOwn(pageHtml,path.name)){
        this.srcdoc=page(path.url.href);
      } else {
        if(this.hasAttribute('srcdoc'))this.removeAttribute('srcdoc');
        set.call(this,resource(value));
      }
    });
    const Audio=win.Audio;
    win.Audio=function(value){return arguments.length?new Audio(resource(value)):new Audio();};
    win.Audio.prototype=Audio.prototype;
  }
  function owns(win) { try {return win?.__roc===api;}catch{return false;} }
  function locationFor(win) {
    return {
      origin:win.origin,
      get href(){return win.history.state?.[routeToken] || win.__rocInitialRoute;},
      get search(){return new NativeURL(this.href).search;},
      reload(){ if (win===window)win.location.reload(); else win.frameElement.src=this.href; },

  }

    post(win,message){if(owns(win))win.postMessage(message,'*');},
    fetch(win,value,...args){

      const url=resource(value);

      return Promise.reject(Error('Missing embedded resource: '+value));
    }
  };

  window.__roc=api;
  const markup=page('/game.html',true);
  document.open();document.write(markup);document.close();

ding/cover/expressions.webp\" alt=\"\" draggable=\"false\">\u003c/div>\n        \u003cdiv class=\"prism-cast-shadow-scope\">\u003cdiv class=\"prism-cast-shadow-beam\">\u003cdiv class=\"prism-cast-shadow prism-cast-snake\">\u003c/div>\u003cdiv class=\"prism-cast-shadow prism-cast-sheep\">\u003c/div>\u003cdiv class=\"prism-cast-shadow prism-cast-rabbit\">\u003c/div>\u003c/div>\u003c/div>\n        \u003cdiv class=\"prism-set-light\">\n          \u003cspan class=\"prism-pane prism-pane-left\">\u003c/span>\n          \u003cspan class=\"prism-pane prism-pane-middle\">\u003c/span>\n          \u003cspan class=\"prism-pane prism-pane-right\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"prism-glass-fallback\">\u003c/div>\n        \u003ccanvas class=\"title-glass-canvas\">\u003c/canvas>\n        \u003cdiv class=\"prism-shadow\">\u003c/div>\n        \u003cimg class=\"prism-layer prism-crime-accent\" src=\"./assets/branding/prism-v6/crime-red-accent.svg\" alt=\"\" draggable=\"false\">\n        \u003cimg class=\"prism-layer prism-title\" src=\"./assets/branding/cover/lettering.svg\" alt=\"\" draggable=\"false\" fetchpriority=\"high\" width=\"1672\" height=\"941\">\n        \u003cdiv class=\"prism-vignette\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"prism-compact-title\" aria-hidden=\"true\">\u003c/div>\n      \u003ch1 class=\"visually-hidden\">R.O.C · 罪案之歌 — Requiem of Crime\u003c/h1>\n      \u003cnav class=\"entry-actions\" aria-label=\"主菜单\">\n        \u003cbutton id=\"start-case\" class=\"menu-button is-current\" type=\"button\">开始游戏\u003c/button>\n        \u003cbutton id=\"continue-case\" class=\"menu-button\" type=\"button\" disabled>继续游戏\u003c/button>\n        \u003cbutton id=\"open-authors\" class=\"menu-button\" type=\"button\">作者的话\u003c/button>\n        \u003cbutton id=\"open-settings\" class=\"menu-button\" type=\"button\">设置\u003c/button>\n      \u003c/nav>\n    \u003c/section>\n    \u003cp id=\"entry-music-hint\" class=\"entry-music-hint\">如若无背景音乐，请点击屏幕任意位置。\u003c/p>\n  \u003c/main>\n  \u003ciframe id=\"chapter-frame\" title=\"R.O.C · 罪案之歌\" src=\"about:blank\" allow=\"autoplay; fullscreen\" hidden>\u003c/iframe>\n  \u003cdiv id=\"chapter-curtain\" aria-hidden=\"true\" hidden>\u003c/div>\n  \u003csection id=\"authors-panel\" class=\"entry-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"authors-title\" hidden>\n    \u003cdiv class=\"entry-panel author-panel\">\n      \u003cbutton class=\"panel-close\" type=\"button\" data-close-panel aria-label=\"关闭作者的话\">×\u003c/button>\n      \u003ch2 id=\"authors-title\">作者的话\u003c/h2>\n      \u003cdiv class=\"author-content\">\n        \u003cdiv class=\"panel-scroll author-text\" role=\"region\" aria-label=\"作者正文\" tabindex=\"0\" inert aria-hidden=\"true\">\n          \u003cp>最开始构思这个作品，我们不想做一个简单没有创新的金融答题游戏，就想到把解谜剧情和消消乐结合在一起。通过不枯燥乏味的方式，有趣的消除卡牌搜集线索，再依靠答题一步步挖出\"金鼎财富\"背后的真相。在整个游戏里你可以反复尝试，答错题目或闯关失败都能重新来过，慢慢梳理整个骗局的套路。可现实不会给这么多次机会，类似庞氏骗局的案件真实发生过，不少人被高额回报的话术迷惑，最后积蓄付诸东流。\u003c/p>\n          \u003cp>说回游戏，跟着故事走到最后你会发现，金鼎财富那些漂亮柜台、认购邀约、诱人的“稳盈计划”，也全都是假象。它拿新投资人的钱去填旧的窟窿，曾经轰动全国的 e 租宝，只用一年半，就把一百一十五万多人的积蓄卷走，留下三百八十多亿的损失。我们没有堆砌晦涩难懂的专业理论，借着这个虚构的金鼎财富故事，就是想把这类骗局的运作方式直观展现出来。希望你经历完这一整个故事后，再遇到保本高收益这类诱人的说辞时，可以多一份戒备心。最后，记住一句最简单的话：许诺保本又高收益的，大多都是陷阱。愿这场小小的冒险，能给你多一双分辨骗局的慧眼。\u003c/p>\n          \u003cp>感谢你体验此游戏。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"author-lock\">\n          \u003cspan class=\"author-lock-icon\" aria-hidden=\"true\">\u003c/span>\n          \u003cspan>通关显示\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cbutton class=\"chapter-button panel-return\" type=\"button\" data-close-panel>返回\u003c/button>\n    \u003c/div>\n  \u003c/section>\n  \u003csection id=\"settings-panel\" class=\"entry-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"settings-title\" hidden>\n    \u003cdiv class=\"entry-panel settings-panel\">\n      \u003cbutton class=\"panel-close\" type=\"button\" data-close-panel aria-label=\"关闭设置\">×\u003c/button>\n      \u003cp class=\"panel-kicker\">R.O.C\u003c/p>\n      \u003ch2 id=\"settings-title\">设置\u003c/h2>\n      \u003cdiv class=\"panel-scroll settings-scroll\">\n      \u003clabel class=\"setting-row\" for=\"music-volume\">\u003cspan>背景音乐\u003c/span>\u003coutput id=\"music-volume-value\" for=\"music-volume\">42%\u003c/output>\u003c/label>\n      \u003cinput id=\"music-volume\" class=\"volume-slider\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"42\">\n      \u003clabel class=\"setting-row\" for=\"effects-volume\">\u003cspan>音效与配音\u003c/span>\u003coutput id=\"effects-volume-value\" for=\"effects-volume\">100%\u003c/output>\u003c/label>\n      \u003cinput id=\"effects-volume\" class=\"volume-slider\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"100\">\n      \u003clabel class=\"setting-toggle\" for=\"music-muted\">\u003cspan>静音\u003c/span>\u003cinput id=\"music-muted\" type=\"checkbox\">\u003c/label>\n      \u003cdiv class=\"setting-display\">\u003cspan>显示模式\u003c/span>\u003cbutton id=\"toggle-fullscreen\" class=\"chapter-button\" type=\"button\">全屏\u003c/button>\u003c/div>\n      \u003cp id=\"settings-feedback\" class=\"settings-feedback\" role=\"status\" hidden>\u003c/p>\n      \u003cdetails class=\"music-credits\">\n        \u003csummary>音乐鸣谢\u003c/summary>\n        \u003cp>\u003ca href=\"https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1100783\" target=\"_blank\" rel=\"noopener noreferrer\">Darkest Child\u003c/a> — Kevin MacLeod (incompetech.com)，依据 \u003ca href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY 4.0\u003c/a> 许可使用。4月、5月使用放慢、降低音调及音量的版本。\u003c/p>\n        \u003cp>以下配乐由 \u003ca href=\"https://www.scottbuckley.com.au/\" target=\"_blank\" rel=\"noopener noreferrer\">Scott Buckley\u003c/a> 创作，依据 \u003ca href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY 4.0\u003c/a> 许可使用。\u003c/p>\n        \u003cul>\n \u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n  \u003csection id=\"chapter-failure\" class=\"confirmation-overlay\" role=\"alertdialog\" aria-label=\"页面未能载入\" hidden>\n    \u003cdiv class=\"confirmation-card\">\u003ch2>页面未能载入\u003c/h2>\u003cp id=\"failure-message\">\u003c/p>\u003cbutton id=\"retry-chapter\" class=\"chapter-button\" type=\"button\">重试\u003c/button>\u003c/div>\n  \u003c/section>\n  \u003cscript type=\"module\" src=\"./src/chapter-shell.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n\r\n","prologue.html":"\u003c!doctype html>\r\n\u003chtml lang=\"zh-CN\">\r\n\u003chead>\r\n  \u003cmeta charset=\"utf-8\">\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n  \u003cmeta name=\"theme-color\" content=\"#000000\">\r\n  \u003ctitle>R.O.C · 序章\u003c/title>\r\n  \u003clink rel=\"stylesheet\" href=\"./src/prologue.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/paper-theme.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/roc-theme.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/mobile-common.css\">\n\u003c/head>\r\n\u003cbody>\r\n  \u003ciframe id=\"story-frame\" title=\"序章：邀请函\" src=\"./invitation-demo.html?joined=1\" allow=\"autoplay; fullscreen\">\u003c/iframe>\r\n  \u003cdiv id=\"scene-transition\" aria-label=\"场景转场\" hidden>\u003cbutton id=\"entry-retry\" type=\"button\" hidden>重试进入会客室\u003c/button>\u003cp id=\"transition-note\" role=\"status\">\u003c/p>\u003c/div>\r\n  \u003caudio id=\"entry-audio\" preload=\"auto\" src=\"./assets/prologue/entry-door.m4a\">\u003c/audio>\r\n  \u003cscript type=\"module\" src=\"./src/prologue.js\">\u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n","invitation-demo.html":"\u003c!doctype html>\r\n\u003chtml lang=\"zh-CN\">\r\n\u003chead>\r\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n\u003cmeta name=\"theme-color\" content=\"#000000\">\u003ctitle>R.O.C · 邀请函\u003c/title>\r\n\u003clink rel=\"stylesheet\" href=\"./src/invitation-demo.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/paper-theme.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/roc-theme.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/mobile-common.css\">\n\u003c/head>\r\n\u003cbody>\r\n\u003cmain class=\"invitation-stage\" data-phase=\"narration\" aria-label=\"邀请函开场预览\">\r\n  \u003cbutton id=\"restart-invitation\" hidden class=\"quiet-button replay\" type=\"button\">重播片段\u003c/button>\r\n  \u003cdiv id=\"invitation-start\" class=\"invitation-start\">\u003cbutton id=\"begin-invitation\" type=\"button\">开始\u003c/button>\u003cp id=\"invitation-audio-note\" hidden>\u003c/p>\u003c/div>\r\n  \u003csection id=\"narration\" class=\"narration\" aria-label=\"剧情导入\">\u003cp id=\"intro-sentence\" aria-label=\"那天，你的好朋友周岚向你提起了一个私人投资项目，邀请你加入。\">\u003c/p>\u003c/section>\r\n  \u003csection id=\"envelope-scene\" class=\"envelope-scene\" aria-label=\"收到的邀请函\" hidden>\r\n    \u003cdiv class=\"envelope-shadow\">\u003c/div>\r\n    \u003cbutton id=\"open-envelope\" class=\"envelope\" type=\"button\" aria-label=\"点击拆开金鼎财富邀请函\">\r\n      \u003cspan class=\"envelope-back\">\u003c/span>\r\n      \u003cspan class=\"mini-letter\" aria-hidden=\"true\">\u003cspan>金鼎财富\u003c/span>\u003cstrong>私人投资交流邀请函\u003c/strong>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\r\n      \u003cspan class=\"fold fold-left\">\u003c/span>\u003cspan class=\"fold fold-right\">\u003c/span>\u003cspan class=\"fold fold-bottom\">\u003c/span>\r\n      \u003cspan class=\"envelope-flap\">\u003c/span>\u003cspan class=\"seal\" aria-hidden=\"true\">鼎\u003c/span>\r\n      \u003cspan class=\"envelope-brand\">金 鼎 财 富\u003c/span>\u003cspan class=\"envelope-recipient\">亲启\u003c/span>\r\n    \u003c/button>\r\n    \u003cp id=\"envelope-instruction\" class=\"envelope-instruction\">点击拆开\u003c/p>\r\n  \u003c/section>\r\n\u003c/main>\r\n\u003cdialog id=\"invitation-reader\" aria-labelledby=\"letter-title\">\r\n  \u003carticle class=\"letter\" tabindex=\"-1\" autofocus>\r\n    \u003cheader>\u003cp class=\"company\">金鼎财富\u003c/p>\u003ch1 id=\"letter-title\">私人投资交流邀请函\u003c/h1>\u003cdiv class=\"letter-rule\">\u003c/div>\u003c/header>\r\n    \u003cdiv class=\"letter-body\">\r\n      \u003cp class=\"salutation\">尊敬的受邀嘉宾：\u003c/p>\r\n      \u003cp>经周岚女士推荐，诚邀您莅临金鼎财富，参加「稳盈计划」专场投资交流。\u003c/p>\r\n      \u003cp>本次会面将由客户经理陆衡先生接待，为您介绍项目运作、收益分配及认购安排，并就相关事项进行现场答疑。项目说明及认购资料将于会面时提供，供您查阅。\u003c/p>\r\n      \u003cp>本次交流采用定向邀请方式，请您携本函到访。\u003c/p>\r\n      \u003cdiv class=\"meeting\">\u003cp>\u003cspan>会面地点\u003c/span>金鼎大厦 · 金鼎财富会客室\u003c/p>\u003cp>\u003cspan>接待人员\u003c/span>陆衡　客户经理\u003c/p>\u003c/div>\r\n      \u003cp class=\"courtesy\">恭候莅临。\u003c/p>\r\n      \u003cdiv class=\"signature\">\u003cp>金鼎财富\u003c/p>\u003cp>客户服务组\u003c/p>\u003c/div>\r\n    \u003c/div>\r\n    \u003cfooter>\u003cbutton id=\"depart-invitation\" type=\"button\" hidden>收起邀请函，前往赴约 \u003cspan aria-hidden=\"true\">▸\u003c/span>\u003c/button>\u003cbutton id=\"close-invitation\" type=\"button\">收起邀请函 \u003cspan aria-hidden=\"true\">▸\u003c/span>\u003c/button>\u003c/footer>\r\n  \u003c/article>\r\n\u003c/dialog>\r\n\u003cscript type=\"module\" src=\"./src/invitation-demo.js\">\u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n","reception-demo.html":"\u003c!doctype html>\r\n\u003chtml lang=\"zh-CN\">\r\n\u003chead>\r\n  \u003cmeta charset=\"utf-8\">\r\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\r\n  \u003cmeta name=\"theme-color\" content=\"#000000\">\r\n  \u003ctitle>R.O.C · 会客室\u003c/title>\r\n  \u003clink rel=\"stylesheet\" href=\"./src/reception/reception.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/reception/document-viewer.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/paper-theme.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/roc-theme.css\">\r\n  \u003clink rel=\"stylesheet\" href=\"./src/mobile-common.css\">\n\u003c/head>\r\n\u003cbody class=\"reception-page\">\r\n  \u0 \r\n  \u003cscript type=\"module\" src=\"./src/characters-room-preview.js\">\u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n"},"moduleSources":{"src/chapter-shell.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { installTitlePrism } from 'https://roc-offline.invalid/src/title-prism.js';\nimport { restoreBody, CARD_STORAGE_KEY } from 'https://roc-offline.invalid/src/body/save.js';\nimport { createChapterFlow, restoreChapter } from 'https://roc-offline.invalid/src/chapter-flow.js';\nimport { installGameMusic, getMusicSettings, setMusicSettings, musicCue } from 'https://roc-offline.invalid/src/music/install.js';\n\ninstallGameMusic();\n\nconst MAIN_KEY = CARD_STORAGE_KEY;\nconst CHAPTER_KEY = 'roc-mobile:jinding-full-chapter-v1';\nconst AUTHOR_UNLOCK_KEY = 'roc-mobile:roc-authors-unlocked-v1';\nconst entry = document.querySelector('#chapter-entry');\nconst entryMusicHint = document.querySelector('#entry-music-hint');\nentryMusicHint?.addEventListener('animationend', event => {\n  if (event.animationName === 'entry-music-hint-dismiss') entryMusicHint.remove();\n}, { once: true });\ninstallTitlePrism();\nconst frame = document.querySelector('#chapter-frame');\nconst curtain = document.querySelector('#chapter-curtain');\nconst resume = document.querySelector('#continue-case');\nconst start = document.querySelector('#start-case');\nconst confirmation = document.querySelector('#new-case-confirmation');\nconst failure = document.querySelector('#chapter-failure');\nconst failureMessage = document.querySelector('#failure-message');\nconst authors = document.querySelector('#authors-panel');\nconst authorText = authors.querySelector('.author-text');\nconst authorLock = authors.querySelector('.author-lock');\nconst settings = document.querySelector('#settings-panel');\nconst volume = document.querySelector('#music-volume');\nconst volumeValue = document.querySelector('#music-volume-value');\nconst muted = document.querySelector('#music-muted');\nconst effectsVolume = document.querySelector('#effects-volume');\nconst effectsValue = document.querySelector('#effects-volume-value');\nconst fullscreen = document.querySelector('#toggle-fullscreen');\nconst settingsFeedback = document.querySelector('#settings-feedback');\nconst menu = entry.querySelector('.entry-actions');\nlet returnFocus = null;\nlet revealVersion = 0;\nlet revealTimer = null;\nlet readyTimer = null;\n\nfunction read(key) { try { return localStorage.getItem(key); } catch { return null; } }\nfunction revealAuthorText() {\n  authorText.inert = false;\n  authorText.removeAttribute('aria-hidden');\n  authorLock.hidden = true;\n}\nfunction unlockAuthors() {\n  revealAuthorText();\n  try { localStorage.setItem(AUTHOR_UNLOCK_KEY, '1'); }\n  catch { /* The completed session can still read the author text. */ }\n}\nfunction openOverlay(panel, firstFocus) {\n  returnFocus = document.activeElement;\n  panel.hidden = false;\n  entry.inert = true;\n  (firstFocus || panel.querySelector('button, input, a[href]'))?.focus();\n}\nfunction closeOverlay(panel) {\n  panel.hidden = true;\n  if (![authors, settings, confirmation, failure].some(item => !item.hidden)) entry.inert = false;\n  if (returnFocus?.isConnected && !entry.hidden && !entry.inert) returnFocus.focus();\n}\nfunction fail(message, returnToEntry = false) { failureMessage.textContent = message; document.querySelector('#retry-chapter').textContent = returnToEntry ? '返回' : '重试'; openOverlay(failure); }\nfunction renderMusicSettings() {\n  const value = getMusicSettings();\n  volume.value = Math.round(value.volume * 100);\n  volumeValue.value = `${volume.value}%`;\n  volumeValue.textContent = `${volume.value}%`;\n  effectsVolume.value = Math.round((Number.isFinite(value.effectsVolume) ? value.effectsVolume : 1) * 100);\n  effectsValue.value = `${effectsVolume.value}%`;\n  effectsValue.textContent = `${effectsVolume.value}%`;\n  muted.checked = value.masterMuted || value.muted;\n}\nfunction renderDisplaySettings() {\n  fullscreen.textContent = document.fullscreenElement ? '窗口' : '全屏';\n  fullscreen.disabled = !document.fullscreenEnabled && !document.fullscreenElement;\n}\nfunction readMain() { const saved=restoreBody(read(MAIN_KEY));return saved?.state.flow==='cards'?saved.state:null; }\nfunction reveal() {\n  const version = ++revealVersion;\n  curtain.style.opacity = '0';\n  frame.inert=false;\n  if (flow.snapshot().mainStarted) {\n    const state = readMain();\n    if (state && !state.complete) musicCue('month', { month: state.month });\n  }\n  clearTimeout(revealTimer);\n  revealTimer = setTimeout(() => { if (version === revealVersion) curtain.hidden = true; }, 500);\n}\nconst initialChapter = restoreChapter(read(CHAPTER_KEY));\nif (initialChapter?.stage === 'complete') unlockAuthors();\nelse if (read(AUTHOR_UNLOCK_KEY) === '1') revealAuthorText();\n\nconst flow = createChapterFlow({\n  origin: location.origin,\n  getFrameSource: () => frame.contentWindow,\n  readMain, readMainRaw: () => read(MAIN_KEY),\n  initialChapter,\n  mainURL:'./board-receipt-preview.html?game=1',\n  newRunId: () => crypto.randomUUID?.() ?? Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8,'0')).join('-'),\n  saveChapter(value) {\n    try { localStorage.setItem(CHAPTER_KEY, JSON.stringify(value)); }\n    catch { /* The main game also handles storage failures without losing live play. */ }\n  },\n  loadFrame(url) {\n    entryMusicHint?.remove();\n    revealVersion++; clearTimeout(revealTimer); clearTimeout(readyTimer);\n    curtain.hidden = false; curtain.style.opacity = '1';\n    confirmation.hidden = failure.hidden = authors.hidden = settings.hidden = true;\n    entry.inert = false;\n    entry.hidden = true; frame.hidden = false;\n    frame.inert=true;\n    frame.title = url.includes('prologue') ? 'R.O.C · 赴约' : 'R.O.C · 调查';\n    if (url.includes('prologue')) musicCue('entry');\n    frame.src = url;\n    if (url.includes('board-receipt-preview')) readyTimer = setTimeout(() => {\n      if (!flow.snapshot().mainStarted) fail('调查页面暂未就绪，原有资金和阅读记录仍然保留。');\n    }, 20000);\n  },\n  postToFrame: (message, origin) => postOffline(frame.contentWindow, message, origin),\n  showEntry({ canContinue, continueLabel }) {\n    const returning = entry.hidden;\n    musicCue('menu');\n    entry.hidden = false; frame.hidden = true; curtain.hidden = true;\n    if(frame.hasAttribute('srcdoc') || frame.getAttribute('src')!=='about:blank')frame.src='about:blank';\n    resume.hidden = false; resume.disabled = !canContinue;\n    resume.textContent = '继续游戏';\n    resume.setAttribute('aria-label', canContinue ? `继续游戏：${continueLabel}` : '继续游戏（暂无存档）');\n    resume.title = canContinue ? continueLabel : '';\n    start.textContent = '开始游戏';\n    if (returning) (canContinue ? resume : start).focus({ preventScroll: true });\n  },\n  showConfirmation() { openOverlay(confirmation, document.querySelector('#cancel-new-case')); },\n  showMissingMain() { fail('调查存档未找到，未重新生成资金记录。你可以返回后选择从邀请函重新开始。', true); },\n  revealFrame: reveal,\n  endingComplete(){unlockAuthors();flow.menu();},\n});\n\nstart.addEventListener('click', () => flow.startNew({ confirmed: true }));\nresume.addEventListener('click', () => flow.continueCase());\ndocument.querySelector('#confirm-new-case').addEventListener('click', () => flow.startNew({ confirmed: true }));\ndocument.querySelector('#cancel-new-case').addEventListener('click', () => { closeOverlay(confirmation); start.focus(); });\ndocument.querySelector('#retry-chapter').addEventListener('click', () => {\n  closeOverlay(failure);\n  if (!flow.retry()) flow.menu();\n});\nframe.addEventListener('load', () => flow.loaded());\nframe.addEventListener('error', () => fail('场景暂未载入，原有调查记录仍然保留。'));\nwindow.addEventListener('message', event => { flow.message(event); if (flow.snapshot().mainStarted) clearTimeout(readyTimer); });\ndocument.addEventListener('keydown', event => {\n  const activePanel = [failure, confirmation, settings, authors].find(panel => !panel.hidden);\n  if (!activePanel) return;\n  if (event.key === 'Escape' && activePanel !== failure) { closeOverlay(activePanel); event.preventDefault(); }\n  if (event.key === 'Tab') {\n    const controls = [...activePanel.querySelectorAll('button:not(:disabled), input:not(:disabled), a[href], summary, [tabindex=\"0\"]')]\n      .filter(control => !control.inert && control.checkVisibility());\n    const first = controls[0], last = controls.at(-1);\n    if (event.shiftKey && document.activeElement === first) { last?.focus(); event.preventDefault(); }\n    else if (!event.shiftKey && document.activeElement === last) { first?.focus(); event.preventDefault(); }\n  }\n});\nmenu.addEventListener('keydown', event => {\n  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key) || event.ctrlKey || event.altKey || event.metaKey) return;\n  const items = [...menu.querySelectorAll('button:not(:disabled)')];\n  const index = items.indexOf(document.activeElement);\n  if (index \u003c 0) return;\n  let next = 0;\n  if (event.key === 'End') next = items.length - 1;\n  if (event.key === 'ArrowUp') next = (index - 1 + items.length) % items.length;\n  if (event.key === 'ArrowDown') next = (index + 1) % items.length;\n  event.preventDefault();\n  items[next].focus();\n});\ndocument.querySelector('#open-authors').addEventListener('click', () => openOverlay(authors));\ndocument.querySelector('#open-settings').addEventListener('click', () => { renderMusicSettings(); renderDisplaySettings(); openOverlay(settings, volume); });\ndocument.querySelectorAll('[data-close-panel]').forEach(button => button.addEventListener('click', () => closeOverlay(button.closest('.entry-overlay'))));\nfor (const panel of [authors, setti >__roc.fetch(window,value,...args);\n/** Layered cover lighting. Optical functions reuse three.js MIT shader code;\n * see vendor/glass-optics/NOTICE.md for the exact upstream sources.\n * No cursor replacement, timers, persistent render loop, or game-state writes.\n */\nimport { createTitleGlass } from 'https://roc-offline.invalid/src/title-glass.js';\nimport { glassLightProximity } from 'https://roc-offline.invalid/src/title-light-scope.js';\nimport { titleCharacterShadows } from 'https://roc-offline.invalid/src/title-shadow.js';\nconst installed = new WeakMap();\nconst clamp = (value, min, max) => Math.max(min, Math.min(max, value));\n\nexport function titlePointer(clientX, clientY, rect) {\n  if (![clientX, clientY, rect?.left, rect?.top, rect?.width, rect?.height].every(Number.isFinite)\n    || rect.width \u003c= 0 || rect.height \u003c= 0) return { x: 0, y: 0 };\n  return { x: clamp((clientX - rect.left) / rect.width * 2 - 1, -1, 1),\n    y: clamp((clientY - rect.top) / rect.height * 2 - 1, -1, 1) };\n}\n\n/** Install once on the real cover. Each pointer change schedules only enough\n * frames to settle; opening an overlay or entering the game cancels immediately.\n */\nexport function installTitlePrism({ root = document.querySelector('.entry-card'),\n  container = document.querySelector('#chapter-entry'), view = window } = {}) {\n  if (!root || !container) return { dispose() {} };\n  if (installed.has(root)) return installed.get(root);\n  const doc = root.ownerDocument || view.document;\n  const artwork = root.querySelector?.('.prism-art') || root;\n  const preference = view.matchMedia?.('(prefers-reduced-motion: reduce)');\n  const removers = [];\n  const styles = new Map();\n  let rect, frame = null, lastTime = null, disposed = false;\n  let sampleGlass = false;\n  let glass, warmup = null;\n  let x = 0, y = 0, light = 0, glassNear = 0, targetX = 0, targetY = 0, targetLight = 0, targetGlass = 0;\n  const enabled = () => !disposed && !doc.hidden && !containe umeInvestigation(state) {\n  return state?.flow === 'cards' && !state.complete && state.window === 'investigation'\n    && state.investigation.earned \u003c investigationCap(state)\n    && (state.boardMode === 'cash' || ['failed', 'cleared'].includes(state.board.status));\n}\n\nfunction copyCase(state) {\n  // Tiles and finance reducers are immutable. Keep the board reference until a tile\n  // action so the test-only solution witness never needs to enter serialized data.\n  return {\n    ...state, investigation: { ...state.investigation }, available: [...state.available], read: [...state.read],\n    boardRecords: state.boardRecords.map(record => ({ ...record, ...(state.flow === 'cards' ? { cashClears: [...record.cashClears] } : {}) })),\n    answers: clone(state.answers), drafts: clone(state.drafts), messages: clone(state.messages),\n    invitation: { ...state.invitation }, crises: clone(state.crises),\n    ...(state.flow === 'cards' ? { cardFlow: clone(state.cardFlow) } : {}),\n    ...(state.monthlyBusinessDecisions ? { monthlyBusinessDecisions: clone(state.monthlyBusinessDecisions) } : {}),\n  };\n}\n\nfunction applyFinance(state, action, events) {\n  const result = reduceFinance(state.finance, action);\n  if (result.error) throw new Error(result.error);\n  state.finance = result.state;\n  events.push(...result.events);\n}\n\n/** The monthly contract may settle any outstanding lot, not just last month's. */\nexport function monthlyBusinessOptions(state) {\n  const previousMonthInvested = state.finance.lots\n    .filter(lot => lot.month === state.month - 1)\n    .reduce((total, lot) => total + lot.amount, 0);\n  const purchasedPreviousMonth = previousMonthInvested > 0;\n  const canSubscribe = state.flow === 'cards' && !state.complete && state.window === 'invest' && state.finance.day === 1;\n  const principal = state.finance.principal;\n  const canExit = canSubscribe && purchasedPreviousMonth && principal > 0\n    && !state.finance.requests.some(request => request.month === state.month);\n  return { canSubscribe, canExit, purchasedPreviousMonth, previousMonthInvested,\n    principal, exitQuote: publicFinance(state.finance).quote,\n    options: ['subscribe', ...(canExit ? ['exit'] : [])] };\n}\n\nfunction beginInvestigation(state, events) {\n  applyFinance(state, { type: 'advanceDate', month: state.month, day: 2, crisis: state.crises.activeMonth === state.month }, events);\n  state.window = 'investigation';\n  triggerCrisis(state, 'investigation', events);\n  events.push({ type: 'investigation-started', month: state.month });\n}\n\nfunction monthlyAction(state, action) {\n  if (state.flow !== 'cards') return null;\n  const type = action.type === 'monthlyPurchase' ? 'subscribe'\n    : ['monthlyExit', 'exit'].includes(action.type) ? 'exit' : null;\n  if (!type) return null;\n  return { type, id: action.id ?? `case:monthly-${type}:${state.month}`, amount: action.amount,\n    ...(type === 'exit' ? { reason: action.reason } : {}) };\n}\n\nfunction confirmMonthlyBusiness(state, action, decision, events) {\n  const options = monthlyBusinessOptions(state);\n  if (!options.canSubscribe) throw new Error('本月认购与退出办理已经结束。');\n  if (action.expectedMonth !== undefined && action.expectedMonth !== state.month\n    || action.expectedDay !== undefined && action.expectedDay !== 1) throw new Error('日期已经变化，请重新确认。');\n  if (typeof decision.id !== 'string' || !decision.id.length || decision.id.length > 160 || decision.id.startsWith('sys:')) throw new Error('本次合同缺少有效记录号。');\n  if (state.finance._processed.includes(decision.id)) throw new Error('该记录号已用于其他业务。');\n  if (!integer(decision.amount) || decision.amount > 1_000_000_000) throw new Error('请输入有效办理金额。');\n  if (decision.type === 'exit') {\n    if (!options.canExit) throw new Error('本月未开放退出申请。');\n    applyFinance(state, { type: 'exit', amount: decision.amount, reason: decision.reason, id: decision.id }, events);\n  } else if (decision.amount > 0) {\n    applyFinance(state, { type: 'invest', amount: decision.amount, id: decision.id }, events);\n  }\n  state.monthlyBusinessDecisions = [...(state.monthlyBusinessDecisions || []), { ...decision, month: state.month }];\n  beginInvestigation(state, events);\n}\n\nfunction applyCard(state, action, events) {\n  if (state.flow !== 'cards') throw new Error('当前不是正式卡片调查。');\n  const result = reduceCardFlow(state, action);\n  if (result.error) throw new Error(result.error);\n  state.cardFlow = result.cardFlow;\n  events.push(...result.events);\n}\n\nfunction queueMessage(state, message, events) {\n  if (state.messages.some(item => item.id === message.id)) return;\n  state.messages.push({ sent: false, seen: false, month: state.month, day: state.finance.day, ...message });\n  events.push({ type: 'message', id: message.id, character: message.character });\n}\n\nfunction triggerCrisis(state, checkpoint, events) {\n  const plan = state.crises.plans.find(item => item.month === state.month && item.checkpoint === checkpoint);\n  if (!plan || state.crises.history.some(item => item.id === plan.id)) return;\n  applyFinance(state, { type: 'setCrisis', active: true }, events);\n  state.crises.history.push({ ...plan, day: state.finance.day });\n  state.crises.activeMonth = state.month;\n  add(state.available, 'D12B');\n  queueMessage(state, {\n    id: `crisis:${plan.id}`, character: 'lu', prompt: `${MONTHS[state.month].label}这份付款通知，是怎么回事？`,\n    reply: ['系统在调整，这个月还没执行的收益支付要暂缓。通知先给你，具体到没到账，看实际登记。', '要是考虑追加，仍然由你决定。我不能保证追加以后能优先付款。'],\n  }, events);\n  events.push({ type: 'crisis', id: plan.id, month: state.month });\n}\n\nfunction awardDocument(state, id, events) {\n  state.investigation.spent += 1;\n  add(state.available, id);\n  events.push({ type: 'document-earned', id });\n  if (!state.complete && state.window === 'investigation'\n    && MONTHS[state.month].docs.every(docId => state.available.includes(docId))) triggerCrisis(state, 'lastDoc', events);\n}\n\nfunction deliverEarnedDocuments(state, events) {\n  if (state.flow !== 'cards' || state.investigation.spent >= state.investigation.earned) return;\n  for (const id of blindOrder(state)) {\n    if (state.investigation.spent === state.investigation.earned) return;\n    if (!state.available.includes(id)) awardDocument(state, id, events);\n  }\n}\n\nfunction updateRecords(state, events) {\n  const f = state.finance;\n  if (f.ledger.length) add(state.available, 'C02');\n  if (f.requests.length) add(state.available, 'C01');\n  if (f.ledger.some(item => ['interest-paid', 'exit-approved'].includes(item.type) && item.cashDelta > 0)) {\n    add(state.available, 'P02');\n    if (['D06', 'D07', 'D08'].every(id => state.read.includes(id))) add(state.available, 'P03');\n  }\n  if (!state.invitation.offered && state.window === 'investigation' && ['D06', 'D07', 'D08'].every(id => state.read.includes(id))) {\n    state.invitation = { offered: true, month: state.month, status: 'pending',\n      ...(state.flow === 'cards' ? { day: state.finance.day, crisisAtOffer: state.crises.activeMonth === state.month } : {}),\n    };\n    queueMessage(state, {\n      id: 'private-invitation', character: 'lu', prompt: '你说还有一笔单独认购的机会？',\n      reply: [\n        state.crises.activeMonth === state.month ? '现在有付款调整，你看过通知了。这次单独认购你可以考虑，也可以不办。' : '你这边的资料已经核过了。我可以单独给你登记一次认购，本月有效。',\n        '首次约定结算在下个月月初，不足整月按实际天数算。追加不保证退出获批，也不保证优先付款，你想清楚再定。',\n      ],\n    }, events);\n    events.push({ type: 'invitation', month: state.month });\n  }\n}\n\nexport function createCase(seed = Date.now(), options = {}) {\n  if (options.flow !== undefined && options.flow !== 'cards') throw new TypeError('未知调查流程。');\n  const savedSeed = String(seed).slice(0, 160);\n  const state = {\n    version: 1, seed: savedSeed, month: 0, window: 'invest', finance: createFinance(savedSeed),\n    board: null, attempt: 0, investigation: { earned: 0, spent: 0, progress: 0 },\n    // Only completed chances carry across attempts; partial progress never does.\n    boardRecords: MONTHS.map(() => ({ earnedBeforeAttempt: 0, cleared: false, ...(options.flow === 'cards' ? { cashClears: [] } : {}) })),\n    available: [...INITIAL_DOCS], read: [], answers: {}, drafts: {}, messages: [],\n    invitation: { offered: false, month: null, status: 'pending' },\n    crises: { plans: planCrises(savedSeed), history: [], activeMonth: null }, complete: false,\n    ...(options.flow === 'cards' ? { flow: 'cards', boardMode: 'investigation', cardFlow: createCardFlow({ progression: options.progression || 'connections' }) } : {}),\n  };\n  state.board = createBoard(boardSeed(state));\n  triggerCrisis(state, 'start', []);\n  return state;\n}\n\n/** Empty string means available for submission; no correctness checks here. */\nexport function questionMissing(state, qId) {\n  if (state.flow === 'cards') return questionUnavailable(state, qId);\n  const question = QUESTION_MAP[qId];\n  if (!question) return '没有这道问题。';\n  if (question.phaseMin > state.month) return `${MONTHS[question.phaseMin].label}开放。`;\n  if (question.phaseMin === state.month && state.window !== 'investigation') return '先结束本月认购，再开始本月调查。';\n  const missing = question.requiredDocs.filter(id => !state.read.includes(id));\n  if (missing.length) return `先查阅：${missing.join('、')}。`;\n  if (question.requiredAnyGroups?.length && !question.requiredAnyGroups.some(group => group.every(id => state.read.includes(id)))) {\n    return `先查阅：${question.requiredAnyGroups.map(group => group.join('＋')).join('或')}。`;\n  }\n  if (qId === 'Q7' && !state.crises.history.length) return '尚未收到实际危机通知。';\n  return '';\n}\n\nexport function completion(state) {\n  if (state.flow === 'cards') return cardCompletion(state);\n  const answered = QUESTIONS.filter(question => isQuestionAnswered(question, state.answers[question.id])).length;\n  const current = MONTHS[state.month];\n  const missingDocs = current.docs.filter(id => !state.available.includes(id));\n  const missingQuestions = current.questions.filter(id => !isQuestionAnswered(QUESTION_MAP[id], state.answers[id]));\n  const monthReady = state.window === 'investigation' && missingDocs.length === 0 && missingQuestions.length === 0;\n  return { answered, total: QUESTIONS.length, monthReady, complete: state.month === 3 && monthReady && answered === QUESTIONS.length, missingDocs, missingQuestions };\n}\n\nfunction tileAction(state, action, events) {\n  if (state.window !== 'investigation') throw new Error('本月调查尚未开始。');\n  const before = state.board;\n  const board = action.type === 'pick' ? pick(before, action.id)\n    : action.type === 'reserve' ? returnReserve(before, action.id) : useTool(before, action.tool);\n  if (board === before) throw new Error(before.status === 'failed' ? '本次牌局已结束，请重新开局。' : '当前无法进行这次牌局操作。');\n  state.board = board;\n  const cap = investigationCap(state);\n  if (state.boardMode !== 'cash' && state.investigation.earned \u003c cap) {\n    const progress = state.investigation.progress + Math.max(0, board.investigationMatches - before.investigationMatches);\n    const amount = Math.min(cap - state.investigation.earned, Math.floor(progress / 3));\n    state.investigation.earned += amount;\n    state.investigation.progress = state.investigation.earned === cap ? 0 : progress % 3;\n    if (amount) events.push({ type: 'investigation-earned', amount, available: state.investigation.earned - state.investigation.spent });\n  }\n  if (before.status !== 'failed' && board.status === 'failed') {\n    state.investigation.progress = 0;\n    events.push({ type: 'board-failed' });\n  }\n  if (before.status !== 'cleared' && board.status === 'cleared') {\n    if (state.boardMode === 'cash') {\n      applyFinance(state, { type: 'replayReward', month: state.month, attempt: state.attempt, id: `case:replay-reward:${state.month}:${state.attempt}` }, events);\n      state.boardRecords[state.month].cashClears.push(state.attempt);\n    } else {\n      state.boardRecords[state.month].cleared = true;\n      applyFinance(state, { type: 'boardReward', month: state.month, id: `case:board-reward:${state.month}` }, events);\n    }\n    events.push({ type: 'board-cleared', month: state.month, ...(state.flow === 'cards' ? { mode: state.boardMode } : {}) });\n  }\n}\n\nfunction advanceMonth(state, events) {\n  if (state.flow === 'cards') triggerCrisis(state, 'lastDoc', events);\n  if (state.invitation.offered && state.invitation.status === 'pending') state.invitation.status = 'expired';\n  if (state.flow === 'cards') state.cardFlow.connectionBaseline = cardConnections(state);\n  state.month += 1;\n  state.window = 'invest'; state.attempt = 0;\n  if (state.flow === 'cards') state.boardMode = 'investigation';\n  state.investigation = state.flow === 'cards' ? { ...state.investigation, progress: 0 } : { earned: 0, spent: 0, progress: 0 };\n  if (state.flow === 'cards') state.boardRecords[state.month].earnedBeforeAttempt = state.investigation.earned;\n  state.crises.activeMonth = null;\n  const startCrisis = state.crises.plans.some(item => item.month === state.month && item.checkpoint === 'start');\n  applyFinance(state, { type: 'advanceDate', month: state.month, day: 1, crisis: startCrisis }, events);\n  state.board = createBoard(boardSeed(state));\n  triggerCrisis(state, 'start', events);\n  events.push({ type: 'month-started', month: state.month });\n}\n\n/** Actions are transactional: an error preserves the exact previous state. */\nexport function reduceCase(current, action, { autoDeliverEvidence = false } = {}) {\n  const fail = message => ({ state: current, error: message, events: [] });\n  if (!validateCase(current)) return fail('调查存档校验失败，请使用有效存档。');\n  if (!object(action) || typeof action.type !== 'string') return fail('无效操作。');\n  const decision = monthlyAction(current, action);\n  if (decision) {\n    const previous = current.monthlyBusinessDecisions?.find(item => item.id === decision.id);\n    if (previous) {\n      if (previous.type !== decision.type || previous.amount !== decision.amount\n        || previous.reason !== decision.reason) return fail('本次确认内容与已登记合同不一致。');\n      return { state: current, error: null, events: [], duplicate: true };\n    }\n  }\n  const reviewActions = ['read', 'draft', 'answer', 'message', 'seeChat', 'notebook', 'submitCardQuestion', 'readInvitation', 'completeTopic', 'draftConclusion', 'submitConclusion', 'deliverEvidence'];\n  if (current.complete && !reviewActions.includes(action.type)) return fail(current.flow === 'cards' ? '调查总结已经记录，本阶段资金与牌局已截止。' : '八题已经记录，本阶段资金与牌局已截止。');\n  const state = copyCase(current);\n  const events = [];\n  try {\n    switch (action.type) {\n      case 'monthlyPurchase': case 'monthlyExit':\n        if (!decision) throw new Error('当前不是月初合同流程。');\n        confirmMonthlyBusiness(state, action, decision, events);\n        break;\n      case 'invest':\n        if (state.window !== 'invest') throw new Error('普通认购窗口已关闭。');\n        if (action.amount === 0) break;\n        applyFinance(state, { type: 'invest', amount: action.amount, id: action.id || `case:invest:${state.month}:${state.finance.lots.length}` }, events);\n        break;\n      case 'closeWindow':\n        if (state.window !== 'invest') return { state: current, error: null, events: [] };\n        beginInvestigation(state, events);\n        break;\n      case 'pick': case 'reserve': case 'tool': tileAction(state, action, events); break;\n      case 'fastClear': {\n        if (state.window !== 'investigation') throw new Error('本月调查尚未开始。');\n        if (state.board.status === 'cleared') return { state: current, error: null, events: [] };\n        // A partial/shuffled/restored board may have no known legal continuation.\n        // Start a guaranteed attempt, preserving banked chances exactly as retry\n        // does, and replay legal picks in one transaction (one UI/save update).\n        state.boardRecords[state.month].earnedBeforeAttempt = state.investigation.earned;\n        state.attempt += 1;\n        state.board = createBoard(boardSeed(state));\n        state.investigation.progress = 0;\n        const path = getSolution(state.board);\n        if (path.length !== state.board.tiles.length) throw new Error('速通牌局未能准备完成。');\n        for (const id of path) tileAction(state, { type: 'pick', id }, events);\n        if (state.board.status !== 'cleared') throw new Error('速通牌局未能完成。');\n        break;\n      }\n      case 'retry':\n        if (state.window !== 'investigation') throw new Error('本月调查尚未开始。');\n        state.boardRecords[state.month].earnedBeforeAttempt = state.investigation.earned;\n        state.attempt += 1;\n        state.board = createBoard(boardSeed(state));\n        state.investigation.progress = 0;\n        if (state.flow === 'cards') state.boardMode = 'cash';\n        events.push({ type: 'board-restarted', attempt: state.attempt });\n        break;\n      case 'resumeInvestigation':\n        if (!canResumeInvestigation(state)) throw new Error('当前不需要补充调查，已有机会与资料已保留。');\n        state.boardRecords[state.month].earnedBeforeAttempt = state.investigation.earned;\n        state.attempt += 1;\n        state.board = createBoard(boardSeed(state));\n        state.boardMode = 'investigation';\n        state.investigation.progress = 0;\n        events.push({ type: 'board-restarted', attempt: state.attempt, mode: 'investigation', recovery: true });\n        break;\n      case 'draw': {\n        if (state.window !== 'investigation') throw new Error('本月调查尚未开始。');\n        const order = blindOrder(state);\n        const id = order.includes(action.id) ? action.id : /^slot-\\d+$/.test(String(action.id)) ? order[Number(String(action.id).slice(5))] : null;\n        if (!id || !order.includes(id)) throw new Error('这份资料当前无法获取。');\n        if (state.available.includes(id)) throw new Error('这份资料已经取得。');\n        if (state.investigation.earned \u003c= state.investigation.spent) throw new Error('还没有可用调查机会。');\n        awardDocument(state, id, events);\n        break;\n      }\n      case 'deliverEvidence':\n        if (state.flow !== 'cards' || state.investigation.spent === state.investigation.earned) return { state: current, error: null, events: [] };\n        break;\n      case 'read':\n        if (!state.available.includes(action.id) || !getDoc(state, action.id)) throw new Error('尚未取得这份资料。');\n        add(state.read, action.id);\n        if (state.flow === 'cards' && action.id === 'D12B') {\n          const crisisId = action.crisisId || state.crises.history.at(-1)?.id;\n          applyCard(state, { type: 'readNotice', crisisId }, events);\n        }\n        break;\n      case 'skipToReport': {\n        if (state.flow !== 'cards') throw new Error('当前不是正式卡片调查。');\n        if (cardCompletion(current).readyForSummary) return { state: current, error: null, events };\n        // Settle the elapsed game dates without replaying skipped toasts or audio.\n        const skippedEvents = [];\n        while (state.month \u003c MONTHS.length - 1) {\n          if (state.window === 'invest') beginInvestigation(state, skippedEvents);\n          advanceMonth(state, skippedEvents);\n        }\n        if (state.window === 'invest') beginInvestigation(state, skippedEvents);\n        triggerCrisis(state, 'lastDoc', skippedEvents);\n        state.cardFlow.reportUnlockedBySkip = true;\n        break;\n      }\n      case 'notebook': case 'submitCardQuestion': case 'readInvitation': case 'completeTopic': case 'draftConclusion': case 'submitConclusion':\n        applyCard(state, action, events);\n        break;\n      case 'draft': {\n        if (state.flow === 'cards') throw new Error('请通过卡片问题记录草稿。');\n        const question = QUESTION_MAP[action.id];\n        if (!question || question.phaseMin > state.month) throw new Error('这道问题尚未开放。');\n        if (question.type === 'open' ? !validateOpenResponse(action.value) : !Array.isArray(action.value) || action.value.some(id => !question.options.some(option => option.id === id))) throw new Error('回答草稿格式不正确。');\n        state.drafts[action.id] = clone(action.value);\n        break;\n      }\n      case 'answer': {\n        if (state.flow === 'cards') throw new Error('当前使用28项卡片问题，不提交旧选择题。');\n        const missing = questionMissing(state, action.id);\n        if (missing) throw new Error(missing);\n        const question = QUESTION_MAP[action.id];\n        if (!isQuestionAnswered(question, action.answer)) throw new Error(question.type === 'open' ? '请完成四项开放回答后提交。' : '请选择完整的回答。');\n        state.answers[action.id] = clone(action.answer);\n        state.drafts[action.id] = clone(action.answer);\n        if (question.type !== 'open') queueMessage(state, questionMessage(action.id, action.answer), events);\n        events.push({ type: 'question-recorded', id: action.id });\n        break;\n      }\n      case 'message': {\n        const message = state.messages.find(item => item.id === action.id);\n        if (!message) throw new Error('没有这条可发送的剧情消息。');\n        if (message.sent) break;\n        message.sent = true; message.seen = true;\n        events.push({ type: 'message-sent', id: message.id, character: message.character });\n        break;\n      }\n      case 'seeChat':\n        if (!['lu', 'zhou', 'lin'].includes(action.character)) throw new Error('没有这个联系人。');\n        for (const item of state.messages) if (item.character === action.character) item.seen = true;\n        break;\n      case 'invitationAccept':\n        if (!state.invitation.offered || state.invitation.status !== 'pending' || state.invitation.month !== state.month) throw new Error('本次私人邀请已结束。');\n        applyFinance(state, { type: 'invest', amount: action.amount, id: 'case:private-investment' }, events);\n        state.invitation.status = 'accepted';\n        break;\n      case 'invitationDecline':\n        if (!state.invitation.offered || state.invitation.status !== 'pending' || state.invitation.month !== state.month) throw new Error('本次私人邀请已结束。');\n        state.invitation.status = 'declined';\n        break;\n      case 'exit':\n        if (decision) confirmMonthlyBusiness(state, action, decision, events);\n        else applyFinance(state, { type: 'exit', amount: action.amount, reason: action.reason, id: action.id || `case:exit:${state.month}` }, events);\n        break;\n      case 'nextMonth': {\n        if (!completion(state).monthReady) throw new Error(state.flow === 'cards' ? '本月先在推理桌新增一条连线。' : '先收齐本月资料并提交本月问题。');\n        if (state.month === 3) throw new Error(state.flow === 'cards' ? '四个月调查到此截止，不进入下个月。' : '八题记录到此截止，不进入下个月。');\n        advanceMonth(state, events);\n        break;\n      }\n      default: throw new Error('没有这种操作。');\n    }\n    if (autoDeliverEvidence || action.type === 'deliverEvidence') deliverEarnedDocuments(state, events);\n    updateRecords(state, events);\n    if (state.flow === 'cards' && action.type === 'notebook' && !['position', 'arrange'].includes(action.operation)) {\n      const previousTopics = new Set(availableTopics(current).map(topic => topic.key));\n      for (const topic of availableTopics(state)) {\n        if (!topic.completed && !previousTopics.has(topic.key)) events.push({ type: 'topic-unlocked', key: topic.key, character: topic.character });\n      }\n    }\n    state.complete = completion(state).complete;\n    if (state.complete && !current.complete) events.push({ type: 'case-complete' });\n    if (!validateCase(state)) throw new Error('调查记录校验失败，本次操作未保存。');\n    return { state, error: null, events };\n  } catch (error) { return fail(error.message || '操作未完成。'); }\n}\n\nexport function validateCase(state) {\n  try {\n    if (!object(state) || state.version !== 1 || typeof state.seed !== 'string' || state.seed.length > 160 || !integer(state.month) || state.month > 3) return false;\n    if (state.flow !== undefined && state.flow !== 'cards' || state.flow !== 'cards' && Object.hasOwn(state, 'cardFlow')) return false;\n    if (state.flow === 'cards' ? !['investigation', 'cash'].includes(state.boardMode) : Object.hasOwn(state, 'boardMode')) return false;\n    if (!['invest', 'investigation'].includes(state.window) || !integer(state.  = state.investigation;\n    if (earned > investigationCap(state) || spent > earned || progress > 2 || (earned === investigationCap(state) && progress !== 0)) return false;\n    if (!Array.isArray(state.boardRecords) || state.boardRecords.length !== MONTHS.length) return false;\n    for (const [month, record] of state.boardRecords.entries()) {\n      const recordCap = state.flow === 'cards' ? MONTHS.slice(0, month + 1).reduce((sum, item) => sum + item.docs.length, 0) : MONTHS[month].docs.length;\n      if (!object(record) || !integer(record.earnedBeforeAttempt) || record.earnedBeforeAttempt > recordCap || typeof record.cleared !== 'boolean') return false;\n      if (state.flow === 'cards') {\n        if (!Array.isArray(record.cashClears) || !unique(record.cashClears) || !record.cashClears.every((attempt, index) => Number.isSafeInteger(attempt) && attempt > 0 && (!index || attempt > record.cashClears[index - 1]))) return false;\n        if (month > state.month && record.cashClears.length || month === state.month && record.cashClears.some(attempt => attempt > state.attempt)) return false;\n        const paid = state.finance.ledger.filter(row => row.type === 'board-replay-reward' && row.month === month).map(row => row.attempt);\n        if (JSON.stringify(paid) !== JSON.stringify(record.cashClears)) return false;\n      } else if (Object.hasOwn(record, 'cashClears') || state.finance.ledger.some(row => row.type === 'board-replay-reward')) return false;\n      if (month > state.month && (record.earnedBeforeAttempt !== 0 || record.cleared)) return false;\n      if (record.cleared !== state.finance._boardPaid[month]) return false;\n    }\n    const record = state.boardRecords[state.month];\n    const cap = investigationCap(state);\n    if (state.attempt === 0 && (state.flow !== 'cards' || state.month === 0) && record.earnedBeforeAttempt !== 0) return false;\n    const cashOnly = state.boardMode === 'cash';\n    if (cashOnly && state.attempt \u003c 1) return false;\n    if (earned !== (cashOnly ? record.earnedBeforeAttempt : Math.min(cap, record.earnedBeforeAttempt + Math.floor(state.board.investigationMatches / 3)))) return false;\n    const expectedProgress = cashOnly || earned === cap || state.board.status === 'failed' ? 0 : state.board.investigationMatches % 3;\n    if (progress !== expectedProgress || (!cashOnly && state.board.status === 'cleared' && !record.cleared)) return false;\n    if (cashOnly && record.cashClears.includes(state.attempt) !== (state.board.status === 'cleared')) return false;\n    if (!Array.isArray(state.available) || !Array.isArray(state.read) || !unique(state.available) || !unique(state.read) || !state.read.every(id => state.available.includes(id))) return false;\n    if (!INITIAL_DOCS.every(id => state.available.includes(id))) return false;\n    const allowed = new Set([...INITIAL_DOCS, 'D12B', 'P02', 'P03', 'C01', 'C02', ...MONTHS.slice(0, state.month + 1).flatMap(item => item.docs)]);\n    if (!state.available.every(id => typeof id === 'string' && allowed.has(id))) return false;\n    const spentDocs = (state.flow === 'cards' ? MONTHS.slice(0, state.month + 1) : [MONTHS[state.month]]).flatMap(month => month.docs);\n    if (spentDocs.filter(id => state.available.includes(id)).length !== spent) return false;\n    for (const month of state.flow === 'cards' ? [] : MONTHS.slice(0, state.month)) {\n      if (!month.docs.every(id => state.available.includes(id))) return false;\n      if (!month.questions.every(id => isQuestionAnswered(QUESTION_MAP[id], state.answers?.[id]))) return false;\n    }\n    if (!object(state.answers) || !object(state.drafts)) return false;\n    if (state.flow === 'cards' && (Object.keys(state.answers).length || Object.keys(state.drafts).length)) return false;\n    for (const [id, answer] of Object.entries(state.answers)) if (!QUESTION_MAP[id] || QUESTION_MAP[id].phaseMin > state.month || !isQuestionAnswered(QUESTION_MAP[id], answer)) return false;\n    for (const [id, value] of Object.entries(state.drafts)) if (!QUESTION_MAP[id] || QUESTION_MAP[id].phaseMin > state.month || (QUESTION_MAP[id].type === 'open' ? !validateOpenResponse(value) : !Array.isArray(value) || value.some(option => !QUESTION_MAP[id].options.some(item => item.id === option)))) return false;\n    if (!Array.isArray(state.messages) || !unique(state.messages.map(item => item.id)) || !state.messages.every(item => object(item) && typeof item.id === 'string' && ['lu', 'zhou', 'lin'].includes(item.character) && typeof item.prompt === 'string' && Array.isArray(item.reply) && item.reply.every(line => typeof line === 'string') && typeof item.sent === 'boolean' && typeof item.seen === 'boolean')) return false;\n    for (const message of state.messages) if (Object.hasOwn(message, 'month') || Object.hasOwn(message, 'day')) {\n      if (!integer(message.month) || message.month > state.month || ![1, 2].includes(message.day)) return false;\n    }\n    if (!object(state.invitation) || typeof state.invitation.offered !== 'boolean' || !['pending', 'accepted', 'declined', 'expired'].includes(state.invitation.status)) return false;\n    if (state.invitation.offered && (!integer(state.invitation.month) || state.invitation.month > state.month)) return false;\n    if (state.flow === 'cards' && state.invitation.offered && (![1, 2].includes(state.invitation.day) || typeof state.invitation.crisisAtOffer !== 'boolean')) return false;\n    if (!object(state.crises) || JSON.stringify(state.crises.plans) !== JSON.stringify(planCrises(state.seed)) || !Array.isArray(state.crises.history) || !unique(state.crises.history.map(item => item.id))) return false;\n    for (const item of state.crises.history) if (!state.crises.plans.some(plan => plan.id === item.id && plan.month === item.month && plan.checkpoint === item.checkpoint) || item.month > state.month || ![1, 2].includes(item.day)) return false;\n    const active = state.crises.history.some(item => item.month === state.month);\n    if (state.crises.activeMonth !== (active ? state.month : null) || state.finance.crisis !== active || state.available.includes('D12B') !== (state.crises.history.length > 0)) return false;\n    if (state.flow === 'cards' && !validateCardFlow(state)) return false;\n    if (typeof state.complete !== 'boolean' || state.complete !== completion(state).complete) return false;\n    return true;\n  } catch { return false; }\n}\n\nexport function blindCards(state) {\n  return blindOrder(state).map((id, index) => ({ id, slot: `slot-${index}`, month: MONTHS.find(month => month.docs.includes(id)).month, obtained: state.available.includes(id), locked: false }));\n}\n\n/** Suitable for on-screen/exported records, not for resuming a saved case. */\nexport function publicCase(state) {\n  return {\n    version: state.version, month: state.month, window: state.window, finance: publicFinance(state.finance),\n    investigation: { ...state.investigation }, available: [...state.available], read: [...state.read],\n    answers: clone(state.answers), drafts: clone(state.drafts), messages: clone(state.messages), invitation: { ...state.invitation },\n    crises: { history: state.crises.history.map(({ id, month, day }) => ({ id, month, day })), activeMonth: state.crises.activeMonth },\n    complete: state.complete, progress: completion(state),\n    ...(state.flow === 'cards' ? { flow: 'cards', cardFlow: clone(state.cardFlow) } : {}),\n  };\n}\n","src/body/finance.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n// Four-month body demo. Money is always integer cents; interest is rounded only\n// after all principal-days in one natural month have been combined.\nexport const FINANCE_VERSION = 1;\nexport const INITIAL_CASH = 1_000_000;\nexport const BOARD_REWARD = 60_000;\nexport const MONTH_DAYS = Object.freeze([30, 31, 30, 31]);\n\nconst clone = value => JSON.parse(JSON.stringify(value));\nconst money = value => Number.isSafeInteger(value) && value >= 0 && value \u003c= 1_000_000_000;\nconst idString = value => typeof value === 'string' && value.length > 0 && value.length \u003c= 160;\nconst object = value => value !== null && typeof value === 'object' && !Array.isArray(value);\nconst roundRatio = (numerator, denominator) => Math.floor((numerator + denominator / 2) / denominator);\nconst dueInterest = (units, days) => roundRatio(units * 8, days * 100);\nconst exitCash = (amount, quote) => roundRatio(amount * quote, 100);\n\nfunction hash(text) {\n  let value = 2166136261;\n  for (const character of String(text)) value = Math.imul(value ^ character.codePointAt(0), 16777619) >>> 0;\n  // Final mixing avoids correlated adjacent month labels.\n  value ^= value >>> 16;\n  value = Math.imul(value, 0x7feb352d);\n  value ^= value >>> 15;\n  value = Math.imul(value, 0x846ca68b);\n  return (value ^ value >>> 16) >>> 0;\n}\n\nfunction draws(seed) {\n  return {\n    quotes: Array.from({ length: 4 }, (_, month) => 60 + hash(`${seed}|quote|${month}`) % 31),\n    outcomes: Array.from({ length: 4 }, (_, month) => hash(`${seed}|approval|${month}`) % 100 \u003c 40),\n  };\n}\n\nfunction nextDate(state) {\n  if (state.day === 1) return { month: state.month, day: 2 };\n  return state.month \u003c 3 ? { month: state.month + 1, day: 1 } : null;\n}\n\nexport function createFinance(seed = Date.now()) {\n  const savedSeed = String(seed).slice(0, 160);\n  const random = draws(savedSeed);\n  return {\n    version: FINANCE_VERSION, initial: INITIAL_CASH,\n    cash: INITIAL_CASH, principal: 0, totalInterest: 0,\n    totalInvested: 0, totalReturned: 0, totalLoss: 0,\n    unpaidInterest: 0, earnedTile: 0, month: 0, day: 1,\n    crisis: false, ledger: [], lots: [], requests: [], settlements: [],\n    _seed: savedSeed, _quotes: random.quotes, _outcomes: random.outcomes,\n    _boardPaid: [false, false, false, false], _processed: [], _crises: [],\n    _accrual: { month: 0, weightedPrincipalDays: 0, throughDay: 0 },\n  };\n}\n\nfunction entry(state, value) {\n  if (!idString(value.id) || state.ledger.some(row => row.id === value.id)) throw new Error('这条资金记录已存在');\n  const row = {\n    month: state.month, day: state.day, amount: 0,\n    cashDelta: 0, principalDelta: 0, lossDelta: 0, unpaidDelta: 0,\n    ...value,\n  };\n  state.cash += row.cashDelta;\n  state.principal += row.principalDelta;\n  state.totalLoss += row.lossDelta;\n  state.unpaidInterest += row.unpaidDelta;\n  state.ledger.push(row);\n}\n\nfunction enterCrisis(state, events) {\n  if (state.crisis) return;\n  state.crisis = true;\n  state._crises.push({ month: state.month, day: state.day });\n  entry(state, { id: `sys:crisis:${state.month}`, type: 'crisis', label: '本月阶段性付款延期' });\n  events.push({ type: 'crisis', month: state.month, day: state.day });\n}\n\nfunction accrueToMonthEnd(state) {\n  const days = MONTH_DAYS[state.month];\n  state._accrual.weightedPrincipalDays += state.principal * (days - state._accrual.throughDay);\n  state._accrual.throughDay = days;\n}\n\nfunction settleMonth(state, finishedMonth, accrual, events) {\n  const amount = dueInterest(accrual.weightedPrincipalDays, MONTH_DAYS[finishedMonth]);\n  const paid = !state.crisis;\n  state.settlements.push({\n    month: finishedMonth, days: MONTH_DAYS[finishedMonth],\n    weightedPrincipalDays: accrual.weightedPrincipalDays,\n    amount, paid, paymentMonth: state.month, paymentDay: 1,\n  });\n  entry(state, {\n    id: `sys:interest:${finishedMonth}`, type: paid ? 'interest-paid' : 'interest-unpaid',\n    label: `${finishedMonth + 4}月应计收益${paid ? '实际到账' : '暂未支付'}`,\n    sourceMonth: finishedMonth, amount,\n    cashDelta: paid ? amount : 0, unpaidDelta: paid ? 0 : amount,\n  });\n  if (paid) state.totalInterest += amount;\n  events.push({ type: paid ? 'interest-paid' : 'interest-unpaid', amount, sourceMonth: finishedMonth, month: state.month, day: state.day });\n}\n\nfunction extinguishLots(state, requested, quote) {\n  let remaining = requested, totalTaken = 0, previousCash = 0;\n  for (const lot of state.lots) {\n    const taken = Math.min(remaining, lot.remaining);\n    totalTaken += taken;\n    const allocatedCash = exitCash(totalTaken, quote) - previousCash;\n    previousCash += allocatedCash;\n    lot.remaining -= taken;\n    lot.returned += allocatedCash;\n    lot.loss += taken - allocatedCash;\n    remaining -= taken;\n    if (remaining === 0) break;\n  }\n  if (remaining !== 0) throw new Error('申请本金超出未结清余额');\n}\n\nconst transactionTypes = new Set(['invest', 'exit', 'boardReward', 'replayReward']);\n\nexport function reduceFinance(current, action) {\n  const fail = error => ({ state: current, error, events: [] });\n  if (!validateFinance(current)) return fail('当前资金记录无效，请恢复案件进度');\n  if (!object(action) || typeof action.type !== 'string') return fail('资金操作无效');\n  if (transactionTypes.has(action.type)) {\n    if (!idString(action.id) || action.id.startsWith('sys:')) return fail('本次操作缺少有效记录号');\n    if (current._processed.includes(action.id)) return { state: current, error: null, events: [], duplicate: true };\n  }\n  if (action.expectedMonth !== undefined && action.expectedMonth !== current.month || action.expectedDay !== undefined && action.expectedDay !== current.day) return fail('日期已经变化，请重新确认');\n  const state = clone(current);\n  const events = [];\n  try {\n    switch (action.type) {\n      case 'invest': {\n        if (!money(action.amount) || action.amount \u003c= 0) return fail('请输入有效认购金额');\n        if (action.amount > state.cash) return fail('实际可用现金不足');\n        entry(state, { id: action.id, type: 'invest', label: '认购转出', amount: action.amount, cashDelta: -action.amount, principalDelta: action.amount });\n        state.totalInvested += action.amount;\n        const firstDue = { month: state.month + 1, day: 1 };\n        state.l
