th:'100%',height:'100%',margin:'0',transform:'none',translate:'none',transition:'none'});\n      layer.append(node);return node;\n    }\n    function animate(node,frames,options) {\n      const animation=node.animate(frames,options);animations.add(animation);return animation;\n    }\n    try {\n      const companions = Array.isArray(matched) && matched.length >= 2\n        && matched.slice(0,2).every(item=>typeof item?.html==='string' && rectangle(item.rect))\n        ? matched.slice(0,2).map(ghost) : [];\n      const incoming = ghost(source);\n      host.append(layer);groups.add(group);\n      const dx=target.left-source.rect.left,dy=target.top-source.rect.top;\n      const sx=target.width/source.rect.width,sy=target.height/source.rect.height;\n      const flight=animate(incoming,[\n        {transform:'translate3d(0,0,0) scale(1,1)',opacity:1},\n        {transform:`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`,opacity:1},\n      ],{duration:FLIGHT_MS,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});\n      flight.finished.then(()=>{\n        if(ended)return;\n        if(companions.length!==2){group.cleanup();return;}\n        // Retarget after arrival so a short match collapse uses the slot's size.\n        Object.assign(incoming.style,{left:`${target.left}px`,top:`${target.top}px`,\n          width:`${target.width}px`,height:`${target.height}px`});\n        animations.delete(flight);flight.cancel();\n        try {\n          const collapse=[...companions,incoming].map(node=>animate(node,[\n            {transformOrigin:'50% 50%',transform:'scale(1)',opacity:1},\n            {transformOrigin:'50% 50%',transform:'scale(.2)',opacity:0},\n          ],{duration:MATCH_MS,easing:'cubic-bezier(.4,0,1,1)',fill:'both'}));\n          Promise.allSettled(collapse.map(animation=>animation.finished)).then(group.cleanup);\n        } catch {group.cleanup();}\n      },group.cleanup);\n      return true;\n    } catch {group.cleanup();return false;}\n  }\n  return {play,cancel};\n}\n","src/subscription-paper.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { createPaperPageMotion } from 'https://roc-offline.invalid/src/paper-page-motion.js';\n\n/** Paper-only presentation. Money and dates are still decided by the case reducer. */\nexport function createSubscriptionPaper({ getState, confirm, sound, notify }) {\n  const dialog = document.createElement('dialog');\n  dialog.className = 'subscription-dialog'; dialog.setAttribute('aria-label', '产品认购文件');\n  document.body.append(dialog);\n  const pageMotion=createPaperPageMotion(dialog);\n  let page = 0, amount = '', acknowledged = false, busy = false, mode = 'monthly', openedAt, onBack;\n  const drafts = new Map();\n  const draftKey = (value, context) => `${value}:${context.seed}:${context.month}`;\n  const remember = () => { if (openedAt) drafts.set(draftKey(mode, openedAt), { page, amount, acknowledged }); };\n  function returnToCover() { pageMotion.cancel(); remember(); dialog.close(); const callback = onBack; onBack = undefined; callback?.(); }\n  const money = cents => (cents / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 });\n  const esc = value => String(value).replace(/[&\u003c>\"']/g, c => ({ '&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[c]));\n  function render() {\n    pageMotion.cancel();\n    const state = getState(), month = state.month + 4, nextMonth = month + 1;\n    const number = `WY-2026-${String(month).padStart(2, '0')}${mode === 'private' ? '02' : '01'}`;\n    const title = ['投资产品认购单', '认购业务确认书', '风险揭示书'][page];\n    const body = page === 0 ? `\n      \u003cp>甲方（认购人）：\u003cspan class=\"paper-blank\">本人\u003c/span>\u003c/p>\n      \u003cp>乙方（项目管理方）：金鼎财富（虚构）\u003c/p>\n      \u003ch3>第一条　产品基本信息\u003c/h3>\n      \u003cdl>\u003cdt>产品名称\u003c/dt>\u003cdd>稳盈计划\u003c/dd>\u003cdt>业务日期\u003c/dt>\u003cdd>2026年${month}月${state.finance.day}日\u003c/dd>\u003cdt>业务类别\u003c/dt>\u003cdd>${mode === 'private' ? '老客户额外认购' : '月初认购'}\u003c/dd>\u003cdt>宣传收益\u003c/dt>\u003cdd>每月固定收益8%\u003c/dd>\u003cdt>约定结算\u003c/dt>\u003cdd>每月结算，首次为${nextMonth}月1日\u003c/dd>\u003c/dl>\n      \u003ch3>第二条　认购金额\u003c/h3>\n      \u003clabel class=\"paper-amount\">人民币 ¥ \u003cinput id=\"subscription-amount\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" maxlength=\"16\" aria-label=\"认购金额（元）\" placeholder=\"0.00\" value=\"${esc(amount)}\"> 元\u003c/label>\n      \u003cp class=\"paper-small\">本人可用现金：¥ ${money(state.finance.cash)}。本次不认购可填写0元。\u003c/p>\n      \u003cp class=\"paper-signature\">认购人：本人\u003cspan>业务登记：金鼎财富\u003c/span>\u003c/p>` : page === 1 ? `\n      \u003ch3>一、金额登记\u003c/h3>\u003cp>本次申请认购人民币 \u003cstrong>¥ ${money(parseAmount(amount) || 0)}\u003c/strong>。经本人确认后，从可用现金中划入项目认购登记。\u003c/p>\n      \u003ch3>二、收益计算\u003c/h3>\u003cp>月约定收益率8%，采用单利，不自动复投。以实际未结清本金和持有天数计算；不足整月，按所在自然月实际天数折算。同月各段合并结算到分。\u003c/p>\n      \u003ch3>三、结算安排\u003c/h3>\u003cp>本次认购的首次约定结算日为2026年${nextMonth}月1日。约定金额与实际到账分别记录；最终以本人资金流水、到账回单为准。\u003c/p>\n      \u003ch3>四、本人确认\u003c/h3>\u003cp>本单仅登记本次业务。阅读项目文件不等于已经认购，未确认前不扣除资金。\u003c/p>\n      \u003cp class=\"paper-signature\">认购人：本人\u003cspan>日期：${month}月${state.finance.day}日\u003c/span>\u003c/p>` : `\n      \u003ch3>致认购人\u003c/h3>\u003cp>请阅读以下事项，并结合您已获得的项目材料，自行决定是否参与本次认购。\u003c/p>\n      \u003ch3>一、收益与付款风险\u003c/h3>\u003cp>宣传和约定收益不代表项目实际经营利润，也不等于款项已经支付。实际支付可能延期；已到账与应付未付金额分别登记。\u003c/p>\n      \u003ch3>二、本金与资金使用风险\u003c/h3>\u003cp>认购资金划入项目后，不再计入本人可用现金。项目可能出现资金周转困难，存在本金不能按预期收回的风险。\u003c/p>\n      \u003ch3>三、材料核实\u003c/h3>\u003cp>历史到账回单、项目月报及他人的经历，各自只反映其记载范围。本人应独立核对材料，不将单份资料视为完整保证。\u003c/p>\n      \u003clabel class=\"paper-ack\">\u003cinput id=\"subscription-ack\" type=\"checkbox\" ${acknowledged ? 'checked' : ''}>本人已阅读本次认购文件及风险揭示。\u003c/label>\n      \u003cp class=\"paper-final-amount\">本次认购金额：\u003cstrong>¥ ${money(parseAmount(amount) || 0)}\u003c/strong>\u003c/p>`;\n    dialog.innerHTML = `\u003cbutton type=\"button\" data-paper=\"back\" class=\"paper-scene-back\" aria-label=\"返回\">\u003csvg viewBox=\"0 0 40 32\" aria-hidden=\"true\">\u003cpath d=\"M17 5 6 16l11 11M7 16h27\"/>\u003c/svg>\u003c/button>\u003cdiv class=\"subscription-layout\">\u003carticle class=\"subscription-paper\" aria-label=\"${title}\">\u003cheader>\u003cp class=\"paper-agreement-no\">业务编号：${number}\u003c/p>\u003ch1>稳盈计划\u003c/h1>\u003ch2>${title}\u003c/h2>\u003c/header>\u003csection class=\"subscription-body\">${body}\u003c/section>\u003cfooter>第 ${page + 1} 页 / 共 3 页 · 游戏虚构道具\u003c/footer>\u003c/article>\u003caside class=\"subscription-side\">\u003cnav aria-label=\"认购文件翻页\">\u003cbutton type=\"button\" data-paper=\"previous\" ${page === 0 ? 'disabled' : ''} aria-label=\"上一页\">‹\u003c/button>\u003cspan>${page + 1} / 3\u003c/span>\u003cbutton type=\"button\" data-paper=\"next\" ${page === 2 ? 'disabled' : ''} aria-label=\"下一页\">›\u003c/button>\u003c/nav>${page === 2 ? `\u003cbutton type=\"button\" class=\"paper-confirm\" data-paper=\"confirm\" ${!acknowledged || busy ? 'disabled' : ''}>确认\u003c/button>` : ''}\u003c/aside>\u003c/div>`;\n    const input = dialog.querySelector('#subscription-amount');\n    if (input && matchMedia('(orientation: landscape) and (max-height: 640px) and (pointer: coarse)').matches) {\n      const field = input.closest('label');\n      const heading = field.previousElementSibling;\n      const note = field.nextElementSibling;\n      const dock = document.createElement('div');\n      dock.className = 'mobile-amount-dock';\n      if (heading?.matches('h3')) dock.append(heading);\n      dock.append(field);\n      if (note?.matches('.paper-small')) dock.append(note);\n      const footer = dialog.querySelector('.subscription-paper footer');\n      footer.before(dock);\n    }\n  }\n  function parseAmount(value) {\n    const text = String(value).trim(); if (!/^\\d+(?:\\.\\d{1,2})?$/.test(text)) return NaN;\n    const [whole, fraction = ''] = text.split('.'); const cents = Number(whole) * 100 + Number(fraction.padEnd(2, '0'));\n    return Number.isSafeInteger(cents) ? cents : NaN;\n  }\n  dialog.addEventListener('input', event => { if (event.target.id === 'subscription-amount') { amount = event.target.value; acknowledged = false; } });\n  dialog.addEventListener('change', event => { if (event.target.id === 'subscription-ack') { acknowledged = event.target.checked; dialog.querySelector('[data-paper=\"confirm\"]').disabled = !acknowledged || busy; } });\n  dialog.addEventListener('click', event => {\n    const action = event.target.closest('[data-paper]')?.dataset.paper; if (!action || busy) return;\n    if (action === 'close' || action === 'back') { returnToCover(); return; }\n    if (action === 'next' && page === 0) {\n      const cents = parseAmount(amount || '0');\n      if (!Number.isSafeInteger(cents) || cents > getState().finance.cash) { notify('请填写可用现金范围内的金额，最多两位小数。'); return; }\n      if (!amount.trim()) amount = '0';\n    }\n    if (action === 'next' || action === 'previous') { const direction=action==='next'?1:-1;page = Math.max(0, Math.min(2, page + direction)); sound(); pageMotion.turn(render,direction); return; }\n    if (action === 'confirm' && acknowledged) {\n      const latest=getState();\n      if(latest.seed!==openedAt.seed || latest.month!==openedAt.month || (mode==='monthly' ? latest.window!=='invest' : latest.invitation.status!=='pending'||latest.invitation.month!==latest.month)) { dialog.close(); notify('这份认购文件已过期，请重新打开。'); return; }\n      const cents = parseAmount(amount || '0');\n      if (!Number.isSafeInteger(cents) || cents > getState().finance.cash) { notify('可用现金已变化，请重新核对认购金额。'); page = 0; render(); return; }\n      busy = true; render();\n      const result = confirm({ mode, amount: cents, context:openedAt }); busy = false;\n      if (!result?.error) { pageMotion.cancel();drafts.delete(draftKey(mode, openedAt)); onBack = undefined; dialog.close(); } else render();\n    }\n  });\n  dialog.addEventListener('cancel', event => { if (busy) { event.preventDefault(); return; } if (onBack) { event.preventDefault(); returnToCover(); } });\n  return {\n    open(value = 'monthly', options = {}) { remember(); mode = value; const state=getState();openedAt={seed:state.seed,month:state.month}; const draft=options.preserveDraft ? drafts.get(draftKey(mode, openedAt)) : undefined; page = draft?.page ?? 0; amount = draft?.amount ?? ''; acknowledged = draft?.acknowledged ?? false; busy = false; onBack=typeof options.onBack==='function' ? options.onBack : undefined; render(); if (!dialog.open) dialog.showModal(); sound(); },\n    close() { pageMotion.cancel();remember(); onBack = undefined; dialog.close(); },\n    get isOpen() { return dialog.open; },\n  };\n}\n","src/paper-page-motion.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n// Visual-only page turn. Rendering stays synchronous; no transaction or field\n// value is held until an animation finishes.\nexport function createPaperPageMotion(dialog) {\n  let active;\n  function cancel() {\n    const previous = active;\n    active = undefined;\n    previous?.cleanup();\n  }\n  function turn(render, direction = 1) {\n    cancel();\n    const previous = dialog.querySelector?.('.subscription-paper');\n    const view = dialog.ownerDocument?.defaultView;\n    const reduced = view?.matchMedia?.('(prefers-reduced-motion: reduce)').matches;\n    const clone = !reduced && typeof previous?.cloneNode === 'function' && typeof previous?.animate === 'function'\n      ? previous.cloneNode(true) : null;\n    render();\n    const paper = dialog.querySelector?.('.subscription-paper');\n    const layout = dialog.querySelector?.('.subscription-layout');\n    if (!clone || !paper?.animate || !layout?.append || !paper.getBoundingClientRect || !layout.getBoundingClientRect) return;\n    const sheetRect = paper.getBoundingClientRect(), layoutRect = layout.getBoundingClientRect();\n    if (!sheetRect.width || !sheetRect.height) return;\n    clone.removeAttribute('id');\n    clone.querySelectorAll?.('[id]').forEach(element => element.removeAttribute('id'));\n    clone.querySelectorAll?.('input,textarea,select,button').forEach(element => { element.disabled = true; element.removeAttribute('name'); });\n    clone.setAttribute('aria-hidden', 'true');\n    clone.inert = true;\n    clone.classList?.add('paper-turn-overlay');\n    Object.assign(clone.style, {\n      position: 'absolute', left: `${sheetRect.left - layoutRect.left}px`, top: `${sheetRect.top - layoutRect.top}px`,\n      width: `${sheetRect.width}px`, height: `${sheetRect.height}px`, margin: '0', zIndex: '2',\n      pointerEvents: 'none', transition: 'none', backfaceVisibility: 'hidden', willChange: 'transform,opacity',\n    });\n    layout.append(clone);\n    const forward = direction >= 0, origin = forward ? '0% 50%' : '100% 50%';\n    const angle = forward ? -1 : 1, duration = 420;\n    const animations = [];\n    let ended = false;\n    const record = {\n      cleanup() {\n        if (ended) return;\n        ended = true;\n        for (const animation of animations) {\n          animation.finished?.catch?.(() => {});\n          animation.cancel();\n        }\n        clone.remove();\n        if (active === record) active = undefined;\n      },\n    };\n    active = record;\n    try {\n      animations.push(paper.animate([\n        { transformOrigin: origin, transform: `rotateY(${-angle * 8}deg)`, opacity: .88 },\n        { transformOrigin: origin, transform: 'rotateY(0deg)', opacity: 1 },\n      ], { duration, easing: 'cubic-bezier(.2,.65,.2,1)', fill: 'both' }));\n      animations.push(clone.animate([\n        { offset: 0, transformOrigin: origin, transform: 'rotateY(0deg)', opacity: 1, boxShadow: '4px 7px 16px #0005' },\n        { offset: .6, transformOrigin: origin, transform: `rotateY(${angle * 48}deg)`, opacity: .93, boxShadow: '18px 10px 24px #0006' },\n        { offset: 1, transformOrigin: origin, transform: `rotateY(${angle * 86}deg)`, opacity: 0, boxShadow: '3px 8px 12px #0002' },\n      ], { duration, easing: 'cubic-bezier(.3,.1,.2,1)', fill: 'both' }));\n      Promise.allSettled(animations.map(animation => animation.finished)).then(record.cleanup);\n    } catch {\n      // An unsupported animation must never prevent reading or leaving a page.\n      record.cleanup();\n    }\n  }\n  return { turn, cancel };\n}\n","src/monthly-contracts.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { createPaperPageMotion } from 'https://roc-offline.invalid/src/paper-page-motion.js';\n\n/** Month-start paperwork. Browsing drafts never changes money or business eligibility. */\nexport function createMonthlyContracts({ getState, subscription, getOptions, confirmExit, sound = () => {}, notify = () => {} }) {\n  const dialog = document.createElement('dialog');\n  dialog.className = 'monthly-contracts-dialog';\n  dialog.setAttribute('aria-label', '月初业务文件');\n  document.body.append(dialog);\n  const pageMotion=createPaperPageMotion(dialog);\n  let context, page = 'covers', amount = '', reason = '', acknowledged = false, busy = false;\n  let exitPrincipal = 0, exitQuote = 0, outcome, subscriptionActive = false, purchaseVisited = false, exitPage = 'application';\n  const esc = value => String(value).replace(/[&\u003c>\"']/g, char => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[char]));\n  const money = cents => (cents / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  function parseAmount(value) {\n    const text = String(value).trim();\n    if (!/^\\d+(?:\\.\\d{1,2})?$/.test(text)) return NaN;\n    const [whole, fraction = ''] = text.split('.');\n    const cents = Number(whole) * 100 + Number(fraction.padEnd(2, '0'));\n    return Number.isSafeInteger(cents) ? cents : NaN;\n  }\n  const options = () => getOptions(getState());\n  const sameContext = () => { const state = getState(); return context && state.seed === context.seed && state.month === context.month && state.window === 'invest'; };\n  function close() { pageMotion.cancel();dialog.close(); if (subscriptionActive) subscription.close(); subscriptionActive = false; }\n  function stale() { close(); notify('这份业务文件已过期，请重新打开。'); }\n  function show() { render(); if (!dialog.open) dialog.showModal(); }\n  function cover(kind, title, subtitle, number) {\n    const month=String(context.month+4).padStart(2,'0');\n    const heading=kind==='exit'?'退出申请及清算文件':'投资产品认购文件';\n    return `\u003cbutton type=\"button\" class=\"monthly-contract-cover\" data-monthly=\"${kind}\" aria-label=\"${title}\">\u003cspan class=\"monthly-cover-masthead\">\u003cspan>金鼎财富\u003c/span>\u003cspan>客户业务文件\u003c/span>\u003c/span>\u003cspan class=\"monthly-cover-number\">文件编号：JD-WY-2026-${month}${number}\u003c/span>\u003cspan class=\"monthly-cover-main\">\u003cspan class=\"monthly-cover-brand\">稳盈计划\u003c/span>\u003cstrong>${heading}\u003c/strong>\u003cspan class=\"monthly-cover-rule\">\u003c/span>\u003cspan class=\"monthly-cover-subtitle\">${subtitle}\u003c/span>\u003c/span>\u003cspan class=\"monthly-cover-filing\">\u003cspan>客户姓名：\u003cspan class=\"monthly-cover-blank\">本人\u003c/span>\u003c/span>\u003cspan>业务月份：2026年${context.month+4}月\u003c/span>\u003c/span>\u003cspan class=\"monthly-cover-footer\">\u003cspan>金鼎财富客户服务组\u003c/span>\u003cspan>二〇二六年${['四','五','六','七'][context.month]}月\u003c/span>\u003c/span>\u003cspan class=\"monthly-cover-edition\">业务留存文件　｜　游戏虚构材料\u003c/span>\u003c/button>`;\n  }\n  function render() {\n    pageMotion.cancel();\n    const state = getState(), month = context.month + 4;\n    if (page === 'covers') {\n      const available = options();\n      dialog.innerHTML = `\u003cbutton type=\"button\" class=\"paper-scene-back\" data-monthly=\"close\" aria-label=\"返回\">\u003csvg viewBox=\"0 0 40 32\" aria-hidden=\"true\">\u003cpath d=\"M17 5 6 16l11 11M7 16h27\"/>\u003c/svg>\u003c/button>\u003csection class=\"monthly-cover-layout\" aria-label=\"业务文件封面\">${cover('subscribe', '产品认购文件', '认购单 · 业务确认书 · 风险揭示书', '01')}${available.canExit ? cover('exit', '退出业务文件', '退出申请 · 清算确认单', '02') : ''}\u003c/section>`;\n      return;\n    }\n    const cents = parseAmount(amount), requested = Number.isSafeInteger(cents) ? cents : 0;\n    const estimated = Math.round(requested * exitQuote / 100);\n    let title, body;\n    if (page === 'application') {\n      title = '项目退出申请书';\n      body = `\u003cp>申请人：\u003cspan class=\"paper-blank\">本人\u003c/span>\u003c/p>\u003cp>受理方：金鼎财富（虚构）\u003c/p>\u003ch3>一、申请登记\u003c/h3>\u003cdl>\u003cdt>项目名称\u003c/dt>\u003cdd>稳盈计划\u003c/dd>\u003cdt>申请日期\u003c/dt>\u003cdd>2026年${month}月${state.finance.day}日\u003c/dd>\u003cdt>未结清本金\u003c/dt>\u003cdd>人民币 ¥ ${money(exitPrincipal)}\u003c/dd>\u003c/dl>\u003ch3>二、本次申请金额\u003c/h3>\u003clabel class=\"paper-amount\">人民币 ¥ \u003cinput id=\"monthly-exit-amount\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" maxlength=\"16\" aria-label=\"申请退出金额（元）\" placeholder=\"0.00\" value=\"${esc(amount)}\"> 元\u003c/label>\u003ch3>三、退出理由\u003c/h3>\u003ctextarea id=\"monthly-exit-reason\" maxlength=\"2000\" aria-label=\"退出理由\">${esc(reason)}\u003c/textarea>\u003cp class=\"paper-small\">本申请可涉及本人全部未结清本金中的部分或全部。最终受理情况及实收款项以清算确认单为准。\u003c/p>\u003cp class=\"paper-signature\">申请人：本人\u003cspan>受理登记：金鼎财富\u003c/span>\u003c/p>`;\n    } else if (page === 'preview') {\n      title = '项目清算确认单';\n      body = `\u003cp class=\"monthly-paper-status\">受理状态：待本人确认 · 待审批\u003c/p>\u003ch3>一、本次申请\u003c/h3>\u003cdl>\u003cdt>申请退出本金\u003c/dt>\u003cdd>¥ ${money(requested)}\u003c/dd>\u003cdt>本次清算比例\u003c/dt>\u003cdd>${exitQuote}%\u003c/dd>\u003cdt>按比例折减\u003c/dt>\u003cdd>¥ ${money(requested - estimated)}\u003c/dd>\u003cdt>拟结算金额\u003c/dt>\u003cdd>¥ ${money(estimated)}\u003c/dd>\u003c/dl>\u003ch3>二、申请理由\u003c/h3>\u003cp class=\"monthly-reason-copy\">${esc(reason)}\u003c/p>\u003ch3>三、清算事项\u003c/h3>\u003cp>上述金额为本次申请的清算条件，尚未实际到账。申请获准后，按本单比例结算；未获批准时，本次不付款，申请本金仍在项目内登记。\u003c/p>\u003cp>本单确认后登记本次申请，本月月初业务办理随即结束。\u003c/p>\u003clabel class=\"paper-ack\">\u003cinput id=\"monthly-exit-ack\" type=\"checkbox\" ${acknowledged ? 'checked' : ''}>本人已阅读并确认本次申请及清算条件。\u003c/label>\u003cp class=\"paper-signature\">申请人：本人\u003cspan>登记日期：${month}月${state.finance.day}日\u003c/span>\u003c/p>`;\n    } else {\n      title = '项目清算确认单';\n      body = `\u003cp class=\"monthly-paper-status\">受理结果：${outcome.success ? '已批准 · 清算完成' : '未获批准'}\u003c/p>\u003ch3>一、申请登记\u003c/h3>\u003cdl>\u003cdt>申请退出本金\u003c/dt>\u003cdd>¥ ${money(outcome.amount)}\u003c/dd>\u003cdt>本次清算比例\u003c/dt>\u003cdd>${outcome.quote}%\u003c/dd>\u003cdt>实际到账\u003c/dt>\u003cdd>\u003cstrong>¥ ${money(outcome.received)}\u003c/strong>\u003c/dd>\u003cdt>本次折减\u003c/dt>\u003cdd>¥ ${money(outcome.loss)}\u003c/dd>\u003c/dl>\u003ch3>二、清算记录\u003c/h3>\u003cp>${outcome.success ? '本次申请已按上述清算条件办理，实际到账款项已记入本人资金流水，相关本金同步结清。' : '本次申请未获批准，未产生实际付款，申请本金未予结清。本单所列清算比例未实际执行。'}\u003c/p>\u003ch3>三、申请理由存档\u003c/h3>\u003cp class=\"monthly-reason-copy\">${esc(outcome.reason || reason)}\u003c/p>\u003cp class=\"paper-signature\">申请人：本人\u003cspan>业务受理：金鼎财富\u003c/span>\u003c/p>`;\n    }\n    const isResult = page === 'result', pageNumber = page === 'application' ? 1 : 2;\n    dialog.innerHTML = `\u003cbutton type=\"button\" class=\"paper-scene-back\" data-monthly=\"${isResult ? 'close' : 'back'}\" aria-label=\"返回\">\u003csvg viewBox=\"0 0 40 32\" aria-hidden=\"true\">\u003cpath d=\"M17 5 6 16l11 11M7 16h27\"/>\u003c/svg>\u003c/button>\u003cdiv class=\"subscription-layout monthly-exit-layout\">\u003carticle class=\"subscription-paper monthly-exit-paper\" aria-label=\"${title}\">\u003cheader>\u003cp class=\"paper-agreement-no\">业务编号：TC-2026-${String(month).padStart(2, '0')}01\u003c/p>\u003ch1>稳盈计划\u003c/h1>\u003ch2>${title}\u003c/h2>\u003c/header>\u003csection class=\"subscription-body\">${body}\u003c/section>\u003cfooter>第 ${pageNumber} 页 / 共 2 页 · 游戏虚构道具\u003c/footer>\u003c/article>\u003caside class=\"subscription-side\">${!isResult ? `\u003cnav aria-label=\"退出文件翻页\">\u003cbutton type=\"button\" data-monthly=\"previous\" ${page === 'application' ? 'disabled' : ''} aria-label=\"上一页\">‹\u003c/button>\u003cspan>${pageNumber} / 2\u003c/span>\u003cbutton type=\"button\" data-monthly=\"next\" ${page === 'preview' ? 'disabled' : ''} aria-label=\"下一页\">›\u003c/button>\u003c/nav>` : ''}${page === 'preview' ? `\u003cbutton type=\"button\" class=\"paper-confirm\" data-monthly=\"confirm\" ${!acknowledged || busy ? 'disabled' : ''}>确认申请\u003c/button>` : ''}\u003c/aside>\u003c/div>`;\n  }\n  function validateApplication() {\n    const available = options(), cents = parseAmount(amount);\n    if (!available.canExit) { stale(); return false; }\n    if (!Number.isSafeInteger(cents) || cents \u003c= 0 || cents > available.principal) { notify('请填写未结清本金范围内的退出金额，最多两位小数。'); return false; }\n    if (!reason.trim() || reason.length > 2000) { notify('请填写本次退出理由（不超过2000字）。'); return false; }\n    return true;\n  }\n  dialog.addEventListener('input', event => {\n    if (event.target.id === 'monthly-exit-amount') { amount = event.target.value; acknowledged = false; }\n    if (event.target.id === 'monthly-exit-reason') { reason = event.target.value; acknowledged = false; }\n  });\n  dialog.addEventListener('change', event => {\n    if (event.target.id !== 'monthly-exit-ack') return;\n    acknowledged = event.target.checked;\n    const button = dialog.querySelector('[data-monthly=\"confirm\"]');\n    if (button) button.disabled = !acknowledged || busy;\n  });\n  dialog.addEventListener('click', event => {\n    const action = event.target.closest('[data-monthly]')?.dataset.monthly;\n    if (!action || busy) return;\n    if (action === 'close') { close(); return; }\n    if (!sameContext()) { stale(); return; }\n    if (action === 'back') { exitPage = page; page = 'covers'; sound(); render(); return; }\n    if (action === 'subscribe') {\n      if (!options().canSubscribe) { stale(); return; }\n      dialog.close(); subscriptionActive = true;\n      subscription.open('monthly', { preserveDraft: purchaseVisited, onBack() { subscriptionActive = false; if (!sameContext()) { stale(); return; } page = 'covers'; show(); } });\n      purchaseVisited = true; return;\n    }\n    if (action === 'exit') {\n      const available = options(); if (!available.canExit) { stale(); return; }\n      if (exitPrincipal !== available.principal || exitQuote !== available.exitQuote) { acknowledged = false; exitPage = 'application'; }\n      exitPrincipal = available.principal; exitQuote = available.exitQuote;\n      page = exitPage; sound(); render(); return;\n    }\n    if (action === 'next') {\n      if (!validateApplication()) return;\n      const available = options(); exitPrincipal = available.principal; exitQuote = available.exitQuote;\n      page = exitPage = 'preview'; sound(); pageMotion.turn(render,1); return;\n    }\n    if (action === 'previous') { page = exitPage = 'application'; sound(); pageMotion.turn(render,-1); return; }\n    if (action === 'confirm' && page === 'preview' && acknowledged) {\n      if (!validateApplication()) return;\n      const available = options();\n      if (available.principal !== exitPrincipal || available.exitQuote !== exitQuote) {\n        exitPrincipal = available.principal; exitQuote = available.exitQuote; acknowledged = false; page = 'application';\n        notify('本金记录已变化，请重新核对申请及清算条件。'); render(); return;\n      }\n      busy = true; render();\n      let result;\n      try { result = confirmExit({ amount: parseAmount(amount), reason: reason.trim(), context: { ...context } }); }\n      finally { busy = false; }\n      if (result?.error) { render(); return; }\n      const request = result?.state?.finance?.requests?.at(-1);\n      if (!request || request.month !== context.month || request.amount !== parseAmount(amount)) { close(); notify('请在资金流水中核对本次申请受理记录。'); return; }\n      outcome = { ...request }; page = 'result'; pageMotion.turn(show,1); sound();\n    }\n  });\n  dialog.addEventListener('cancel', event => { if (busy) event.preventDefault();else pageMotion.cancel(); });\n  return {\n    open({ preserveDraft = false } = {}) {\n      const state = getState(), keep = preserveDraft && context?.seed === state.seed && context?.month === state.month;\n      close(); context = { seed: state.seed, month: state.month };\n      if (!keep) { amount = ''; reason = ''; acknowledged = false; outcome = undefined; purchaseVisited = false; exitPage = 'application'; }\n      busy = false; page = 'covers';\n      if (!sameContext() || !options().canSubscribe) { stale(); return; }\n      show(); sound();\n    },\n    close,\n    get isOpen() { return dialog.open || subscriptionActive && subscription.isOpen; },\n  };\n}\n","src/funds-statement.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { publicFinance } from 'https://roc-offline.invalid/src/body/finance.js';\n\nconst money=value=>(value/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst date=(month,day)=>`${month+4}月${day}日`;\n\n/** A read-only, current statement; opening it never creates evidence or a transaction. */\nexport function fundsStatement(finance){\n  const f=publicFinance(finance);\n  let balance=f.initial;\n  const rows=[['4月1日','期初余额','—','—',money(balance),'—']];\n  for(const entry of f.ledger){\n    balance+=entry.cashDelta;\n    const details=[];\n    if(entry.requested)details.push(`申请本金 ${money(entry.requested)} 元`);\n    if(entry.quote&&entry.requested)details.push(`清算比例 ${entry.quote}%`);\n    if(entry.lossDelta)details.push(`折价损失 ${money(entry.lossDelta)} 元`);\n    if(entry.unpaidDelta>0)details.push(`未付 ${money(entry.unpaidDelta)} 元`);\n    rows.push([date(entry.month,entry.day),entry.label,\n      entry.cashDelta>0?money(entry.cashDelta):'—',\n      entry.cashDelta\u003c0?money(-entry.cashDelta):'—',money(balance),details.join('；')||'—']);\n  }\n  return {id:'FUNDS',title:'资金流水',issuer:'个人资金登记',number:'JD-07-ZJ',date:date(f.month,f.day),blocks:[\n    {kind:'table',title:'账户摘要（人民币：元）',headers:['项目','金额','项目','金额'],rows:[\n      ['可用现金',money(f.cash),'未结清本金',money(f.principal)],\n      ['收益实际到账',money(f.totalInterest),'清盘奖励',money(f.earnedTile)],\n      ['退出实际收回',money(f.totalReturned),'累计折价损失',money(f.totalLoss)],\n      ['累计认购',money(f.totalInvested),'应付未付收益',money(f.unpaidInterest)],\n    ]},\n    {kind:'table',title:'现金收支明细（人民币：元）',headers:['日期','业务摘要','收入','支出','现金余额','附记'],rows,numericColumns:[2,3,4]},\n    {kind:'text',title:'登记说明',body:'现金余额仅计入实际收付。未结清本金、应付未付收益与折价损失分别登记，不计入可用现金。本表为本人业务记录，非平台银行账户流水。'},\n  ]};\n}\n","src/chapter-session.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { createCase, reduceCase } from 'https://roc-offline.invalid/src/body/case.js';\nimport { serializeBody, restoreBody, CARD_STORAGE_KEY } from 'https://roc-offline.invalid/src/body/save.js';\nimport { broadcastSceneState, isSceneActive } from 'https://roc-offline.invalid/src/scene-navigation.js';\nimport { prepareFormalChapter } from 'https://roc-offline.invalid/src/formal-chapter-bridge.js';\nimport { syncChapterMusic } from 'https://roc-offline.invalid/src/music/install.js';\n\n// The card-based chapter has its own save. Earlier body and design-preview\n// saves are kept intact and never silently converted into answered card tasks.\nexport const CHAPTER_STORAGE_KEY=CARD_STORAGE_KEY;\nlet state,revision=0,lastRaw='',issue='';\nconst listeners=new Set();\nconst newSeed=()=>crypto.getRandomValues(new Uint32Array(2)).join('-');\n// Sound is a side effect: an unavailable audio API must never block a save or a transaction.\nfunction notifyMusic(events=[]){try{syncChapterMusic(state,events);}catch{}}\nfunction emit(events=[]){notifyMusic(events);for(const listener of listeners)listener({state,events,error:null});}\nfunction persist(){\n  try{\n    const raw=serializeBody({state,revision:revision+1});\n    localStorage.setItem(CHAPTER_STORAGE_KEY,raw);lastRaw=raw;revision++;\n    return true;\n  }catch{issue='本次记录未能保存，请导出调查记录后再继续。';return false;}\n}\nfunction deliverSavedEvidence(){\n  if(!(state.investigation?.earned > state.investigation?.spent))return;\n  const result=reduceCase(state,{type:'deliverEvidence'});\n  if(!result.error&&result.state!==state){state=result.state;persist();}\n}\nfunction initialize(){\n  try{\n    const raw=localStorage.getItem(CHAPTER_STORAGE_KEY);\n    if(raw){\n      const saved=restoreBody(raw);\n      if(saved?.state.flow==='cards'){state=saved.state;revision=saved.revision;lastRaw=raw;deliverSavedEvidence();return;}\n      issue='当前记录无法读取，原始存档已保留。';lastRaw=raw;\n    }\n  }catch{issue='浏览器未能读取游戏存档。';}\n  state=createCase(newSeed(),{flow:'cards',progression:'connections'});\n  if(!issue)persist();\n}\ninitialize();\nif(isSceneActive())notifyMusic();\nexport function getState(){return state;}\nexport function getSaveIssue(){return issue;}\nexport function refresh(){\n  try{\n    const raw=localStorage.getItem(CHAPTER_STORAGE_KEY);\n    if(!raw||raw===lastRaw)return state;\n    const saved=restoreBody(raw);\n    if(saved?.state.flow!=='cards'){issue='另一窗口的记录无法读取，当前进度仍保留。';return state;}\n    state=saved.state;revision=saved.revision;lastRaw=raw;issue='';deliverSavedEvidence();emit();\n  }catch{issue='浏览器未能同步游戏存档。';}\n  return state;\n}\nexport function dispatch(action){\n  refresh();\n  if(issue)return {state,error:issue,events:[]};\n  const result=reduceCase(state,action,{autoDeliverEvidence:true});\n  if(result.error)return result;\n  if(result.state!==state){\n    state=result.state;persist();emit(result.events);\n    broadcastSceneState({kind:'chapter-update',revision});\n  }\n  return {...result,error:issue||null};\n}\nexport function subscribe(listener){listeners.add(listener);return ()=>listeners.delete(listener);}\nexport function beginChapter(payload){\n  refresh();\n  if(issue && !payload?.startFresh)return {state,error:issue,events:[]};\n  const result=prepareFormalChapter(state,payload);\n  if(result.error)return result;\n  if(result.fresh){\n    try{const raw=localStorage.getItem(CHAPTER_STORAGE_KEY);if(raw)localStorage.setItem(CHAPTER_STORAGE_KEY+':previous',raw);}catch{}\n    revision=0;\n  }\n  state=result.state;issue='';\n  persist();emit(result.events);broadcastSceneState({kind:'chapter-start',revision});\n  return {...result,error:issue||null};\n}\nexport function newChapter(){\n  try{const raw=localStorage.getItem(CHAPTER_STORAGE_KEY);if(raw)localStorage.setItem(CHAPTER_STORAGE_KEY+':previous',raw);}catch{}\n  state=createCase(newSeed(),{flow:'cards',progression:'connections'});revision=0;issue='';\n  persist();emit();broadcastSceneState({kind:'chapter-reset',revision});return state;\n}\n// Hidden persistent scenes refresh when prepare()/activate() runs. Actions still\n// refresh synchronously before reduction, so a click never uses an old save.\nwindow.addEventListener('storage',event=>{if(event.key===CHAPTER_STORAGE_KEY&&isSceneActive())refresh();});\nwindow.addEventListener('scene:state-change',()=>{if(isSceneActive())refresh();});\nwindow.addEventListener('scene:activate',()=>notifyMusic());\n","src/formal-chapter-bridge.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { createCase, reduceCase } from 'https://roc-offline.invalid/src/body/case.js';\nimport { normalizeChapterStart } from 'https://roc-offline.invalid/src/chapter-main-bridge.js';\n\n/** Carry witnessed documents/dialogue only; never invent an investment or cash. */\nexport function prepareFormalChapter(current,message) {\n  const payload=normalizeChapterStart(message);\n  if(!payload)return {state:current,error:'案件接续信息不正确。'};\n  const fresh=payload.startFresh && current.seed!==payload.runId;\n  if(!fresh && current.seed!==payload.runId)return {state:current,error:'当前调查存档与案件不一致，未改动资金。'};\n  let state=fresh?createCase(payload.runId,{flow:'cards',progression:'connections'}):current;\n  const actions=[...(payload.readDocs.includes('D03')?[{type:'readInvitation'}]:[]),...payload.readDocs.map(id=>({type:'read',id}))];\n  if(payload.readDocs.includes('D03'))actions.push({type:'completeTopic',topicKey:'T01'});\n  if(payload.visitedBranches.includes('zhou'))actions.push({type:'completeTopic',topicKey:'T02'},{type:'completeTopic',topicKey:'T03'});\n  if(payload.visitedBranches.includes('lu'))actions.push({type:'completeTopic',topicKey:'T04'});\n  const events=[];\n  for(const action of actions) {\n    const result=reduceCase(state,action);\n    if(result.error)return {state:current,error:result.error};\n    state=result.state;events.push(...result.events);\n  }\n  return {state,fresh,events,error:null};\n}\n","src/chapter-main-bridge.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { STORY } from 'https://roc-offline.invalid/src/reception/story.js';\n\nconst DOCS = new Set(['D01','D02','D03']);\nconst BRANCHES = new Set(['materials','lu','zhou']);\nconst uniqueList = (value, legal) => Array.isArray(value) && value.length \u003c= 16\n  && new Set(value).size === value.length && value.every(id => typeof id === 'string' && legal.has(id));\n\nexport function normalizeChapterStart(value) {\n  if (!value || value.type !== 'chapter:start-main' || typeof value.runId !== 'string'\n    || !value.runId.length || value.runId.length > 160 || typeof value.startFresh !== 'boolean'\n    || !uniqueList(value.readDocs,DOCS) || !uniqueList(value.visitedBranches,BRANCHES)) return null;\n  return {runId:value.runId,startFresh:value.startFresh,readDocs:[...value.readDocs],visitedBranches:[...value.visitedBranches]};\n}\n\n/** Carry knowledge only. Reception never manufactures a financial transaction. */\nexport function mergeReceptionMeta(current, payload) {\n  const meta=JSON.parse(JSON.stringify(current));\n  for (const id of payload.readDocs) {\n    if(!meta.available.includes(id))meta.available.push(id);\n    if(!meta.read.includes(id))meta.read.push(id);\n  }\n  for(const branch of payload.visitedBranches){\n    const id=`reception:${branch}`;\n    if(meta.branches.some(item=>item.id===id))continue;\n    const character=branch==='zhou'?'zhou':'lu';\n    const lines=STORY[branch];\n    meta.branches.push({id,character,prompt:lines.find(line=>line.speaker==='player')?.text||'查看认购资料',\n      reply:lines.filter(line=>line.speaker===character).map(line=>line.text),grantDocs:[],actions:[],\n      trail:branch==='materials'?'会客室：看过认购资料。':branch==='zhou'?'会客室：周岚说明本金尚未取回。':'会客室：陆衡说明收益与退出安排。'});\n    meta.sent.push(id);meta.seen.push(id);\n    for(const line of lines)meta.chat[character].push({self:line.speaker==='player',text:line.text});\n  }\n  meta.chapterRunId=payload.runId;\n  return meta;\n}\n\nexport function createMainChapterBridge({origin,getParent,begin,post}) {\n  let activeRun=null;\n  return {\n    message(event){\n      if(event.origin!==origin||event.source!==getParent())return false;\n      const payload=normalizeChapterStart(event.data);if(!payload)return false;\n      if(activeRun!==null){\n        if(activeRun!==payload.runId)return false;\n        post({type:'chapter:main-started',runId:activeRun},origin);return true;\n      }\n      if(begin(payload)===false)return false;\n      activeRun=payload.runId;post({type:'chapter:main-started',runId:activeRun},origin);return true;\n    },\n  };\n}\n","src/investigation/workbench.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { CARDS, CARD_MAP, TASKS, TASK_IDS, QUESTIONS, QUESTION_MAP, getCardDocument } from 'https://roc-offline.invalid/src/investigation/data.js';\nimport { getCardPosition, organizeCards } from 'https://roc-offline.invalid/src/investigation/layout.js';\nimport { getState, dispatch, subscribe, refresh } from 'https://roc-offline.invalid/src/chapter-session.js';\nimport { createCardReader, questionAvailable, questionUnavailable, cardCompletion } from 'https://roc-offline.invalid/src/body/card-flow.js';\nimport { getDoc } from 'https://roc-offline.invalid/src/body/content.js';\nimport { renderDocument } from 'https://roc-offline.invalid/src/materials.js';\nimport { OPEN_RESPONSE_FIELDS, OPEN_RESPONSE_LIMIT } from 'https://roc-offline.invalid/src/open-response.js';\nimport { isSceneActive, markSceneReady, registerSceneLifecycle } from 'https://roc-offline.invalid/src/scene-navigation.js';\nimport { preloadIntegratedEnding, playIntegratedEnding, isIntegratedEndingActive } from 'https://roc-offline.invalid/src/ending-demo/integrated-ending.js';\nimport { musicCue } from 'https://roc-offline.invalid/src/music/install.js';\n\nconst $ = (selector) => document.querySelector(selector);\nconst $$ = (selector) => [...document.querySelectorAll(selector)];\nconst esc = (text) => String(text ?? '').replace(/[&\u003c>\"']/g, (char) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[char]);\nconst sheet = Number(new URLSearchParams(location.search).get('sheet'));\nconst isSheet = sheet === 1 || sheet === 2;\nconst art = (key) => __roc.resource(`./assets/investigation-v1/${({ company: 'project', document: 'project' })[key] || key}-v1.png`);\nconst kindName = (card) => ({ task: '调查', organization: '机构', document: '资料', note: '谈话', conclusion: '结论', account: '账户' })[card.type] || '线索';\nconst handheldStage = document.documentElement.hasAttribute('data-roc-mobile-ui');\nconst boardTouches = new Map();\nlet boardPinch = null;\nconst compactWorkbench = matchMedia('(pointer: coarse) and (orientation: landscape) and (max-height: 660px)');\nfunction defaultCamera() {\n  if (handheldStage) return { x: -84, y: -106, scale: 1 };\n  if (!compactWorkbench.matches) return { x: 35, y: 25, scale: .8 };\n  const short = window.innerHeight \u003c= 350;\n  return short ? { x: -51, y: Math.min(-91, window.innerHeight - 411), scale: .69 } : { x: -54, y: -74, scale: .72 };\n}\nlet formal = getState();\nlet state = formal.cardFlow.notebook;\nlet reader = createCardReader(formal);\nlet uiKey;\nlet ui;\nlet linking = null, drag = null, toastTimer, suppressClick = null, invitationTemplate;\nconst paperSounds = {\n  tap: { file: 'card-tap.m4a', volume: .58, voices: [], next: 0 },\n  flip: { file: 'paper-flip.m4a', volume: .3, voices: [], next: 0 },\n};\nconst paperVoiceCount = 4;\nlet modalFocus, modalVersion = 0, libraryRenderKey = '', taskProgressHTML = '', wiresFrame = null, frontCard = null;\nlet draftFrame = null, pointer = null, highlighted = null;\nconst svgNS = 'http://www.w3.org/2000/svg';\nconst draftWire = document.createElementNS(svgNS, 'line');\ndraftWire.setAttribute('class', 'wire-draft'); draftWire.setAttribute('hidden', '');\n$('#board-wires').append(draftWire);\nconst wireLines = new Map();\nconst announcedTopics = new Set();\n\nfunction loadLayout() {\n  uiKey = `roc-mobile:jinding-card-chapter-layout-v1:${formal.seed}${handheldStage ? ':handheld' : compactWorkbench.matches ? ':compact' : ''}`;\n  ui = { mode: isSheet ? 'review' : 'board', filter: 'all', search: '', placed: [...TASK_IDS], camera: defaultCamera() };\n  try {\n    const saved = JSON.parse(localStorage.getItem(uiKey) || 'null');\n    if (Array.isArray(saved?.placed)) ui.placed = [...new Set([...TASK_IDS, ...saved.placed.filter((id) => CARD_MAP[id])])];\n    if (saved?.camera && ['x', 'y', 'scale'].every((key) => Number.isFinite(saved.camera[key]))) ui.camera = { ...saved.camera, scale: Math.max(.25, Math.min(1.6, saved.camera.scale)) };\n  } catch { /* Layout is optional; formal answers only come from chapter-session. */ }\n}\nloadLayout();\nif (isSheet) document.body.classList.add('sheet-view');\nif (compactWorkbench.matches || handheldStage) $('.task-progress-panel').open = false;\n\nfunction saveLayout() {\n  try { localStorage.setItem(uiKey, JSON.stringify({ placed: ui.placed, camera: ui.camera })); }\n  catch { toast('桌面位置暂未保存。'); }\n}\nfunction toast(text) {\n  clearTimeout(toastTimer); $('#toast').textContent = text; $('#toast').classList.add('visible');\n  toastTimer = setTimeout(() => $('#toast').classList.remove('visible'), 2600);\n}\nfunction visible(id) { return Boolean(CARD_MAP[id] && reader.visible(id)); }\nfunction allowed(qId) { return Boolean(QUESTION_MAP[qId] && questionAvailable(formal, qId)); }\nfunction answered(qId) { return reader.answered(qId); }\nfunction taskResult(taskId) {\n  const questions = TASKS.find((task) => task.id === taskId)?.questions || [];\n  return { total: questions.length, completed: questions.filter((q) => answered(q.id)).length, correct: questions.length > 0 && questions.every((q) => allowed(q.id) && reader.evaluate(q.id).correct) };\n}\nfunction act(action) {\n  const result = dispatch(action);\n  if (result.error) { toast(result.error); return false; }\n  if (result.state !== formal) updateState(result.state);\n  const newTopics = result.events.filter(event => event.type === 'topic-unlocked' && !announcedTopics.has(event.key));\n  if (newTopics.length) {\n    for (const topic of newTopics) announcedTopics.add(topic.key);\n    toast('您有一条新消息');\n  }\n  return true;\n}\nfunction notebook(operation, extra) { return act({ type: 'notebook', operation, ...extra }); }\nfunction updateState(next) {\n  if (next === formal) return;\n  const reset = next.seed !== formal.seed;\n  formal = next; state = formal.cardFlow.notebook;\n  reader = createCardReader(formal);\n  if (reset) { announcedTopics.clear(); loadLayout(); endLink(); closeModal(); renderAll(); return; }\n  if (linking && (linking.qId && !allowed(linking.qId) || linking.cardId && !visible(linking.cardId))) endLink();\n  syncBoardNodes(); updateEvaluations(); updateSummary();\n}\n\nfunction photoHTML(card) {\n  if (!visible(card.id)) return '';\n  if (card.type === 'document') return `\u003cdiv class=\"document-thumb\">\u003cspan>${esc(card.title)}\u003c/span>\u003c/div>`;\n  return card.art ? `\u003cimg src=\"${art(card.art)}\" alt=\"${esc(card.title)}卡面\" draggable=\"false\">` : '';\n}\nfunction chipsHTML(qId) {\n  return (state.links[qId] || []).filter(visible).map((id) => `\u003cspan class=\"linked-chip\">${esc(CARD_MAP[id].title)}\u003cbutton class=\"unlink-button\" data-action=\"unlink\" data-question=\"${qId}\" data-id=\"${id}\" aria-label=\"断开${esc(CARD_MAP[id].title)}\">×\u003c/button>\u003c/span>`).join('');\n}\nfunction questionHTML(q) {\n  const value = state.values[q.id];\n  const controls = q.type === 'number'\n    ? `\u003cdiv class=\"question-control\">${q.fields.map((field) => `\u003clabel class=\"number-field\">\u003cspan>${esc(field.label)}\u003c/span>\u003cinput class=\"number-input\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" maxlength=\"40\" data-question=\"${q.id}\" data-field=\"${field.id}\" aria-label=\"${esc(`${q.prompt} ${field.label}`)}\" value=\"${esc(value?.[field.id] ?? '')}\">\u003cspan>${esc(field.unit)}\u003c/span>\u003c/label>`).join('')}\u003c/div>`\n    : q.type === 'boolean' ? `\u003cdiv class=\"question-control\">\u003cdiv class=\"boolean-toggle\" role=\"group\" aria-label=\"${esc(q.prompt)}\">\u003cbutton data-action=\"boolean\" data-question=\"${q.id}\" data-yes=\"false\" aria-label=\"否\">×\u003c/button>\u003cbutton data-action=\"boolean\" data-question=\"${q.id}\" data-yes=\"true\" aria-label=\"是\">✔\u003c/button>\u003c/div>\u003c/div>` : '';\n  return `\u003cli class=\"question-row\" data-row=\"${q.id}\">\u003cspan class=\"question-text\">\u003c/span>${controls}\u003cspan class=\"question-locked\">\u003c/span>\u003cbutton class=\"question-port ${q.type === 'link' ? '' : 'yellow'}\" data-action=\"question-port\" data-question=\"${q.id}\" aria-label=\"连接调查证据\">\u003c/button>\u003cdiv class=\"linked-chips\">${chipsHTML(q.id)}\u003c/div>\u003cspan class=\"question-state pending\">\u003c/span>\u003c/li>`;\n}\nfunction cardHTML(card, { review = false } = {}) {\n  if (!visible(card.id)) return '';\n  const task = card.type === 'task', result = task ? taskResult(card.id) : null;\n  const point = getCardPosition(state, card.id), index = TASK_IDS.indexOf(card.id);\n  const pin = task ? 'red' : ['document', 'note', 'conclusion'].includes(card.type) ? 'yellow' : '';\n  const mini = ['note', 'conclusion', 'account', 'organization'].includes(card.type);\n  return `\u003carticle class=\"investigation-card ${task ? 'task-card' : 'support-card'} ${task || !mini ? 'photo-sheet' : ''} ${mini ? 'note-card' : ''} ${card.type === 'conclusion' ? 'conclusion-card' : ''} kind-${card.kind}\" data-node=\"${card.id}\" ${review ? '' : `style=\"left:${point.x}px;top:${point.y}px\"`} aria-label=\"${esc(card.title)}调查卡\">\u003cbutton class=\"card-pin node-port ${pin}\" data-action=\"source-port\" data-id=\"${card.id}\" aria-label=\"连接卡片：${esc(card.title)}\">\u003c/button>\u003cheader class=\"card-drag-handle\">${!mini ? `\u003cdiv class=\"card-photo\">\u003cbutton data-action=\"art\" data-id=\"${card.id}\" aria-label=\"查看${esc(card.title)}\">${photoHTML(card)}\u003c/button>\u003c/div>` : ''}${task ? `\u003cspan class=\"card-serial\">0${index + 1}\u003c/span>` : ''}\u003ch2 class=\"card-name\">${esc(card.title)}\u003c/h2>${task ? `\u003cspan class=\"card-subtitle\">${esc(card.subtitle)}\u003c/span>` : ''}\u003c/header>${task ? `\u003col class=\"question-list\">${card.questions.map(questionHTML).join('')}\u003c/ol>\u003cspan class=\"task-stamp\" aria-label=\"核对完成\">✓\u003c/span>` : mini && card.type !== 'conclusion' ? `\u003cp class=\"card-note\">${esc(card.type === 'note' ? '谈话摘录' : card.type === 'organization' ? '机构记录' : '账户记录')}\u003c/p>` : ''}\u003cfooter class=\"card-footer\">${task ? `\u003cspan data-task-count=\"${card.id}\">${result.completed} / ${result.total}\u003c/span>` : `\u003cspan>${esc(kindName(card))}\u003c/span>`}\u003cbutton data-action=\"read\" data-id=\"${card.id}\">${task && card.id !== 'invitation' ? '查看卡面' : '查看记录'}\u003c/button>${!review && !task ? `\u003cbutton data-action=\"remove-card\" data-id=\"${card.id}\" aria-label=\"收回${esc(card.title)}\">收回\u003c/button>` : ''}\u003c/footer>\u003c/article>`;\n}\nfunction renderReview() {\n  const cards = (sheet === 1 ? TASKS.slice(0, 4) : sheet === 2 ? TASKS.slice(4) : TASKS).filter((card) => visible(card.id));\n  $('#review-grid').innerHTML = cards.map((card) => cardHTML(CARD_MAP[card.id], { review: true })).join('') || '\u003cp class=\"locked-sheet\">尚未取得这组调查卡。\u003c/p>';\n}\nfunction renderLibrary() {\n  const query = ui.search.trim().normalize('NFKC').toLowerCase();\n  const cards = CARDS.filter((card) => visible(card.id))\n    .filter((card) => ui.filter === 'all' || card.type === ui.filter || ui.filter === 'evidence' && card.type !== 'task')\n    .filter((card) => !query || card.title.normalize('NFKC').toLowerCase().includes(query) || card.document?.toLowerCase() === query);\n  $('#library-count').textContent = String(cards.length);\n  const key=JSON.stringify([formal.seed,cards.map(card=>card.id),ui.placed,ui.filter,ui.search]);\n  if(key===libraryRenderKey)return;libraryRenderKey=key;\n  $('#library-list').innerHTML = cards.map((card) => `\u003cdiv class=\"library-card${ui.placed.includes(card.id) ? ' is-placed' : ''}\" data-library-card=\"${card.id}\">\u003cspan class=\"thumb\">${photoHTML(card)}\u003c/span>\u003cspan class=\"library-card-text\">\u003cstrong class=\"library-title\">${esc(card.title)}\u003c/strong>\u003csmall class=\"card-kind\">${esc(kindName(card))}\u003c/small>\u003c/span>\u003cbutton class=\"place-button\" data-action=\"place\" data-id=\"${card.id}\" aria-label=\"${ui.placed.includes(card.id) ? '定位' : '放置'}${esc(card.title)}\">${ui.placed.includes(card.id) ? '⌖' : '＋'}\u003c/button>\u003c/div>`).join('') || '\u003cp class=\"library-empty\">暂无匹配的卡片。\u003c/p>';\n  $$('.library-tabs button').forEach((el) => {\n    const active = el.dataset.filter === ui.filter;\n    el.classList.toggle('active', active);\n    el.setAttribute('aria-pressed', String(active));\n  });\n}\nfunction renderBoard() {\n  $('#board-nodes').innerHTML = ui.placed.filter(visible).map((id) => cardHTML(CARD_MAP[id])).join('');\n  bringCardForward(frontCard);\n  applyCamera(); scheduleWires();\n}\nfunction syncBoardNodes() {\n  if (isSheet) renderReview();\n  const container = $('#board-nodes');\n  for (const element of [...container.children]) if (!visible(element.dataset.node) || !ui.placed.includes(element.dataset.node)) element.remove();\n  for (const id of ui.placed.filter(visible)) {\n    let node = container.querySelector(`[data-node=\"${id}\"]`);\n    if (!node) { container.insertAdjacentHTML('beforeend', cardHTML(CARD_MAP[id])); node = container.lastElementChild; }\n    if (drag?.id !== id) { const point = getCardPosition(state, id); node.style.left = `${point.x}px`; node.style.top = `${point.y}px`; }\n    node.classList.toggle('is-front',id===frontCard);\n  }\n}\nfunction renderAll() {\n  $('#review-view').hidden = ui.mode !== 'review'; $('#board-view').hidden = ui.mode !== 'board';\n  if (isSheet) renderReview();\n  renderLibrary(); renderBoard(); updateEvaluations();\n}\nfunction renderTaskProgress() {\n  const html = TASKS.map((task) => {\n    const known = visible(task.id), result = taskResult(task.id), percent = result.total ? result.completed / result.total * 100 : 0;\n    return `\u003cdiv class=\"task-progress-item${known ? '' : ' is-locked'}${result.completed === result.total ? ' is-complete' : ''}\" style=\"--task-progress:${percent}%\">\u003cdiv class=\"task-progress-caption\">\u003cspan>${known ? esc(task.title) : '未解锁'}\u003c/span>\u003cspan class=\"task-progress-number\">${known ? `${result.completed} / ${result.total}` : '🔒'}\u003c/span>\u003c/div>\u003cdiv class=\"task-progress-track\" role=\"progressbar\" aria-label=\"${known ? esc(task.title) : '未解锁调查'}作答进度\" aria-valuemin=\"0\" aria-valuemax=\"${result.total}\" aria-valuenow=\"${result.completed}\">\u003cspan>\u003c/span>\u003c/div>\u003c/div>`;\n  }).join('');\n  if (taskProgressHTML !== html) {\n    taskProgressHTML = html;\n    $('#task-progress-list').innerHTML = html;\n  }\n}\nfunction updateEvaluations() {\n  $('[data-action=\"fast-answer\"]').disabled = formal.complete;\n  for (const task of TASKS.filter((item) => visible(it f(!/^\\s+$/u.test(char))chars.push(char);\n      if(chars.length>=count)break;\n    }\n    return chars;\n  }).filter(list=>list.length);\n  if(!lists.length) return [];\n  return Array.from({length:count},(_,i)=>{\n    const list=lists[i%lists.length];\n    return list[Math.floor(i/lists.length)%list.length];\n  });\n}\n\nexport function bezier(a,b,c,d,u) {\n  const v=1-u;\n  return [v*v*v*a[0]+3*v*v*u*b[0]+3*v*u*u*c[0]+u*u*u*d[0],v*v*v*a[1]+3*v*v*u*b[1]+3*v*u*u*c[1]+u*u*u*d[1]];\n}\n\nexport function freePosition(p,time) {\n  const u=clamp((time-p.birth)/(p.gather-p.birth));\n  let [x,y]=bezier(p.source,p.c1,p.c2,p.anchor,u);\n  const elapsed=Math.max(0,time-p.birth),amount=ease(elapsed/1.2);\n  x+=p.sway_x*amount*(Math.sin(elapsed*p.frequency_x+p.phase_x)-Math.sin(p.phase_x));\n  y+=p.sway_y*amount*(Math.sin(elapsed*p.frequency_y+p.phase_y)-Math.sin(p.phase_y));\n  return [x,y];\n}\n\nexport function particleState(p,time) {\n  if(time\u003cp.birth) return null;\n  const enter=ease((time-p.birth)/.75);\n  let x,y,u=0;\n  if(time\u003cp.gather) [x,y]=freePosition(p,time);\n  else {\n    const progress=clamp((time-p.gather)/(p.landing-p.gather));\n    u=progress+progress*progress-progress*progress*progress;\n    const start=freePosition(p,p.gather),before=freePosition(p,p.gather-.02),duration=p.landing-p.gather;\n    const c1=[start[0]+(start[0]-before[0])/.02*duration/3,start[1]+(start[1]-before[1])/.02*duration/3];\n    [x,y]=bezier(start,c1,[p.target[0]+p.approach[0],p.target[1]+p.approach[1]],p.target,u);\n  }\n  const size=Math.round(lerp(p.size,7,u));\n  const tilt=(p.tilt+p.turn*Math.sin((time-p.birth)*.8+p.phase_x))*(1-u);\n  const fade=1-ease((time-9.35)/.95)*.98;\n  return {x,y,size,tilt:Math.round(tilt/2)*2,alpha:p.opacity*enter*fade};\n}\n","src/ending-demo/integrated-ending-model.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { WIDTH, HEIGHT } from 'https://roc-offline.invalid/src/ending-demo/player-model.js';\nimport { OPEN_RESPONSE_FIELDS, validateOpenResponse } from 'https://roc-offline.invalid/src/open-response.js';\n\nexport function endingViewport(width,height) {\n  const scale=Math.min(width/WIDTH,height/HEIGHT);\n  if(!Number.isFinite(scale)||scale\u003c=0)throw new Error('Invalid ending viewport.');\n  return {scale,x:Math.max(0,(width-WIDTH*scale)/2),y:Math.max(0,(height-HEIGHT*scale)/2)};\n}\nexport function normalizeEndingAnswer(value) {\n  if(!validateOpenResponse(value,{submitted:true}))return null;\n  return Object.fromEntries(OPEN_RESPONSE_FIELDS.map(({id})=>[id,value[id]]));\n}\n","src/characters-room-preview.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { PEOPLE, dialogueForTopic } from 'https://roc-offline.invalid/src/characters-room-dialogues.js';\nimport { dialogueTurns } from 'https://roc-offline.invalid/src/characters-dialogue-turns.js';\nimport { createPortraitHitTest } from 'https://roc-offline.invalid/src/portrait-hit-test.js';\nimport { availableTopics, knownPeople } from 'https://roc-offline.invalid/src/body/card-flow.js';\nimport { getState, dispatch, subscribe, refresh } from 'https://roc-offline.invalid/src/chapter-session.js';\nimport { registerSceneLifecycle, markSceneReady, isSceneActive, navigateScene } from 'https://roc-offline.invalid/src/scene-navigation.js';\nconst room=document.querySelector('#room'),sceneReturn=document.querySelector('#scene-return');\nconst entry=new URLSearchParams(location.search).get('from')==='qu ight/height},${rect.left-rawLeft},${rect.top-rawTop})`;\n    card.style.transformOrigin='0 0';card.classList.add('is-moving');\n    const motion=card.animate([{transform:matrix(first.rect),opacity:first.opacity},{transform:matrix(last),opacity}],{duration:720,easing:'cubic-bezier(.2,.7,.2,1)',fill:'both'});\n    portraitMotions.set(card,motion);\n    motion.finished.then(()=>{if(portraitMotions.get(card)!==motion)return;portraitMotions.delete(card);motion.cancel();card.style.removeProperty('transform-origin');card.classList.remove('is-moving');},()=>{});\n  }\n}\nfunction beamAt(x){return `radial-gradient(ellipse 11% 58% at ${x}% 48%,#000b 0%,#0008 35%,#0003 65%,transparent 92%)`;}\nfunction refreshLights(){\n  const positions=[];\n  for(const card of cards){\n    const id=card.dataset.character,known=personKnown(id),newTopic=hasNew(id);\n    const introduced=room.dataset.mode==='talk'&&id===presented;\n    card.disabled=!known;card.classList.toggle('is-unknown',!known);card.classList.toggle('has-new',newTopic);\n    card.querySelector('.character-name').textContent=known||introduced?PEOPLE[id].name:'未知';card.setAttribute('aria-label',known?PEOPLE[id].name+(newTopic?'，有新话题':''):'身份未知');\n    const source=known||introduced?portraitSources.get(id):unknownPortrait;\n    for(const image of card.querySelectorAll('img')){\n      if(image.getAttribute('src')!==source)image.src=source;\n      image.alt=image.classList.contains('shadow-portrait')?(known||introduced?PEOPLE[id].name:'身份未知的剪影'):'';\n    }\n    let question=card.querySelector('.unknown-question');if(!question){question=document.createElement('span');question.className='unknown-question';question.textContent='?';question.setAttribute('aria-hidden','true');card.append(question);}\n    question.hidden=known||introduced;const face=card.querySelector('.face-mark');if(face)face.hidden=!(known||introduced);\n    if(room.dataset.mode==='roster'&&newTopic)positions.push(rosterX[id]);\n  }\n  if(room.dataset.mode==='talk'&&selected)positions.push(27);\n  room.style.setProperty('--room-light-masks',positions.length?positions.map(beamAt).join(','):'linear-gradient(transparent,transparent)');backgroundLit.style.opacity=positions.length?'.4':'0';\n}\nfunction cancelTyping(){generation++;clearTimeout(typingTimer);clearTimeout(responseTimer);typingTimer=responseTimer=null;typing=false;lineFinished=null;}\nfunction showLine(line,{onComplete}={}){\n  const nextSpeaker=line.speaker;\n  if(PEOPLE[nextSpeaker]&&nextSpeaker!==presented){presented=nextSpeaker;setPortraitMode('talk',presented);refreshLights();}\n  cancelTyping();visibleLine=line;revealed=0;current.replaceChildren();currentSpeaker.textContent=line.speaker==='player'?'我':PEOPLE[line.speaker]?.name||'';\n  renderHistory();\n  current.parentElement.dataset.speaker=line.speaker==='player'?'player':'npc';\n  glyphs=Array.from(line.text,char=>{const span=document.createElement('span');span.textContent=char;span.className='line-glyph';current.append(span);return span;});\n  const token=generation;\n  lineFinished=()=>{if(token!==generation||room.dataset.mode!=='talk'||!isSceneActive())return;typing=false;typingTimer=null;lineFinished=null;onComplete?.();};\n  function step(){if(token!==generation||room.dataset.mode!=='talk'||!isSceneActive())return;const span=glyphs[revealed++];if(span)span.classList.add('is-visible');if(revealed\u003cglyphs.length)typingTimer=setTimeout(step,/[，。？！；]/.test(span?.textContent||'')?140:34);else lineFinished?.();}\n  if(reducedMotion){glyphs.forEach(el=>el.classList.add('is-visible'));revealed=glyphs.length;queueMicrotask(()=>{if(token===generation)lineFinished?.();});}else{typing=true;step();}\n}\nfunction revealLine(){clearTimeout(typingTimer);typingTimer=null;typing=false;glyphs.forEach(el=>el.classList.add('is-visible'));revealed=glyphs.length;lineFinished?.();}\nfunction clearCurrent(){visibleLine=null;current.replaceChildren();currentSpeaker.textContent='';}\nfunction appendPartial(){if(!active||lineIndex\u003c0)return;let record=partialRecords.get(active.key);if(!record){record={owner:selected,lines:active.lines,seen:new Set()};partialRecords.set(active.key,record);}record.seen.add(lineIndex);}\nfunction historyLines(owner){\n  const result=[];if(greeted.has(owner))result.push({speaker:owner,text:PEOPLE[owner].greeting});\n  const items=new Map(topics().map(item=>[item.key,item])),completedKeys=new Set(state.cardFlow.completedTopics);\n  for(const key of completedKeys){const item=items.get(key);if(!item)continue;const all=dialogue(item,{history:true});if(item.character===owner)result.push(...all);else if(item.id==='T06'&&owner==='lin')result.push(...all.slice(4));else if(item.id==='T10'&&owner==='customer-d')result.push(...all.slice(-3));}\n  for(const [key,record] of partialRecords){if(record.owner!==owner||completedKeys.has(key))continue;result.push(...[...record.seen].sort((a,b)=>a-b).map(index=>record.lines[index]));}\n  for(const record of standaloneRecords)if(record.owner===owner)result.push(record.line);\n  return result;\n}\nfunction renderHistory(){\n  const history=historyLines(selected),last=history.at(-1);if(visibleLine&&last?.speaker===visibleLine.speaker&&last?.text===visibleLine.text)history.pop();\n  const speakers=new Set(history.map(line=>line.speaker).filter(speaker=>speaker!=='player'));\n  log.classList.toggle('has-multiple-speakers',speakers.size>1);\n  const fragment=document.createDocumentFragment();\n  for(const line of history){const entry=document.createElement('div');entry.className='dialogue-entry '+(line.speaker==='player'?'is-player':'is-npc');const name=document.createElement('span');name.className='speaker';name.textContent=line.speaker==='player'?'我':PEOPLE[line.speaker]?.name||'';const text=document.createElement('p');text.className='dialogue-text';text.textContent=line.text;entry.append(name,text);fragment.append(entry);}\n  log.replaceChildren(fragment);log.scrollTop=log.scrollHeight;\n}\nfunction renderTopics(){\n  topicList.replaceChildren();for(const item of topics(selected)){const first=dialogue(item)[0];const button=document.createElement('button');button.type='button';button.dataset.topic=item.key;button.textContent=first?.speaker==='player'?first.text:item.title;button.classList.toggle('has-new-topic',!item.completed);button.addEventListener('click',()=>startTopic(item.key));topicList.append(button);}\n  if(selected==='lu'&&state.cardFlow.completedTopics.includes('T19'))renderInvitationRecord();\n}\nfunction renderInvitationRecord(){\n  const invitation=state.invitation;if(!invitation.offered)return;\n  const record=document.createElement('section');record.className='invitation-record';const heading=document.createElement('h3');heading.textContent=`${invitation.month+4}月${invitation.day||2}日 · 私人追加邀请`;const status=document.createElement('p');status.textContent={pending:'待决定',accepted:'已认购',declined:'已婉拒',expired:'已过期'}[invitation.status]||'';record.append(heading,status);\n  if(invitation.month===state.month&&invitation.status==='pending'){\n    const view=document.createElement('button');view.type='button';view.textContent='查看认购';view.addEventListener('click',()=>navigateScene('./board-receipt-preview.html?investment=private'));\n    const decline=document.createElement('button');decline.type='button';decline.textContent='这次不追加';decline.addEventListener('click',()=>{const result=dispatch({type:'invitationDecline'});if(result.error){showLine({speaker:'player',text:result.error});return;}startStandaloneLines([{speaker:'player',text:'这次先不追加。'},{speaker:'lu',text:'行，那这笔不登记。'}]);});\n    const later=document.createElement('button');later.type='button';later.textContent='稍后再说';later.addEventListener('click',()=>{clearCurrent();record.remove();});record.append(view,decline,later);\n  }\n  topicList.append(record);\n}\nfunction openPerson(id){\n  state=refresh();if(!PEOPLE[id]||!personKnown(id)||room.dataset.mode==='talk')return;\n  selected=id;presented=id;active=null;lineIndex=-1;reply.hidden=true;topicList.hidden=true;\n  setPortraitMode('talk',id);document.querySelector('#speaker-name').textContent=PEOPLE[id].name;\n  renderHistory();renderTopics();refreshLights();moveConversationPanel(true);\n  showLine({speaker:id,text:PEOPLE[id].greeting},{onComplete(){greeted.add(id);renderHistory();topicList.hidden=false;}});\n}\nfunction startTopic(key){\n  state=refresh();const item=topics(selected).find(topic=>topic.key===key);if(!item){renderTopics();return;}\n  const resolved=dialogue(item);if(!resolved.length)return;\n  cancelTyping();clearCurrent();active={...item,lines:resolved,turns:dialogueTurns(resolved),turn:0};\n  lineIndex=-1;topicList.hidden=true;reply.hidden=true;sendTurn();\n}\nfunction startStandaloneLines(lines){\n  cancelTyping();clearCurrent();active={key:null,lines,turns:dialogueTurns(lines),turn:0};\n  lineIndex=-1;topicList.hidden=true;reply.hidden=true;sendTurn();\n}\nfunction sendTurn(){\n  if(!active||room.dataset.mode!=='talk')return;\n  const conversation=active,turn=conversation.turns[conversation.turn];if(!turn){finishTopic(conversation);return;}\n  reply.hidden=true;clearCurrent();\n  if(turn.prompt){lineIndex=turn.prompt.index;if(conversation.key)appendPartial();else standaloneRecords.push({owner:selected,line:turn.prompt.line});}\n  renderHistory();playResponse(conversation,turn,0);\n}\nfunction playResponse(conversation,turn,index){\n  if(active!==conversation||room.dataset.mode!=='talk')return;\n  const response=turn.responses[index];\n  if(!response){offerNextTurn(conversation);return;}\n  lineIndex=response.index;\n  showLine(response.line,{onComplete(){\n    if(active!==conversation)return;\n    if(conversation.key)appendPartial();else standaloneRecords.push({owner:selected,line:response.line});renderHistory();\n    if(index+1\u003cturn.responses.length){\n      const token=generation;\n      responseTimer=setTimeout(()=>{responseTimer=null;if(token===generation)playResponse(conversation,turn,index+1);},reducedMotion?0:480);\n    }else offerNextTurn(conversation);\n  }});\n}\nfunction offerNextTurn(conversation){\n  if(active!==conversation)return;\n  conversation.turn++;\n  const next=conversation.turns[conversation.turn];\n  if(!next){finishTopic(conversation);return;}\n  if(!next.prompt){sendTurn();return;}\n  reply.textContent=next.prompt.line.text;reply.hidden=false;\n}\nfunction finishTopic(conversation){\n  if(active!==conversation)return;\n  if(conversation.key){\n    const expectedSeed=seed;state=refresh();if(seed!==expectedSeed||active!==conversation)return;\n    const result=dispatch({type:'completeTopic',topicKey:conversation.key});\n    if(result.error){active=null;reply.hidden=true;topicList.hidden=false;renderTopics();showLine({speaker:'player',text:result.error});return;}\n    state=result.state;partialRecords.delete(conversation.key);\n  }\n  active=null;lineIndex=-1;reply.hidden=true;topicList.hidden=false;\n  renderHistory();renderTopics();refreshLights();\n}\nfunction backToRoster({immediate=false,restoreFocus=true}={}){if(room.dataset.mode!=='talk'&&!immediate)return;cancelTyping();const previous=selected;selected=null;presented=null;active=null;lineIndex=-1;visibleLine=null;reply.hidden=true;setPortraitMode('roster',null,{immediate});refreshLights();moveConversationPanel(false,{immediate,onFinished:()=>{topicList.hidden=false;clearCurrent();if(restoreFocus)cards.find(card=>card.dataset.character===previous)?.focus({preventScroll:true});}});}\nfunction syncFormalState(){state=getState();if(seed!==state.seed){seed=state.seed;partialRecords.clear();greeted.clear();standaloneRecords.length=0;backToRoster({immediate:true,restoreFocus:false});}if(selected&&!personKnown(selected))backToRoster({immediate:true,restoreFocus:false});refreshLights();if(selected&&!active){renderHistory();renderTopics();}}\nfunction deactivate(){cancelTyping();backToRoster({immediate:true,restoreFocus:false});}\nfor(const card of cards)card.addEventListener('click',event=>{\n  if(room.dataset.mode!=='roster')return;\n  // Opening moves the portrait. Do not test this same press against its new position.\n  event.stopPropagation();\n  openPerson(card.dataset.character);\n});\nreply.addEventListener('click',sendTurn);\ncurrent.addEventListener('click',()=>{if(typing)revealLine();});\nroom.addEventListener('click',event=>{\n  if(room.dataset.mode!=='talk'||event.target.closest('.talk-panel,.scene-return'))return;\n  if(event.clientX>=panel.getBoundingClientRect().left)return;\n  const portrait=cards.find(card=>card.classList.contains('is-selected'));\n  if(portrait){\n    const label=portrait.querySelector('.character-name')?.getBoundingClientRect();\n    if(label&&event.clientX>=label.left&&event.clientX\u003c=label.right&&event.clientY>=label.top&&event.clientY\u003c=label.bottom)return;\n    const hit=hitPortrait(portrait.querySelector('.shadow-portrait'),{x:event.clientX,y:event.clientY});\n    if(hit===true)return;\n    // If a mask cannot be read, retain the old safe behavior over the portrait.\n    if(hit===null){const bounds=portrait.getBoundingClientRect();if(event.clientX>=bounds.left&&event.clientX\u003c=bounds.right&&event.clientY>=bounds.top&&event.clientY\u003c=bounds.bottom)return;}\n  }\n  backToRoster();\n});\ndocument.addEventListener('keydown',event=>{if(event.key==='Escape')backToRoster();});\nwindow.addEventListener('pagehide',deactivate);window.addEventListener('pageshow',event=>{if(event.persisted){deactivate();refresh();syncFormalState();}});\nconst portraitPreloads=[...new Set([...portraitSources.values(),unknownPortrait])].map(source=>{const image=new Image();image.src=source;return image;});\nconst portraitsReady=Promise.all(portraitPreloads.map(image=>image.decode()));\nsubscribe(syncFormalState);registerSceneLifecycle({ready:portraitsReady,activate(){refresh();syncFormalState();},deactivate,refresh(){refresh();syncFormalState();}});syncFormalState();\n","src/characters-room-dialogues.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n// Approved interview manuscript: design/CHARACTER_INTERVIEWS_V1.0.md.\n// Unlocks and rewards belong to card-flow; this file supplies dialogue only.\nexport const PEOPLE = {\n  lu:{name:'陆衡',greeting:'资料都在这儿，想了解哪一项？'},\n  zhou:{name:'周岚',greeting:'你慢慢看，有什么想问我的就问。'},\n  lin:{name:'林乔',greeting:'要核对哪笔？日期和流水号告诉我。'},\n  'customer-d':{name:'客户丁',greeting:'行，你问吧。'},\n};\nconst lines=(...pairs)=>pairs.map(([speaker,text])=>({speaker,text}));\nconst exchange=(person,...texts)=>texts.map((text,index)=>({speaker:index%2?person:'player',text}));\nconst topic=(id,character,title,...texts)=>({id,character,title,lines:exchange(character,...texts)});\nexport const DIALOGUE_TOPICS = [\n  topic('T01','zhou','到账经历',\n    '周姐，你前面说的那三笔，都到账了？','到了，一次四千八，三个月一万四千四。',\n    '都进你自己的卡了？','嗯，我自己查过，回单也留着呢。',\n    '所以你才叫我过来看看？','是啊，我自己拿到了，才跟你提的。'),\n  topic('T02','zhou','本金情况',\n    '你那六万本金，现在还放在里面？','对，还没取。',\n    '那之前拿到的一万四千四呢？','那几笔是给我的收益，本金我一分都没取。'),\n  topic('T03','zhou','对项目的了解',\n    '他们具体拿钱做什么，你问过吗？','说是有专门的人做，细的我没问。',\n    '那做过哪些交易，你看过没有？','没看过。那时候钱都准时到，我也就没多问。'),\n  topic('T04','lu','项目靠什么赚钱',\n    '一个月8%，你们靠什么赚这么多？','主要是团队在做价差交易。你不用自己盯着盘。',\n    '具体做过哪些交易？','业务情况，月报里有介绍。你先看，有不明白的再问我。'),\n  topic('T05','lu','月报中的项目',\n    '这份月报，是专门给这个项目做的？','JD-01的。一月到三月，你看的就是这三期。',\n    '那对应的实际交易，我也想看看。','可以，我让人登记。核验资料到了，你再对着看。'),\n  {id:'T06',character:'lu',title:'找谁核对材料',lines:lines(\n    ['player','这几份材料，找谁能核得清楚？'],['lu','找我们财务林乔。她负责对接这些资料。'],\n    ['player','方便叫她过来吗？'],['lu','你坐会儿，我叫一下。'],\n    ['player','你是林乔？'],['lin','嗯，我做财务经办。陆经理说，你想核一下材料。'],\n    ['player','我手里这几份，有看不明白的地方。'],['lin','先说哪一份。日期、编号最好一起给我。'])},\n  topic('T07','lu','月报和核验对不上',\n    '月报说有收益，核验却连成交都没有。','哪一份？……这份我看到了。',\n    '项目编号和时间都对过，是同一个项目。','你把这几行标出来。我找人核一下这三期。'),\n  topic('T08','lin','不同批次的支付安排',\n    '周姐那三个月是按月拿的，丙怎么不一样？','不是同一批。你先看“支付安排”那一栏，跟周岚那行不一样。',\n    '还得再对合同？','嗯。看丙签的是哪份、约定哪天付。先别照周岚的日子算。'),\n  {id:'T09',character:'lin',title:'历史到期表怎样核对'},\n  {id:'T10',character:'zhou',title:'其他客户为何参与',lines:lines(\n    ['player','登记表上这个人，你认识吗？'],['zhou','认识，要不我帮你问问？'],\n    ['player','好，我想听听他当时怎么决定的。'],['zhou','那你等我一下。'],\n    ['zhou','这就是我刚说的朋友。'],['player','你好，方便聊两句吗？'],['customer-d','行，你问吧。'])},\n  topic('T11','customer-d','客户丁的判断依据',\n    '你当时怎么决定投这里的？','执照我看过，周姐又说钱确实到了。',\n    '你更信周姐自己的经历？','嗯，认识的人自己拿到了，我就觉得能试试。',\n    '他们实际做过哪些交易，你看过吗？','没有，具体的我没查过。'),\n  topic('T12','lin','两个账户的用途',\n    '这两个户都挂着公司名，平时怎么用？','收认购和对客付款走C户，M户留存资金。用途写在表上。',\n    '陆总能直接动里面的钱？','两户归公司。谁能签、谁能批，这张没列。'),\n  topic('T13','lin','内部划转如何核对',\n    'C这边转出一笔，M那边正好进了一笔。','把两边的TRF号对上。日期、金额也看看，别只认那个数。',\n    '对上了，就能接成同一笔？','嗯。两边都是公司的户，再接着看它后来有没有出去。'),\n  topic('T14','lin','合同与流水的范围',\n    '这份客户清单，不能直接当那三个月收进来的钱。','对。这是存续合同，不是一到三月新收款的清单。',\n    '那更早的钱去了哪儿？','这几页看不到。先把这段能对上的入款追清楚，别往银行期初余额里补一个数。'),\n  topic('T15','lin','资产核对的范围',\n    '这张资产表，是公司现在还剩下的东西？','看截止日。它跟前面那几份历史账是同一段，只到那天。',\n    '那后面发生的交易呢？','得看之后的账，不能往这张旧表里添。'),\n  {id:'T16',character:'lin',title:'到账与付款执行'},\n  topic('T17','lu','追问实际付款来源',\n    '这几笔新认购款进来，接着就付给了旧客户。','你把编号对过了？',\n    '都对过。你之前说，这些收益是交易赚的。','这几笔我会给你回复。'),\n  {id:'T18',character:'lu',title:'本次延期通知'},\n  {id:'T19',character:'lu',title:'单独认购邀请'},\n  topic('T20','lu','追加和退出分开决定',\n    '我看过条款了，追加也不能保证先退。','对，退出还得单独申请。',\n    '折价按申请时看到的那份？','嗯。你能接受，再填金额和理由。批下来才办。'),\n  topic('T21','lu','通知没有回答的问题',\n    '通知只说系统调整。经营记录、付款来源，一个也没解释。','你问的这几笔，我看到了。',\n    '那就按这几笔回，别再拿同一张通知答我。','好。你列的这些，我收到了。'),\n];\n\nconst dateLabel=month=>`${Number(month)+4}月`;\nexport function dialogueForTopic(item,context={}) {\n  const base=DIALOGUE_TOPICS.find(topic=>topic.id===item.id);\n  if(!base)return [];\n  const read=new Set(context.read||[]);\n  const snapshot=item.snapshot||context.snapshot||{};\n  const month=context.month;\n  let result=base.lines||[];\n  if(item.id==='T09')result=(snapshot.variant?snapshot.variant==='document':read.has('D12A'))?exchange('lin',\n    '到期表上列着要付的钱，就算已经付了吗？','这张列的是当时该付什么。真付了没有，还得查对应的执行记录。',\n    '那我先拿它核合同？','可以，先对客户和日期。不同到期日的别混在一起。'):\n    exchange('lin','丙那一笔，接下来该怎么核？','拿到他那批的到期表，先对客户和计划支付日，再跟合同核。',\n      '这样就能确认钱到账了？','还得有对应日期、对应收款人的入账记录。光有计划，确认不了到账。');\n  if(item.id==='T15'&&(snapshot.ownLedgerRead??read.has('C02')))result=[...result,{speaker:'lin',text:'你自己的收支，看那份单独登记。'}];\n  if(item.id==='T16'){\n    if(item.character==='zhou')result=exchange('zhou',\n      '这份汇总里，你那三笔共一万四千四，对得上吗？','对，跟我给你那三张回单一样。',\n      '当时每笔到账，你都查过自己的卡？','查过，钱确实进来了。',\n      '他们拿什么钱付给你，你当时问过吗？','没问，我那会儿只顾着看到账了。');\n    else if(snapshot.variant?snapshot.variant==='both':read.has('D10')&&read.has('D11'))result=exchange('lin',\n      '指令上的PAY号，可以跟到账记录接起来。','再跟C户的支出对一下。收款人、日期、金额都得是同一笔。',\n      '入款那头也要带上？','对，沿着来源流水号往前找。把同一笔钱的前后记录摆在一起。');\n    else if(snapshot.variant?snapshot.variant==='instruction':read.has('D10'))result=exchange('lin',\n      '这张写着付给谁，就说明已经付了？','这是公司留的付款指令。有没有执行，拿PAY号去银行流水里找。',\n      '“来源流水号”这一栏呢？','拿它去C户的完整流水里对。先找到那笔入款，再往后接。');\n    else if(snapshot.variant==='receipt'||read.has('D11'))result=exchange('lin',\n      '这些款确实到账了。凭这个能追到钱从哪儿来？','这头能看到谁收了钱。往前追，用交易流水号去找付款户的完整流水。',\n      '用途上写着“收益”，就算经营赚的？','那一行是付款方填的。具体怎么赚来的，得看项目做过什么业务。');\n  }\n  if(item.id==='T18'){\n    const originalMonth=snapshot.noticeMonth??snapshot.month??item.month;\n    const currentVersion=context.history&&snapshot.variant?snapshot.variant==='current':originalMonth===month;\n    result=currentVersion?exchange('lu',\n      '这次延期，哪些付款要缓？','这个月还没执行的部分收益先缓一缓，之前到账的不动。',\n      '欠着的，后面会一起补吗？','先给你记着。什么时候能付，我现在定不了。'):\n      exchange('lu',`这份${dateLabel(originalMonth)}的通知，当时停了哪些付款？`,'那次还没执行的部分收益缓了，已经到账的没动。',\n        '那次欠下的，后来跟新一期一起补了吗？','之前欠着的还在登记里。新一期有没有到，得看那一期的记录。');\n  }\n  if(item.id==='T19'){\n    const invitation=context.invitation||{};\n    const originalMonth=snapshot.month??invitation.month??item.month;\n    const status=context.history?(snapshot.statusAtView||'pending'):invitation.status;\n    const handled=status&&status!=='pending';\n    const readingMonth=context.history?(snapshot.viewedMonth??month):month;\n    if(originalMonth!==readingMonth||handled||item.completed&&!context.history)result=exchange('lu',\n      `${dateLabel(originalMonth)}那次单独认购，我想再看一下。`,'当时那份记录还在，按上面标的日期看。');\n    else result=lines(\n      ['lu',snapshot.crisisAtOffer??invitation.crisisAtOffer?\n        '现在付款还在调整。这笔单独认购，我可以给你登记，办不办你再想想。':\n        '普通认购窗口是关了。不过我这儿能给你单独登记一笔，本月有效。'],\n      ['player','这笔什么时候开始结？'],['lu','下个月月初。没满整月的那段，按实际天数算。'],\n      ['player','追加了，就能优先退出？'],['lu','这个我答应不了。认购是一笔，退出还得另申请。']);\n  }\n  return result.map(line=>({...line}));\n}\n","src/characters-dialogue-turns.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n// One click sends a player line; the complete NPC response follows automatically.\n// Keep source indexes so partial transcripts never expose unplayed later lines.\nexport function dialogueTurns(lines) {\n  const turns=[];\n  for(let index=0;index\u003clines.length;index++){\n    const line=lines[index];\n    if(line.speaker==='player')turns.push({prompt:{line,index},responses:[]});\n    else {\n      if(!turns.length)turns.push({prompt:null,responses:[]});\n      turns.at(-1).responses.push({line,index});\n    }\n  }\n  return turns;\n}\n","src/portrait-hit-test.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n/** Map a view
