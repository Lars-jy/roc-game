onclusion',kind:'conclusion',unlockQuestions:['accounts-4'],body:'存续合同本金和1—3月的入款不是同一统计对象和期间，差额不足以证明本期失踪；也不能因此排除其他资金问题。' },\n  { id:'conclusion-payment',title:'新认购款被用于支付旧客户收益',type:'conclusion',kind:'conclusion',unlockQuestions:['payouts-1','payouts-2','payouts-3'],body:'完整C户流水与付款指令或到账汇总按执行号对应，可核实三期新认购款用于支付旧客户收益。此结论属于历史1—3月资料，不自动套用到玩家后续实际到账。' },\n];\n\nconst docTitles = {\n  D01:'产品说明',D02:'认购协议',D03:'周岚的银行回单',D04:'项目月报',D05:'独立业务核验',D06:'账户关系表',D07:'C户完整流水',D08:'M户流水',D09:'客户认购登记',D10:'付款指令',D11:'旧客户到账汇总',D12A:'历史到期付款表',D12B:'阶段性付款通知',D13:'历史资金与资产核对表',P01:'本人业务条款',\n};\n\nexport const CARDS = [\n  // Keep the opening invitation's institution visible without scrolling past\n  // every monthly document. Main-card review order still follows TASKS.\n  ...support.filter(card=>card.type==='organization'),\n  ...TASKS.map((task,index)=>({ ...task,type:'task',position:{x:100+(index%4)*400,y:120+Math.floor(index/4)*810} })),\n  ...Object.entries(docTitles).map(([id,title])=>({id,title,type:'document',kind:'document',document:id,art:({D03:'payouts',D04:'project',D07:'accounts',D08:'accounts',D12B:'crisis'})[id]||'document'})),\n  ...support.filter(card=>card.type!=='organization'),\n];\nexport const CARD_MAP = Object.fromEntries(CARDS.map(card=>[card.id,card]));\nexport const TASK_IDS = TASKS.map(task=>task.id);\nexport const QUESTIONS = TASKS.flatMap(task=>task.questions);\nexport const QUESTION_MAP = Object.fromEntries(QUESTIONS.map(item=>[item.id,item]));\n\nconst additionalDocuments = {\n  invitation:doc('INV','私人投资交流邀请函',[\n    text('尊敬的受邀嘉宾','经周岚女士推荐，诚邀您莅临金鼎财富，参加“稳盈计划”专场投资交流。'),\n    text('接待安排','本次会面由客户经理陆衡先生接待，为您介绍项目运作、收益分配及认购安排，项目说明及认购资料将于会面时提供。'),\n    text('会面地点','金鼎大厦 · 金鼎财富会客室'),text('落款','金鼎财富\\n客户服务组'),\n  ]),\n  D12B:doc('D12B','阶段性付款通知',[\n    text('延期说明','因系统调整，发生当月尚未执行的部分收益支付暂缓；已实际入账款项不追回。'),\n    text('历史登记','过去应付未付金额单独登记。此后恢复的新到期付款不自动补发历史欠付。实际情况以对应日期登记为准。'),\n    text('追加与退出','追加认购不构成优先支付或本金安全保证，退出按独立申请结果办理。'),\n  ],'金鼎财富','事件发生日'),\n  P01:doc('P01','本人认购与业务条款',[\n    text('认购与结算','月约定8%单利，收益不自动复投；按自然月实际天数及实际未结清本金分段计息，首次约定结算为下个月月初。约定结算不等于实际到账。'),\n    text('折价退出','上月有认购且仍有未结清本金时，可于月初申请办理。申请金额可在全部未结清本金范围内自选，并填写理由。清算比例见当期确认单；获批后该笔申请本金结清，实际退回与折价损失分别登记，未获批准则本金保留。'),\n    text('追加安排','普通认购在月初办理。单独认购邀请本月有效，不保证退出获批或优先付款。'),\n  ],'金鼎财富 · 本人业务登记'),\n};\n\nexport function getCardDocument(id) {\n  const card = CARD_MAP[id];\n  if (!card) return null;\n  if (additionalDocuments[id]) return structuredClone(additionalDocuments[id]);\n  if (card.type === 'document' && DOCUMENT_MAP[id]) return structuredClone(DOCUMENT_MAP[id]);\n  if (card.body) return doc(id,card.title,[text(card.type==='conclusion'?'核对记录':'记录内容',card.body)],card.type==='note'?'谈话归档':'调查记录');\n  if (card.type === 'task') return doc(id,card.title,[text('调查对象',card.subtitle)],'调查工作台');\n  return null;\n}\n","src/investigation/model.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { CARDS, CARD_MAP, TASKS, QUESTION_MAP } from 'https://roc-offline.invalid/src/investigation/data.js';\n\nexport const STORAGE_KEY = 'roc-mobile:jinding-investigation-cards-v1';\nconst object = value => value !== null && typeof value === 'object' && !Array.isArray(value);\nconst copy = value => JSON.parse(JSON.stringify(value));\nconst evidenceRules = new Map(Object.values(QUESTION_MAP).map(question => [\n  question.id,\n  {\n    allowed: new Set(question.allowedSets.flat()),\n    maximum: Math.max(...question.allowedSets.map(group => group.length)),\n  },\n]));\n\nexport function createState() { return { version:1,links:{},values:{},positions:{} }; }\n\nfunction numeric(value) {\n  if (typeof value === 'number') return Number.isFinite(value) && value >= 0 && value \u003c= 1e12 ? value : null;\n  if (typeof value !== 'string') return null;\n  const raw=value.trim();\n  if (!/^(?:\\d+|\\d{1,3}(?:,\\d{3})+)(?:\\.\\d{1,2})?$/.test(raw)) return null;\n  const n=Number(raw.replaceAll(',',''));\n  return Number.isFinite(n) && n \u003c= 1e12 ? n : null;\n}\n\nexport function createNotebookEvaluator(state) {\n  const memo=new Map(), visiting=new Set();\n  const available = id => {\n    const card=CARD_MAP[id];\n    return Boolean(card && (!card.unlockQuestions || card.unlockQuestions.every(qId=>evaluate(qId).correct)));\n  };\n  const evaluate = qId => {\n    if (memo.has(qId)) return memo.get(qId);\n    const question=QUESTION_MAP[qId],linked=state.links?.[qId]||[];\n    if (!question || visiting.has(qId)) return { correct:false,linksCorrect:false,inputCorrect:false,missing:'unavailable',linked:[...linked] };\n    visiting.add(qId);\n    const { allowed, maximum } = evidenceRules.get(qId);\n    const linksCorrect = linked.length > 0 && linked.length \u003c= maximum\n      && new Set(linked).size === linked.length\n      && linked.every(id => allowed.has(id) && available(id));\n    const value=state.values?.[qId];\n    const inputCorrect=question.type==='boolean'?typeof value==='boolean' && value===question.expected\n      :question.type==='number'?question.fields.every(field=>numeric(value?.[field.id])===field.expected):true;\n    const missing=linksCorrect?(inputCorrect?'':'input'):'links';\n    const result={correct:linksCorrect&&inputCorrect,linksCorrect,inputCorrect,missing,linked:[...linked]};\n    visiting.delete(qId);memo.set(qId,result);return result;\n  };\n  return { evaluate,available };\n}\n\nexport function evaluateQuestion(state,qId) { return createNotebookEvaluator(state).evaluate(qId); }\nexport function isCardAvailable(state,id) { return createNotebookEvaluator(state).available(id); }\nexport function availableCards(state) { const check=createNotebookEvaluator(state);return CARDS.filter(card=>check.available(card.id)); }\nexport function evaluateTask(state,taskId) {\n  const task=TASKS.find(item=>item.id===taskId);\n  if (!task) return {correct:false,completed:0,total:0,questions:[]};\n  const check=createNotebookEvaluator(state),questions=task.questions.map(q=>({id:q.id,...check.evaluate(q.id)}));\n  const completed=questions.filter(q=>q.correct).length;\n  return {correct:completed===questions.length,completed,total:questions.length,questions};\n}\n\nexport function connect(state,qId,cardId) {\n  if (!QUESTION_MAP[qId] || !CARD_MAP[cardId] || cardId===QUESTION_MAP[qId].taskId || !isCardAvailable(state,cardId)) return state;\n  const current=state.links[qId]||[];\n  if (current.includes(cardId)) return state;\n  return {...state,links:{...state.links,[qId]:[...current,cardId]}};\n}\nexport function disconnect(state,qId,cardId) {\n  if (!QUESTION_MAP[qId] || !(state.links[qId]||[]).includes(cardId)) return state;\n  return {...state,links:{...state.links,[qId]:state.links[qId].filter(id=>id!==cardId)}};\n}\nexport function clearLinks(state,qId) {\n  if (!QUESTION_MAP[qId] || !state.links[qId]?.length) return state;\n  return {...state,links:{...state.links,[qId]:[]}};\n}\nexport function setValue(state,qId,value) {\n  const q=QUESTION_MAP[qId];if (!q || q.type==='link') return state;\n  if (q.type==='boolean' && value!==null && typeof value!=='boolean') return state;\n  if (q.type==='number' && (!object(value) || Object.entries(value).some(([id,v])=>!q.fields.some(f=>f.id===id)||!['string','number'].includes(typeof v)||String(v).length>40||typeof v==='number'&&!Number.isFinite(v)))) return state;\n  const next=q.type==='number'?{...(state.values[qId]||{}),...value}:value;\n  if (JSON.stringify(state.values[qId])===JSON.stringify(next)) return state;\n  return {...state,values:{...state.values,[qId]:next}};\n}\nexport function setPosition(state,id,position) {\n  if (!CARD_MAP[id] || !validPosition(position)) return state;\n  return {...state,positions:{...state.positions,[id]:{x:position.x,y:position.y}}};\n}\nfunction validPosition(position) { return object(position)&&['x','y'].every(k=>Number.isFinite(position[k])&&Math.abs(position[k])\u003c=1e9); }\n\nexport function validateState(state) {\n  try {\n    if (!object(state)||state.version!==1||!object(state.links)||!object(state.values)||!object(state.positions)) return false;\n    if (Object.keys(state).some(key=>!['version','links','values','positions'].includes(key))) return false;\n    for (const [id,links] of Object.entries(state.links)) if (!QUESTION_MAP[id]||!Array.isArray(links)||links.length>CARDS.length||new Set(links).size!==links.length||links.some(card=>!CARD_MAP[card]||card===QUESTION_MAP[id].taskId)) return false;\n    for (const [id,value] of Object.entries(state.values)) {\n      const q=QUESTION_MAP[id];if (!q||q.type==='link') return false;\n      if (q.type==='boolean' && value!==null && typeof value!=='boolean') return false;\n      if (q.type==='number' && (!object(value)||Object.entries(value).some(([key,v])=>!q.fields.some(f=>f.id===key)||!['string','number'].includes(typeof v)||String(v).length>40||typeof v==='number'&&!Number.isFinite(v)))) return false;\n    }\n    return Object.entries(state.positions).every(([id,pos])=>CARD_MAP[id]&&validPosition(pos));\n  } catch { return false; }\n}\nexport function serializeState(state) {\n  if (!validateState(state)) throw new TypeError('卡片记录无效。');\n  const raw=JSON.stringify(state);\n  if (new TextEncoder().encode(raw).byteLength>1024*1024) throw new RangeError('卡片记录过大。');\n  return raw;\n}\nexport function restoreState(raw) {\n  if (typeof raw!=='string'||raw.length>1024*1024) return null;\n  try { if (new TextEncoder().encode(raw).byteLength>1024*1024) return null; const state=JSON.parse(raw);return validateState(state)?copy(state):null; } catch { return null; }\n}\n","src/chapter-flow.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nconst READABLE = new Set(['D01', 'D02', 'D03']);\nconst BRANCHES = new Set(['materials', 'lu', 'zhou']);\nconst copy = value => JSON.parse(JSON.stringify(value));\nconst runId = value => typeof value === 'string' && value.length > 0 && value.length \u003c= 160;\nconst list = (value, allowed) => Array.isArray(value) && value.length \u003c= 16\n  && value.every(item => typeof item === 'string')\n  && new Set(value).size === value.length && value.every(item => allowed.has(item));\n\n/** The chapter journal contains no wallet, position, transaction or payout data. */\nexport function restoreChapter(raw) {\n  try {\n    const value = typeof raw === 'string' ? JSON.parse(raw) : copy(raw);\n    if (!value || value.version !== 1 || !['prologue', 'main', 'complete'].includes(value.stage)\n      || !runId(value.runId) || typeof value.pendingNew !== 'boolean'\n      || !list(value.readDocs, READABLE) || !list(value.visitedBranches, BRANCHES)) return null;\n    return { version: 1, stage: value.stage, runId: value.runId, pendingNew: value.pendingNew,\n      readDocs: [...value.readDocs], visitedBranches: [...value.visitedBranches] };\n  } catch { return null; }\n}\n\nexport function hasMainProgress(value) {\n  if(value?.flow==='cards') return Boolean(value.complete || value.month>0 || value.window!=='invest'\n    || value.finance.totalInvested>0 || value.finance.earnedTile>0 || value.read.length\n    || value.investigation.earned>0 || value.board.tray.length || value.board.matches>0);\n  return Boolean(value && (value.finance.decided || value.finance.phase > 0\n    || value.finance.totalInvested > 0 || value.finance.pendingTile > 0\n    || value.finance.earnedTile > 0 || value.board.matches > 0\n    || value.meta.read.length > 0 || Object.keys(value.meta.answers).length > 0\n    || value.meta.sent.length > 0));\n}\n\nfunction receptionData(data) {\n  if (!Array.isArray(data.readDocs) || !Array.isArray(data.visitedBranches)\n    || data.readDocs.length > 16 || data.visitedBranches.length > 16\n    || !data.readDocs.every(item => typeof item === 'string')\n    || !data.visitedBranches.every(item => typeof item === 'string')) return null;\n  const readDocs = [...new Set(data.readDocs.filter(id => READABLE.has(id)))];\n  const visitedBranches = [...new Set(data.visitedBranches.filter(id => BRANCHES.has(id)))];\n  // The existing reception only reaches its final action after the receipt.\n  if (!readDocs.includes('D03')) return null;\n  return { readDocs, visitedBranches };\n}\n\n/** Coordinates actual iframe messages; every side effect is injected for tests. */\nexport function createChapterFlow({ origin, getFrameSource, readMain, readMainRaw,\n  initialChapter = null, newRunId, saveChapter, loadFrame, postToFrame,\n  showEntry, showConfirmation, showMissingMain = () => {}, revealFrame, questionsComplete = () => {},\n  mainURL = './main-demo.html?game=1', endingComplete = () => {} }) {\n  let chapter = restoreChapter(initialChapter);\n  let active = 'entry';\n  let startSent = false;\n  let mainStarted = false;\n  let completeNotified = false;\n\n  function save() { saveChapter(copy(chapter)); }\n  function load(stage) {\n    active = stage; startSent = false; mainStarted = false; completeNotified = false;\n    loadFrame(stage === 'prologue' ? './prologue.html?game=1' : mainURL);\n  }\n  function menu() {\n    active = 'entry';\n    const main = readMain();\n    const canContinue = Boolean(chapter || hasMainProgress(main));\n    showEntry({ canContinue, continueLabel: chapter?.pendingNew && chapter.stage === 'prologue' ? '继续赴约' : main?.complete ? '查看调查报告' : '继续调查' });\n  }\n  function startNew({ confirmed = false } = {}) {\n    const main = readMain();\n    if (!confirmed && (hasMainProgress(main) || readMainRaw() && !main || chapter)) { showConfirmation(); return false; }\n    chapter = { version: 1, stage: 'prologue', runId: newRunId(), pendingNew: true, readDocs: [], visitedBranches: [] };\n    save(); load('prologue'); return true;\n  }\n  function continueCase() {\n    if (chapter?.pendingNew) { load(chapter.stage); return true; }\n    // A completed intro journal is not a replacement for an actual money save.\n    // Never turn Continue into an unconfirmed fresh 10,000-yuan case.\n    if (!readMainRaw()) { showMissingMain(); return false; }\n    const main = readMain();\n    if (!main && !chapter) return false;\n    const candidateRun = main?.flow==='cards' ? main.seed : main?.meta?.chapterRunId;\n    const existingRun = runId(candidateRun) ? candidateRun : null;\n    const sameRun = chapter && existingRun === chapter.runId;\n    chapter = { version: 1, stage: 'main', runId: existingRun || chapter?.runId || newRunId(), pendingNew: false,\n      readDocs: sameRun ? [...chapter.readDocs] : [], visitedBranches: sameRun ? [...chapter.visitedBranches] : [] };\n    save(); load('main'); return true;\n  }\n  function loaded() { if (active === 'prologue') revealFrame(); }\n  function retry() { if (active === 'prologue' || active === 'main') { load(active); return true; } return false; }\n  function message(event) {\n    if (event.origin !== origin || event.source !== getFrameSource() || !event.data || typeof event.data.type !== 'string') return false;\n    const data = event.data;\n    if (data.type === 'chapter:prologue-complete' && active === 'prologue') {\n      const reception = receptionData(data); if (!reception) return false;\n      chapter = { ...chapter, stage: 'main', ...reception };\n      save(); load('main'); return true;\n    }\n    if (data.type === 'chapter:main-ready' && active === 'main' && !mainStarted) {\n      startSent = true;\n      postToFrame({ type: 'chapter:start-main', runId: chapter.runId, startFresh: chapter.pendingNew,\n        readDocs: [...chapter.readDocs], visitedBranches: [...chapter.visitedBranches] }, origin);\n      return true;\n    }\n    if (data.type === 'chapter:main-started' && active === 'main' && startSent && !mainStarted && data.runId === chapter.runId) {\n      mainStarted = true; chapter.pendingNew = false; save(); revealFrame(); return true;\n    }\n    if (data.type === 'chapter:restart-prologue' && active === 'main' && mainStarted) {\n      return startNew({ confirmed: true });\n    }\n    if(data.type==='chapter:case-reset' && active==='main' && mainStarted) {\n      const main=readMain();\n      if(main?.flow!=='cards' || main.complete || !runId(data.caseSeed) || main.seed!==data.caseSeed) return false;\n      chapter={...chapter,stage:'main',runId:main.seed,pendingNew:false,readDocs:[],visitedBranches:[]};\n      completeNotified=false;save();return true;\n    }\n    if(data.type==='chapter:ending-complete' && active==='main' && mainStarted && !completeNotified) {\n      const main=readMain();\n      if(main?.flow!=='cards' || !main.complete || data.caseSeed!==main.seed || main.seed!==chapter.runId) return false;\n      completeNotified=true;chapter={...chapter,stage:'complete'};save();endingComplete();return true;\n    }\n    if (data.type === 'chapter:questions-complete' && active === 'main' && mainStarted && data.count === 8 && !completeNotified) {\n      completeNotified = true; questionsComplete(); return true;\n    }\n    return false;\n  }\n  return { menu, startNew, continueCase, loaded, retry, message,\n    snapshot: () => ({ active, chapter: chapter ? copy(chapter) : null, startSent, mainStarted }) };\n}\n","src/music/install.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { createMusicController } from 'https://roc-offline.invalid/src/music/controller.js';\nimport { MUSIC_TRACKS, MUSIC_SE ve',id:b.dataset.reserve},b.dataset.reserve);});\r\ndocument.querySelectorAll('[data-tool]').forEach(button=>{button.querySelector('.tool-icon').innerHTML=icon({remove:'folder',undo:'undo',shuffle:'shuffle'}[button.dataset.tool]);button.addEventListener('click',()=>{if(isDealing)return;const result=perform({type:'tool',tool:button.dataset.tool});if(!result.error&&button.dataset.tool==='shuffle')void deal('shuffle');});});\r\nfunction restart(){if(!isDealing)perform({type:'retry'});}\r\n$('#restart-round').addEventListener('click',restart);\r\n$('#resume-investigation').addEventListener('click',()=>{if(!isDealing)perform({type:'resumeInvestigation'});});\r\nfunction fastClear(){\r\n  pickMotion.cancel();cancelDeal();pendingDeal=null;\r\n  const result=perform({type:'fastClear'});\r\n  if(!result.error&&result.state.board.status==='cleared'&&!result.events.some(event=>event.type==='board-reward'))feedback(result.state.boardMode==='cash'?'本局清盘奖励已结算':'本月调查清盘奖已领取');\r\n}\r\n$('#fast-clear-round').addEventListener('click',fastClear);\r\n$('#receipt-stack').addEventListener('click',event=>{const b=event.target.closest('[data-receipt]');if(b)readReceipt(b.dataset.receipt);});\r\n$('#close-reader').addEventListener('click',()=>$('#paper-reader').close());$('#document-hint').addEventListener('click',()=>{$('#document-hint-text').hidden=!$('#document-hint-text').hidden;});\r\n$('#open-questions').addEventListener('click',()=>navigateScene('./investigation-cards.html'));$('#open-account').addEventListener('click',openFundsStatement);$('#month-action').addEventListener('click',showMonth);\r\ndocument.querySelectorAll('[data-close-dialog]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.closeDialog).close()));\r\n\r\nconst tutorial = $('#tutorial-dialog');\r\nconst tutorialPages = [...tutorial.querySelectorAll('.tutorial-page')];\r\nconst tutorialPrevious = $('#tutorial-previous'), tutorialNext = $('#tutorial-next');\r\nlet tutorialPage = 0;\r\nfunction showTutorialPage(page) {\r\n  if (page \u003c 0 || page >= tutorialPages.length) return;\r\n  const focused = document.activeElement;\r\n  tutorialPages[tutorialPage].hidden = true;\r\n  tutorialPage = page;\r\n  tutorialPages[page].hidden = false;\r\n  tutorialPrevious.disabled = page === 0;\r\n  tutorialNext.disabled = page === tutorialPages.length - 1;\r\n  $('#tutorial-count').textContent = `${page + 1} / ${tutorialPages.length}`;\r\n  if (focused === tutorialPrevious && tutorialPrevious.disabled) tutorialNext.focus();\r\n  if (focused === tutorialNext && tutorialNext.disabled) tutorialPrevious.focus();\r\n}\r\n$('#open-tutorial').addEventListener('click', () => { showTutorialPage(0); tutorial.showModal(); });\r\ntutorialPrevious.addEventListener('click', () => showTutorialPage(tutorialPage - 1));\r\ntutorialNext.addEventListener('click', () => showTutorialPage(tutorialPage + 1));\r\ntutorial.addEventListener('keydown', event => {\r\n  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;\r\n  event.preventDefault();\r\n  showTutorialPage(tutorialPage + (event.key === 'ArrowLeft' ? -1 : 1));\r\n});\r\n\r\n$('#ledger-reset').addEventListener('click',()=>{\r\n  $('#paper-reader').close();$('#month-title').textContent='重新调查';$('#month-content').innerHTML='\u003cp class=\"month-note\">将从4月重新开始。当前记录会保留一份备份。\u003c/p>\u003cdiv class=\"chapter-actions\">\u003cbutton data-month-action=\"reset\">确认重新调查\u003c/button>\u003c/div>';$('#month-dialog').showModal();\r\n});\r\n$('#month-content').addEventListener('click',event=>{\r\n  const action=event.target.closest('[data-month-action]')?.dataset.monthAction;if(!action)return;\r\n  if(action==='reset'){$('#month-dialog').close();openedWindows.clear();const reset=newChapter();if(chapterMode)postOffline(window.parent, {type:'chapter:case-reset',caseSeed:reset.seed},location.origin);openSubscription();return;}\r\n  if(action==='next'){if(!perform({type:'nextMonth'}).error){$('#month-dialog').close();openSubscription();}return;}\r\n  $('#month-dialog').close();navigateScene(action==='summary'?'./investigation-cards.html?summary=1':'./investigation-cards.html');\r\n});\r\nnew ResizeObserver(fitBoard).observe($('.board-space'));\r\nwindow.addEventListener('resize',()=>{\r\n  pickMotion.cancel();\r\n  if(isDealing){finishDeal();cancelDeal();}\r\n});\r\nfunction activateDesk(ctx={}){\r\n    if(!chapterInitialized)return;\r\n    current=refresh();render();deliverNext();\r\n    const privateRequest=new URL(ctx.url||location.href,location.href).searchParams.get('investment')==='private';\r\n    if(privateRequest&&!current.complete&&current.invitation.offered&&current.invitation.status==='pending'&&current.invitation.month===current.month){openSubscription('private');return;}\r\n    if(current.window==='invest'&&!openedWindows.has(current.month))openSubscription();\r\n    else if(current.window==='investigation'&&current.board.status==='playing'&&(pendingDeal||!alreadySeen()))void deal(pendingDeal||'new-month');\r\n    if(getSaveIssue())toast(getSaveIssue());\r\n}\r\nregisterSceneLifecycle({\r\n  refresh(){current=refresh();render();},\r\n  activate:activateDesk,\r\n  deactivate(){pickMotion.cancel();cancelDeal();pauseDelivery();monthlyContracts.close();subscription.close();for(const dialog of document.querySelectorAll('dialog[open]'))dialog.close();},\r\n});\r\nwindow.addEventListener('pagehide',()=>{clearInterval(chapterReadyTimer);pickMotion.cancel();cancelDeal();pauseDelivery();clearTimeout(toastTimer);clearTimeout(feedbackTimer);});\r\nwindow.addEventListener('scene:navigation-error',()=>toast('场景未能完整载入，请再试一次。'));\r\nrender();markSceneReady();\r\nif(chapterMode){\r\n  const bridge=createMainChapterBridge({origin:location.origin,getParent:()=>parent,\r\n    begin(payload){\r\n      const result=beginChapter({type:'chapter:start-main',...payload});if(result.error){toast(result.error);return false;}\r\n      chapterInitialized=true;current=result.state;render();\r\n      queueMicrotask(()=>{\r\n        activateDesk({url:location.href});\r\n        if(current.complete||current.cardFlow.reportUnlockedBySkip)navigateScene('./investigation-cards.html?summary=1');\r\n      });\r\n      return true;\r\n    },post:(message,origin)=>{clearInterval(chapterReadyTimer);postOffline(parent, message,origin);}});\r\n  window.addEventListener('message',event=>bridge.message(event));\r\n  const ready=()=>postOffline(parent, {type:'chapter:main-ready'},location.origin);\r\n  ready();chapterReadyTimer=setInterval(ready,700);\r\n  window.addEventListener('chapter:scene-ending',event=>{\r\n    const data=event.detail;\r\n    if(!chapterInitialized)return;\r\n    // The desk sleeps while the question scene is active. Read the committed\r\n    // report before relaying its ending, rather than using the hidden desk's cache.\r\n    current=refresh();\r\n    if(current.complete && data?.caseSeed===current.seed)postOffline(parent, data,location.origin);\r\n  });\r\n}\r\n","src/body/tile-art.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\nimport { icon } from 'https://roc-offline.invalid/src/icons.js';\n\n// Match the existing ink outlines, faded paper and muted red financial artwork.\nconst EXTRA = {\n  stock: '\u003cpath d=\"M9 53h46M12 47V32h8v15m8 0V23h8v24m8 0V12h8v35\" fill=\"#b9aa8c\"/>\u003cpath d=\"m9 27 14-9 11 3L53 7m-12 0h12v12\" stroke=\"#793a30\" stroke-width=\"3.2\"/>',\n  bond: '\u003cpath d=\"M10 8h43v48H10Z\" fill=\"#d2c5a8\"/>\u003cpath d=\"M15 13h33v38H15Zm5 8h23m-23 6h16m-16 6h23\"/>\u003ccircle cx=\"38\" cy=\"44\" r=\"8\" fill=\"#843c32\"/>\u003cpath d=\"m33 50-2 11 7-4 7 4-2-11\" fill=\"#843c32\"/>',\n  bank: '\u003cpath d=\"m5 21 27-15 27 15Z\" fill=\"#b5aa91\ ill=\"#7b302c\"/>\u003cpath d=\"m32 33 6 8m-6 0 6-8\" stroke=\"#ba8c75\"/>',\n  arrow: '\u003cpath d=\"M51 32H12m17-17L12 32l17 17\"/>',\n  undo: '\u003cpath d=\"M24 12 8 27l16 14M9 27h27c21 0 21 28 3 28\"/>',\n  shuffle: '\u003cpath d=\"M8 17h9c14 0 17 30 30 30h10M8 47h9c14 0 17-30 30-30h10M47 7l10 10-10 10m0 10 10 10-10 10\"/>',\n  book: '\u003cpath d=\"M32 15C23 8 12 10 5 12v39c9-3 19-2 27 4 8-6 18-7 27-4V12c-7-2-18-4-27 3Zm0 0v40M12 22l12 1m-12 9 12 1m16-10 12-1m-12 11 12-1\"/>',\n  eye: '\u003cpath d=\"M4 32S15 14 32 14s28 18 28 18-11 18-28 18S4 32 4 32Z\"/>\u003ccircle cx=\"32\" cy=\"32\" r=\"9\"/>',\n  close: '\u003cpath d=\"m16 16 32 32m0-32L16 48\"/>',\n  check: '\u003cpath d=\"m12 33 13 13 28-29\"/>',\n  lock: '\u003crect x=\"13\" y=\"27\" width=\"38\" height=\"29\" rx=\"3\" fill=\"currentColor\" fill-opacity=\".12\"/>\u003cpath d=\"M21 27V17a11 11 0 0 1 22 0v10m-11 12v8\"/>',\n  help: '\u003ccircle cx=\"32\" cy=\"32\" r=\"25\"/>\u003cpath d=\"M23 24c0-13 22-13 19 1-1 6-10 6-10 15m0 7v2\"/>',\n  reset: '\u003cpath d=\"M12 24a23 23 0 1 1 1 24M12 8v16h16\"/>',\n  chevron: '\u003cpath d=\"m23 12 19 20-19 20\"/>',\n  grid: '\u003crect x=\"8\" y=\"8\" width=\"19\" height=\"19\" rx=\"2\"/>\u003crect x=\"37\" y=\"8\" width=\"19\" height=\"19\" rx=\"2\"/>\u003crect x=\"8\" y=\"37\" width=\"19\" height=\"19\" rx=\"2\"/>\u003crect x=\"37\" y=\"37\" width=\"19\" height=\"19\" rx=\"2\"/>',\n};\nexport function icon(name, className = '') { return `\u003csvg class=\"icon ${className}\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${drawings[name] || drawings.folder}\u003c/svg>`; }\n","src/board-deal-motion.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n// Presentation only. The saved board, tile kinds and game RNG are never changed.\n// Animate a bounded set of lightweight stand-ins instead of promoting every one\n// of the 240 SVG/filter-heavy game buttons to a separate compositor layer.\nconst activeDeals = new WeakMap();\nconst durations = { 'new-month': 3000, restart: 900, shuffle: 900 };\nconst MAX_MOVING_CARDS = 48;\nconst managedStyles = ['visibility', 'pointer-events'];\n\nfunction hash(value) {\n  let number = 2166136261;\n  for (const character of String(value)) {\n    number ^= character.charCodeAt(0);\n    number = Math.imul(number, 16777619);\n  }\n  return number >>> 0;\n}\nfunction fraction(id, salt) { return hash(`${id}:${salt}`) / 4294967296; }\nfunction transform(x = 0, y = 0, tilt = 0, turn = 0, scale = 1) {\n  return `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) perspective(1100px) rotateX(${tilt.toFixed(2)}deg) rotateZ(${turn.toFixed(2)}deg) scale(${scale.toFixed(3)})`;\n}\nfunction snapshotStyle(element) {\n  return managedStyles.map(property => [property, element.style.getPropertyValue(property), element.style.getPropertyPriority(property)]);\n}\nfunction restoreStyle(element, snapshot) {\n  for (const [property, value, priority] of snapshot) {\n    if (value) element.style.setProperty(property, value, priority);\n    else element.style.removeProperty(property);\n  }\n}\n\n// Keep the visible outline and all four regions. Most buried faces and the\n// tightly overlapping side-pile backs cannot contribute a useful moving pixel.\nfunction representatives(tiles) {\n  const budgets = { center: 34, buffer: 6, left: 4, right: 4 };\n  const sample = [.08, .5, .92];\n  const ranked = tiles.map(tile => {\n    let visible = 0;\n    for (const sx of sample) for (const sy of sample) {\n      const x = tile.left + tile.width * sx, y = tile.top + tile.height * sy;\n      if (!tiles.some(upper => upper.z > tile.z && x > upper.left && x \u003c upper.left + upper.width && y > upper.top && y \u003c upper.top + upper.height)) visible++;\n    }\n    return { tile, visible };\n  }).sort((a, b) => b.visible - a.visible || b.tile.z - a.tile.z);\n  const chosen = [];\n  for (const [region, limit] of Object.entries(budgets)) {\n    const members = ranked.filter(item => item.tile.region === region);\n    // A side pile uses a few evenly spaced backs plus its actual top face.\n    if ((region === 'left' || region === 'right') && members.length > limit) {\n      const byDepth = members.map(item => item.tile).sort((a, b) => a.z - b.z);\n      for (let n = 0; n \u003c limit; n++) chosen.push(byDepth[Math.round(n * (byDepth.length - 1) / (limit - 1))]);\n    } else chosen.push(...members.slice(0, limit).map(item => item.tile));\n  }\n  const selected = new Set(chosen);\n  for (const { tile, visible } of ranked) {\n    if (chosen.length >= MAX_MOVING_CARDS) break;\n    if (visible && !selected.has(tile)) { chosen.push(tile); selected.add(tile); }\n  }\n  return chosen.slice(0, MAX_MOVING_CARDS).sort((a, b) => a.z - b.z);\n}\nfunction monthlyFrames(tile, width, height) {\n  const id = tile.id, depth = fraction(id, 'desk-depth');\n  const x = width * (.08 + fraction(id, 'desk-x') * .84) - tile.centerX;\n  const y = height * (.49 + depth * .40) - tile.centerY;\n  const angle = (fraction(id, 'desk-angle') - .5) * 92, flat = 58 - depth * 8;\n  const packetX = width * (.46 + fraction(id, 'packet-x') * .08) - tile.centerX;\n  const packetY = height * (.51 + fraction(id, 'packet-y') * .09) - tile.centerY;\n  const packetAngle = (fraction(id, 'packet-angle') - .5) * 14;\n  return [\n    { offset: 0, transform: transform(x, y, flat, angle, .96) },\n    { offset: .13, transform: transform(x, y, flat, angle, .96), easing: 'cubic-bezier(.35,0,.25,1)' },\n    { offset: .49, transform: transform(x * .79, y * .66, 0, angle * .38, 1), easing: 'cubic-bezier(.5,0,.2,1)' },\n    { offset: .70, transform: transform(packetX, packetY, 0, packetAngle, .99), easing: 'cubic-bezier(.2,.65,.2,1)' },\n    { offset: .94, transform: transform(0, -2), easing: 'ease-out' },\n    { offset: 1, transform: transform() },\n  ];\n}\nfunction shuffleFrames(tile, width, height) {\n  const id = tile.id;\n  const x = width * (.43 + fraction(id, 'shuffle-x') * .14) - tile.centerX;\n  const y = height * (.43 + fraction(id, 'shuffle-y') * .14) - tile.centerY;\n  const angle = (fraction(id, 'shuffle-turn') - .5) * 20;\n  return [\n    { offset: 0, transform: transform(), easing: 'cubic-bezier(.45,0,.25,1)' },\n    { offset: .40, transform: transform(x, y, 0, angle, .98), easing: 'ease-in-out' },\n    { offset: .56, transform: transform(x + (fraction(id, 'shuffle-cut') - .5) * width * .09, y - height * .025, 0, -angle, .98), easing: 'cubic-bezier(.15,.7,.2,1)' },\n    { offset: .94, transform: transform(0, -1.5), easing: 'ease-out' },\n    { offset: 1, transform: transform() },\n  ];\n}\nfunction makeProxy(document, tile) {\n  const proxy = document.createElement('div');\n  proxy.className = tile.element.className;\n  proxy.innerHTML = tile.element.innerHTML;\n  proxy.setAttribute('aria-hidden', 'true');\n  Object.assign(proxy.style, {\n    position: 'absolute', left: `${tile.left}px`, top: `${tile.top}px`,\n    width: `${tile.width}px`, height: `${tile.height}px`, zIndex: String(tile.z),\n    visibility: 'visible', pointerEvents: 'none', transition: 'none',\n    translate: '0 0', transformOrigin: '50% 50%', willChange: 'transform',\n    // SVG + drop-shadow/brightness filters on 240 animated cards was the largest\n    // GPU/raster cost. Paint each of these few faces once, without filter layers.\n    filter: 'none', opacity: tile.element.classList.contains('covered') ? '.7' : '1',\n  });\n  return proxy;\n}\n\n/**\n * new-month: 3 seconds, flat scattered desk cards -> upright -> gather/redeal.\n * restart/shuffle: 0.9 seconds. All dimensions are read before any DOM writes.\n * Proxies are non-interactive and never carry data-tile IDs. The real, unchanged\n * final board is revealed in the same paint that removes the completed overlay.\n * Abort, resize, replacement and reduced motion always leave the board usable.\n */\nexport async function playBoardDeal(field, { mode = 'new-month', signal } = {}) {\n  if (!Object.hasOwn(durations, mode)) throw new TypeError(`Unknown board deal mode: ${mode}`);\n  const duration = durations[mode];\n  const result = (completed, reason) => ({ completed, mode, duration, reason });\n  if (!field?.querySelectorAll) return result(false, 'unavailable');\n  activeDeals.get(field)?.cancel('superseded');\n  if (signal?.aborted) return result(false, 'aborted');\n  const elements = [...field.querySelectorAll('button[data-tile]')];\n  if (!elements.length) return result(true, 'empty');\n  const document = field.ownerDocument, view = document?.defaultView ?? globalThis;\n  if (view.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return result(true, 'reduced-motion');\n  if (!field.isConnected || !document?.createElement || elements.some(element => typeof element.animate !== 'function')) return result(true, 'unavailable');\n  const width = field.clientWidth, height = field.clientHeight;\n  if (!width || !height) return result(true, 'unavailable');\n  const tiles = elements.map(element => {\n    const left = element.offsetLeft, top = element.offsetTop;\n    const width = element.offsetWidth, height = element.offsetHeight;\n    return { element, id: element.dataset.tile, region: element.dataset.region || 'center',\n      left, top, width, height, centerX: left + width / 2, centerY: top + height / 2,\n      z: Number(element.style.zIndex) || 0, style: snapshotStyle(element) };\n  });\n  const moving = representatives(tiles), hadInert = field.hasAttribute('inert');\n  const animations = [], layer = document.createElement('div');\n  layer.className = 'board-deal-layer';\n  layer.setAttribute('aria-hidden', 'true');\n  layer.inert = true;\n  Object.assign(layer.style, { position: 'absolute', inset: '0', pointerEvents: 'none', zIndex: '100', contain: 'layout style', isolation: 'isolate' });\n  let done = false, resizeObserver, mutationObserver, resolveCompletion;\n  const completion = new Promise(resolve => { resolveCompletion = resolve; });\n  const operation = { cancel: reason => finish(false, reason) };\n  function finish(completed, reason) {\n    if (done) return;\n    done = true;\n    resizeObserver?.disconnect(); mutationObserver?.disconnect();\n    view.removeEventListener?.('resize', onResize); signal?.removeEventListener('abort', onAbort);\n    animations.forEach(animation => animation.cancel());\n    layer.remove();\n    tiles.forEach(tile => restoreStyle(tile.element, tile.style));\n    if (!hadInert) field.removeAttribute('inert');\n    if (activeDeals.get(field) === operation) activeDeals.delete(field);\n    resolveCompletion(result(completed, reason));\n  }\n  function onResize() { if (field.clientWidth !== width || field.clientHeight !== height) finish(false, 'resized'); }\n  function onAbort() { finish(false, 'aborted'); }\n  activeDeals.set(field, operation);\n  field.setAttribute('inert', '');\n  signal?.addEventListener('abort', onAbort, { once: true });\n  view.addEventListener?.('resize', onResize, { passive: true });\n  if (view.ResizeObserver) { resizeObserver = new view.ResizeObserver(onResize); resizeObserver.observe(field); }\n  try {\n    for (const tile of moving) {\n      const proxy = makeProxy(document, tile);\n      layer.append(proxy);\n      const stagger = fraction(tile.id, 'delay') * (mode === 'new-month' ? 80 : 40);\n      const frames = mode === 'new-month' ? monthlyFrames(tile, width, height) : shuffleFrames(tile, width, height);\n      const animation = proxy.animate(frames, { duration: duration - stagger, delay: stagger, fill: 'both', easing: 'linear' });\n      animations.push(animation);\n    }\n    // Append once, after the lightweight overlay is fully assembled. No forced\n    // layout/geometry reads occur after this point or on an animation frame.\n    field.append(layer);\n    tiles.forEach(tile => {\n      tile.element.style.setProperty('visibility', 'hidden', 'important');\n      tile.element.style.setProperty('pointer-events', 'none', 'important');\n    });\n    if (view.MutationObserver) {\n      mutationObserver = new view.MutationObserver(() => {\n        if (!field.contains(layer) || elements.some(element => !field.contains(element))) finish(false, 'replaced');\n      });\n      mutationObserver.observe(field, { childList: true, subtree: false });\n    }\n    Promise.all(animations.map(animation => animation.finished.then(() => true, () => false))).then(status => {\n      finish(status.every(Boolean), status.every(Boolean) ? 'complete' : 'cancelled');\n    });\n  } catch {\n    animations.forEach(animation => animation.finished.catch(() => {}));\n    finish(false, 'unavailable');\n  }\n  return completion;\n}\r\n","src/board-pick-motion.js":"const __roc=window.__roc; const postOffline=(target,message)=>{if(__roc.owns(target))target.postMessage(message,\"*\");}; const location=__roc.location(window); const history=__roc.history(window); const localStorage=__roc.storage; const URL=__roc.URL; const fetch=(value,...args)=>__roc.fetch(window,value,...args);\n// Small visual copies only. Picking and matching remain synchronous game actions.\nconst FLIGHT_MS = 200, MATCH_MS = 150, MAX_GROUPS = 3;\nconst rectangle = value => value && ['left','top','width','height'].every(key => Number.isFinite(value[key]))\n  && value.width > 0 && value.height > 0;\n\nexport function createBoardPickMotion({ host = globalThis.document?.body, reducedMotion = false } = {}) {\n  const groups = new Set();\n  function cancel() { for (const group of [...groups]) group.cleanup(); }\n  function play({ source, destination, matched = [] } = {}) {\n    const document = host?.ownerDocument, view = document?.defaultView;\n    const target = destination?.rect ?? dest
